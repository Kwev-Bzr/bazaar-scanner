<style>
  :root {
    --fond:      #140c06;
    --fond-haut: #241608;
    --laiton:    #f0c060;
    --laiton-bas:#8a6a34;
    --texte:     #e8dcc4;
    --discret:   #97866a;
    --trait:     #4a3418;
    --vif:       #6ee08a;
    --attente:   #e0a840;
    --alerte:    #e06a5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(120% 80% at 50% 0%, var(--fond-haut) 0%, var(--fond) 60%);
    color: var(--texte);
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 22px 54px;
    overflow-y: auto;
    overflow-x: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .22em;
    text-indent: .22em;
    background: linear-gradient(175deg, #ffe6a8 0%, var(--laiton) 45%, var(--laiton-bas) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .signature {
    font-size: 11px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--discret);
    margin-top: 3px;
  }

  .filet {
    width: 74px;
    height: 1px;
    margin: 12px 0 20px;
    background: linear-gradient(90deg, transparent, var(--trait), transparent);
  }

  .plateau {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    width: 100%;
  }

  .cadre {
    position: relative;
    width: 100%;
    max-width: 820px;
    border: 1px solid var(--trait);
    border-radius: 7px;
    padding: 15px 12px 11px;
    margin: 0 auto 11px;
  }

  .cadre > h2 {
    position: absolute;
    top: -9px;
    left: 13px;
    margin: 0;
    padding: 0 7px;
    background: var(--fond);
    font: 600 10.5px/1 'Rajdhani', Arial, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--laiton);
    white-space: nowrap;
    max-width: calc(100% - 40px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cadre.adverse { border-color: #2c3f4a; }
  .cadre.adverse > h2 { color: #8fb4c9; }

  .cadre .plateau { min-height: 54px; }
  .cadre .talents { min-height: 30px; }

  .case {
    height: 54px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
  }

  .objet {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3px 4px;
    overflow: hidden;
    border: 1px solid var(--laiton-bas);
    border-radius: 2px;
    background: linear-gradient(180deg, #3a2810, #1c1206);
    font-size: 11px;
    line-height: 1.2;
    text-align: center;
    color: var(--texte);
    word-break: break-word;
    hyphens: auto;
  }

  .objet.t-Bronze    { border-color: #cd7f32; }
  .objet.t-Silver    { border-color: #c8c8c8; }
  .ench {
    display: block;
    width: 100%;
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--laiton-bas);
    margin-bottom: 1px;
  }

  .objet.t-Gold      { border-color: #f0c060; }
  .objet.t-Diamond   { border-color: #a8d8f8; }
  .objet.t-Legendary { border-color: #f08040; }

  .objet.enchante { box-shadow: inset 0 0 0 1px var(--ench, rgba(192,96,240,.55)); }
  .objet.enchante .ench { color: var(--ench, var(--laiton-bas)); }

  .emplacement {
    display: block;
    font-size: 9px;
    letter-spacing: .02em;
    opacity: .9;
  }

  .em-C { color: #c69c6c; }   /* ralentissement */
  .em-D { color: #f0c820; }   /* bouclier */
  .em-E { color: #88e830; }   /* soin */
  .em-F { color: #68e8c0; }   /* hâte */
  .em-G { color: #c060f0; }   /* tempo */
  .em-A { color: #f05038; }   /* dégâts */
  .em-B { color: #f89840; }   /* brûlure */
  .em-Stove  { color: #f89840; }
  .em-Cooler { color: #38c8f0; }

  .e-Golden      { --ench: #f0c060; }
  .e-Heavy       { --ench: #9a8f7a; }
  .e-Icy         { --ench: #7fd3ff; }
  .e-Turbo       { --ench: #4fe0a0; }
  .e-Shielded    { --ench: #ffd24a; }
  .e-Restorative { --ench: #7ee08a; }
  .e-Toxic       { --ench: #7ad13f; }
  .e-Fiery       { --ench: #ff7a3c; }
  .e-Shiny       { --ench: #e8e0ff; }
  .e-Deadly      { --ench: #ff5a6e; }
  .e-Radiant     { --ench: #fff3b0; }
  .e-Obsidian    { --ench: #b06cff; }
  .e-Mossy       { --ench: #8fbf6a; }

  .talents {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    width: 100%;
  }

  .talent {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 34px;
    padding: 3px 8px;
    border: 1px solid var(--trait);
    border-radius: 9px;
    background: #0d0703;
    font-size: 11px;
    color: var(--discret);
  }

  /* Les cinq paliers. Le bronze et le légendaire manquaient : un talent
     légendaire prenait donc l'apparence neutre, indistinguable d'un bronze. */
  .talent.t-Bronze    { border-color: #7a4e28; color: #c99a6a; }
  .talent.t-Silver    { border-color: #6a6a6a; color: #d0d0d0; }
  .talent.t-Gold      { border-color: #8a6a34; color: #d8bd86; }
  .talent.t-Diamond   { border-color: #5d7d95; color: #bcd8ea; }
  .talent.t-Legendary { border-color: #a05428; color: #f0a070; }

  .vide {
    font-size: 12px;
    color: var(--discret);
    margin-bottom: 10px;
    height: 15px;
  }

  .etat {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 9px 14px;
    border: 1px solid var(--trait);
    border-radius: 3px;
    background: rgba(0, 0, 0, .3);
  }

  .voyant {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--discret);
    flex: none;
  }

  .etat[data-code="pret"]    .voyant { background: var(--vif);
    box-shadow: 0 0 9px rgba(110, 224, 138, .8); animation: pulse 2.4s ease-in-out infinite; }
  .etat[data-code="attente"] .voyant,
  .etat[data-code="config"]  .voyant,
  .etat[data-code="jeu"]     .voyant { background: var(--attente); }
  .etat[data-code="erreur"]  .voyant { background: var(--alerte);
    box-shadow: 0 0 9px rgba(224, 106, 90, .7); }

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  @media (prefers-reduced-motion: reduce) { .voyant { animation: none !important } }

  .libelle { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .precision { font-size: 12px; color: var(--discret); margin-top: 7px; min-height: 15px; }

  .pousse { flex: 1 }

  .lien {
    background: none;
    border: 0;
    color: var(--discret);
    font: inherit;
    font-size: 12px;
    letter-spacing: .16em;
    cursor: pointer;
    padding: 6px;
  }
  .lien:hover { color: var(--laiton); }

  #bascule {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .chevron {
    display: inline-flex;
    transition: transform .22s ease;
  }

  #bascule.ouvert .chevron { transform: rotate(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }

  .reglages {
    width: 100%;
    /* Même largeur que la visualisation du plateau : à 460 px, l'explication
       du délai se brisait en lignes d'un seul mot. */
    max-width: 820px;
    display: none;
    flex-direction: column;
    /* Les sections étaient trop serrées : « Délai » semblait appartenir au
       bloc précédent. */
    gap: 20px;
    padding-top: 16px;
    margin-top: 6px;
    border-top: 1px solid var(--trait);
  }
  .reglages.ouvert { display: flex; }

  label { font-size: 14px; letter-spacing: .16em; color: var(--discret); display: block; margin-bottom: 4px; }

  input {
    width: 100%;
    padding: 7px 9px;
    background: #0d0703;
    border: 1px solid var(--trait);
    border-radius: 2px;
    color: var(--texte);
    font: inherit;
    font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--laiton-bas); }

  button.valider {
    padding: 9px;
    background: linear-gradient(180deg, #6a4d1c, #4a3414);
    border: 1px solid var(--laiton-bas);
    border-radius: 2px;
    color: var(--laiton);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .12em;
    cursor: pointer;
  }
  button.valider:hover { background: linear-gradient(180deg, #7d5c22, #573d18); }
  button.valider { width: 100%; }

  .compte {
    flex: 1;
    min-width: 0;
    padding: 7px 9px;
    background: #0d0703;
    border: 1px solid var(--trait);
    border-radius: 2px;
    font-size: 16px;
    color: var(--discret);
  }
  .compte.lie { color: var(--vif); }

  .lien.discret { display: block; width: 100%; text-align: center; margin-top: 7px; }

  button.avec-icone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 4px;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }

  #enregistrer {
    background: #16100a;
    border-color: var(--trait);
    color: var(--discret);
    cursor: default;
  }

  #enregistrer.modifie {
    background: linear-gradient(180deg, #7a4c12, #52320c);
    border-color: var(--attente);
    color: #ffe0a0;
    cursor: pointer;
  }
  #enregistrer.modifie:hover { background: linear-gradient(180deg, #8d5915, #613b0e); }

  #enregistrer.sauve {
    background: linear-gradient(180deg, #1d4a28, #12301a);
    border-color: var(--vif);
    color: var(--vif);
    cursor: default;
  }

  #alerte-version {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    padding: 7px 14px;
    background: #2a1608;
    border-bottom: 1px solid var(--laiton-bas);
    color: var(--laiton);
    font-size: 12px;
    text-align: center;
  }
  #alerte-version a { color: var(--laiton); margin-left: 10px; }

  .delai { display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
           justify-content: center; }

  .delai button {
    padding: 4px 10px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: transparent;
    color: var(--discret);
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .delai button:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .delai button.actif {
    color: var(--laiton);
    border-color: var(--laiton);
    background: #241706;
  }
  /* Les petites flèches natives du champ numérique sont laides et inutiles :
     on saisit un nombre de secondes, on ne l'incrémente pas une par une. */
  .delai input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .delai input[type="number"]::-webkit-outer-spin-button,
  .delai input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .delai input[type="number"] {
    width: 58px;
    padding: 3px 4px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--laiton);
    font-family: inherit;
    text-align: right;
  }
  .delai-unite { font-size: 15px; color: var(--discret); }

  /* L'explication se lit en entier : mieux vaut une taille confortable et un
     interligne aéré qu'un bloc compact. */
  .aide { font-size: 15px; line-height: 1.5; color: var(--discret);
          margin-top: 16px; text-align: center; }

  /* Le second paragraphe de l'explication respire. */
  .aide .para { margin-top: 14px; }

  .adverse .objet,
  .adverse .talent { background: #0a1116; }
  .adverse .case { border-color: #24333c; background: #080d11; }

  .plateau.centre {
    display: flex;
    justify-content: center;
    gap: 5px;
  }
  .plateau.centre .objet { flex: 0 0 auto; min-width: 92px; }

  .adverse .objet.rencontre {
    border-style: dashed;
    opacity: .82;
  }

  .plateau.libre {
    display: block;
    position: relative;
    height: 54px;
  }
  .plateau.libre .objet {
    position: absolute;
    top: 0;
    height: 36px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .talents {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 5px;
    justify-content: center;
  }

  .plateau.reserve .objet { border-style: dotted; }

  .ligne-champ { display: flex; gap: 5px; }
  .ligne-champ input { flex: 1; min-width: 0; }

  .parcourir {
    flex: none;
    padding: 0 10px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--discret);
    font: inherit;
    font-size: 14px;
    letter-spacing: .08em;
    cursor: pointer;
    white-space: nowrap;
  }
  .parcourir:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .parcourir:disabled { opacity: .5; cursor: default; }

  .calibrage {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 16px 20px 18px;
    background: var(--fond);
  }
  .calibrage.ouvert { display: flex; }

  .cal-titre {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 15px;
    letter-spacing: .08em;
    color: var(--laiton);
  }
  .cal-consigne { font-size: 12px; color: var(--discret); margin-top: 3px; min-height: 15px; }

  .cal-scene {
    position: relative;
    flex: none;
    aspect-ratio: 16 / 9;
    width: 100%;
    max-width: min(100%, calc((100vh - 230px) * 16 / 9));
    margin: auto;
    background: #0a0603 center/100% 100% no-repeat;
    border: 1px solid var(--trait);
    border-radius: 3px;
    overflow: hidden;
    outline: none;
    user-select: none;
  }

  .cal-vide {
    position: absolute;
    inset: 0 0 auto 0;
    display: grid;
    justify-items: center;
    gap: 6px;
    text-align: center;
    font-size: 13px;
    color: var(--discret);
    padding: 22px 20px 0;
  }
  .cal-scene.remplie .cal-vide { display: none; }

  .cal-retirer {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid var(--trait);
    border-radius: 50%;
    background: rgba(10, 7, 3, .8);
    color: var(--discret);
    cursor: pointer;
    backdrop-filter: blur(2px);
  }
  .cal-retirer:hover { color: var(--alerte); border-color: var(--alerte); }

  .cal-vide .lien {
    font-size: 13px;
    letter-spacing: normal;
    padding: 2px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .cal-cadre {
    position: absolute;
    border: 2px solid var(--laiton);
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45);
    cursor: move;
  }

  .poignee {
    position: absolute;
    width: 14px;
    height: 14px;
    background: var(--laiton);
    border-radius: 2px;
  }
  .poignee.nw { left: -8px; top: -8px;    cursor: nwse-resize; }
  .poignee.ne { right: -8px; top: -8px;   cursor: nesw-resize; }
  .poignee.sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
  .poignee.se { right: -8px; bottom: -8px; cursor: nwse-resize; }

  .cal-zones { position: absolute; inset: 0; pointer-events: none; }
  .cal-zones div {
    position: absolute;
    box-sizing: border-box;
    padding: 0;
    border: 1px solid rgba(110, 224, 138, .9);
    background: rgba(110, 224, 138, .16);
    border-radius: 2px;
  }

  .cal-zones div.zone-talent {
    border-color: rgba(240,192,96,.9);
    background: rgba(240,192,96,.16);
  }

  .cal-zones div.repere { border: 0; background: none; }
  .cal-zones div.cercle {
    border: 1px solid rgba(255, 90, 120, .95);
    border-radius: 50%;
  }
  .cal-zones div.equerre { border: 0; }
  .cal-zones div.equerre.tr {
    border-top: 1px solid rgba(255, 90, 120, .95);
    border-right: 1px solid rgba(255, 90, 120, .95);
  }
  .cal-zones div.equerre.tl {
    border-top: 1px solid rgba(255, 90, 120, .95);
    border-left: 1px solid rgba(255, 90, 120, .95);
  }

  .cal-aide { font-size: 15px; color: var(--discret); text-align: center; min-height: 14px; }
  .cal-boutons { display: flex; align-items: center; gap: 8px; }

  /* Vide, l'avis ne doit pas creuser un écart plus grand sous « Compte
     Twitch » que sous les autres sections. */
  .avis { font-size: 15px; color: var(--attente); }
  .avis:not(:empty) { margin-top: 8px; }
  .avis.bon { color: var(--vif); }

  /* En bas à gauche, le sélecteur passait sous le panneau élargi. En haut à
     droite, il reste atteignable quelle que soit la hauteur du contenu. */
  /* En bas à gauche, le sélecteur passait sous le panneau élargi. En haut à
     droite, il reste atteignable quelle que soit la hauteur du contenu.

     Il se glisse SOUS le bandeau de version et sous le calibrage, qui
     occupent le même coin : mieux vaut qu'il disparaisse un instant que
     d'empêcher de lire une alerte. */
  .langues {
    position: fixed;
    top: 12px;
    right: 14px;
    z-index: 40;
    display: flex;
    gap: 6px;
  }

  /* Le bandeau de version descend le sélecteur plutôt que de le masquer. */
  body:has(#alerte-version:not([hidden])) .langues { top: 46px; }

  /* Pendant le calibrage, il s'efface : l'écran entier appartient au réglage. */
  body:has(.calibrage.ouvert) .langues { display: none; }

  .langues { align-items: center; }
  .langues .globe { color: var(--discret); opacity: .75; flex: none;
                    font-size: 18px; }

  .langues select {
    padding: 7px 11px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--discret);
    font: inherit;
    font-size: 16px;
    cursor: pointer;
    opacity: .75;
  }
  /* Le menu déroulant du système n'hérite pas toujours de la taille du
     sélecteur : on la lui impose. */
  .langues select option { font-size: 16px; }
  .langues select:hover, .langues select:focus {
    opacity: 1;
    color: var(--laiton);
    border-color: var(--laiton-bas);
    outline: none;
  }
</style>

  <h1>BAZAAR SCANNER</h1>
  <div class="signature">BY KWEV</div>
  <div class="filet"></div>

  <!-- Ce qui fait face au joueur, au-dessus de son propre plateau : d'abord
       les talents de l'adversaire, puis la bande de dix emplacements qui sert
       tour à tour de boutique, de plateau adverse ou d'événement. -->
  <!-- Quatre cadres fixes plutôt que des rangées qui apparaissent et
       disparaissent : la fenêtre ne bouge plus, et l'œil sait où regarder. -->
  <section class="cadre adverse" id="cadre-face-talents">
    <h2 id="titre-face-talents">Talents adverses</h2>
    <div class="talents adverse" id="face-talents"></div>
  </section>

  <section class="cadre adverse" id="cadre-face">

    <div class="plateau adverse" id="face"></div>
  </section>

  <section class="cadre" id="cadre-plateau">
    <h2 id="titre-plateau">Ton plateau</h2>
    <div class="plateau" id="plateau"></div>
  </section>

  <section class="cadre" id="cadre-talents">
    <h2 id="titre-talents">Tes talents</h2>
    <div class="talents" id="talents"></div>
  </section>
  <div class="vide" id="vide"></div>

    <span class="libelle" id="libelle">Démarrage…</span>
  </div>
  <div class="precision" id="precision"></div>

  <div class="pousse"></div>

  <button class="lien" id="bascule">
    <span id="bascule-texte">CONFIGURATION</span>
    <span class="chevron" aria-hidden="true">
      <svg viewBox="0 0 12 12" width="9" height="9" fill="none"
           stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8l4-4 4 4"/>
      </svg>
    </span>
  </button>
  <div class="langues" id="langues"></div>

  <div class="reglages" id="reglages">
    <div>
      <label id="l-compte">COMPTE TWITCH</label>
      <div class="ligne-champ">
        <div class="compte" id="compte"></div>
        <button class="parcourir" id="connecter">SE CONNECTER</button>
      </div>
      <div class="avis" id="avis"></div>
    </div>
    <div>
      <label for="jeu" id="l-jeu">DOSSIER DU JEU</label>
      <div class="ligne-champ">
        <input type="text" id="jeu" placeholder="détecté automatiquement" autocomplete="off">
        <button class="parcourir" id="parcourir">PARCOURIR…</button>
      </div>
    </div>
    <div>
      <label id="l-delai">DÉLAI DE TON STREAM</label>
      <div class="delai" id="delai">
        <button type="button" data-delai="0"></button>
        <button type="button" data-delai="2"></button>
        <button type="button" data-delai="10"></button>
        <button type="button" data-delai="30"></button>
        <button type="button" data-delai="60"></button>
        <button type="button" data-delai="libre" id="b-libre"></button>
        <input type="number" id="n-delai" min="0" step="1" value="0">
        <span class="delai-unite">s</span>
      </div>
      <div class="aide" id="delai-aide"></div>
    </div>
    <div>
      <label id="l-cadrage">CADRAGE</label>
      <div id="etat-cadre" hidden></div>
      <button class="valider" id="calibrer">CALIBRER L'AFFICHAGE</button>
    </div>
  </div>

  <div class="calibrage" id="calibrage">
    <div class="cal-entete">
      <div class="cal-titre" id="cal-titre">Où se trouve le jeu dans ton stream ?</div>
      <div class="cal-consigne" id="cal-consigne"></div>
    </div>

    <div class="cal-scene" id="cal-scene" tabindex="0">
      <div class="cal-vide" id="cal-vide">
        <div id="cal-colle"></div>
        <button class="lien" id="cal-fichier"></button>
        <input type="file" id="cal-input" accept="image/*" hidden>
      </div>
      <button class="cal-retirer" id="cal-retirer" hidden>
        <svg viewBox="0 0 14 14" width="11" height="11" fill="none"
             stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
             aria-hidden="true"><path d="M3 3l8 8M11 3l-8 8"/></svg>
      </button>
      <div class="cal-cadre" id="cal-cadre">
        <span class="poignee nw"></span><span class="poignee ne"></span>
        <span class="poignee sw"></span><span class="poignee se"></span>

      <div class="cal-zones" id="cal-zones"></div>
    </div>

    <div class="cal-aide" id="cal-aide"></div>

    <div class="cal-boutons">
      <button class="lien" id="cal-plein"></button>
      <div style="flex:1"></div>
      <button class="lien" id="cal-annuler"></button>
      <button class="valider" id="cal-valider" style="width:auto;padding:9px 22px"></button>
    </div>
  </div>

  var CLE_LANGUE = 'bazaar-scanner-langue-interface';

  function langueChoisie() {
    try {
      var v = window.localStorage.getItem(CLE_LANGUE);
      return TEXTES[v] ? v : null;
    } catch (e) { return null; }
  }

  var LANGUE = langueChoisie()
            || (navigator.language || 'en').slice(0, 2).toLowerCase();
  if (!TEXTES[LANGUE]) LANGUE = 'en';
  var T = TEXTES[LANGUE];

  document.documentElement.lang = LANGUE;

  var LIBELLES = {
    demarrage: T.demarrage, config: T.config, jeu: T.jeu,
    attente: T.attente, pret: T.pret, erreur: T.erreur,
  };

  document.getElementById('bascule-texte').textContent = T.configuration;
  document.getElementById('l-compte').textContent  = T.compteTwitch;

  /* Sans cette ligne, le texte du balisage — en français — restait affiché
     tant que la configuration n'était pas revenue du serveur. */
  var elCompteInit = document.getElementById('compte');
  if (elCompteInit && !elCompteInit.textContent.trim()) {
    elCompteInit.textContent = T.nonConnecte;
  }
  document.getElementById('connecter').textContent = T.seConnecter;
  document.getElementById('l-jeu').textContent     = T.dossierJeu;
  document.getElementById('jeu').placeholder       = T.detecte;
  document.getElementById('parcourir').textContent   = T.parcourir;
  document.getElementById('libelle').textContent     = T.demarrage;

  var NOMS_LANGUE = {
    en: 'English', fr: 'Français', de: 'Deutsch',    es: 'Español',
    it: 'Italiano', pt: 'Português', ko: '한국어', zh: '中文',
  };

  var ORDRE = ['en', 'fr', 'de', 'es', 'it', 'pt', 'ko', 'zh'];

  (function construireLangues() {
    var boite = document.getElementById('langues');
    var dispo = ORDRE.filter(function (l) { return TEXTES[l]; });

    boite.insertAdjacentHTML('beforeend',
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" '
      + 'stroke="currentColor" stroke-width="1.4" class="globe">'
      + '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/>'
      + '<path d="M3.2 9h17.6M3.2 15h17.6"/></svg>');

    var sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Langue');
    dispo.forEach(function (l) {
      var o = document.createElement('option');
      o.value = l;
      o.textContent = NOMS_LANGUE[l] || l.toUpperCase();
      if (l === LANGUE) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      if (sel.value === LANGUE) return;
      try { window.localStorage.setItem(CLE_LANGUE, sel.value); } catch (e) { /* tant pis */ }
      location.reload();
    });
    boite.appendChild(sel);
  })();

  function dessinerBande(cartes, choix, centre) {
    if (choix && choix.length >= 2) {
      var ordonnes = choix.slice().sort(function (a, b) {
        return (a.x || 0) - (b.x || 0);
      });
      var debut = Math.max(0, Math.floor((10 - ordonnes.length * 2) / 2));
      var places = ordonnes.map(function (o, i) {
        return { s: debut + i * 2, n: 2, nom: o.nom, tier: o.tier, ench: o.ench,
                 rencontre: true };
      });
      dessinerPlateau(places, elFace, false);
      return;
    }

    var aPlacer = cartes;
    if (centre && cartes.length && cartes.every(function (o) {
          return typeof o.x === 'number'; })) {
      var B = GEOMETRIE.BOARD;
      aPlacer = cartes.slice()
        .sort(function (a, b) { return a.x - b.x; })
        .map(function (o) {
          var n = Math.max(1, Math.min(3, o.n || 1));
          var colonne = (o.x - B.left) * 10 / B.width - n / 2;
          return Object.assign({}, o, {
            s: Math.max(0, Math.min(10 - n, Math.round(colonne))),
          });
        });
    }
    dessinerPlateau(aPlacer, elFace, false);
  }

  function poserNom(el, o) {
    el.textContent = '';

      el.appendChild(e);
    }
    el.appendChild(document.createTextNode(o.nom));

    if (o.se && o.se.length) {
      var bloc = document.createElement('span');
      bloc.className = 'emplacement';
      o.se.forEach(function (code, i) {
        if (i) bloc.appendChild(document.createTextNode(' · '));
        var n = document.createElement('span');
        n.className = 'em-' + code;
        n.textContent = nomEmplacement(code);
        bloc.appendChild(n);

      el.appendChild(bloc);
    }

  function dessinerPlateau(objets, ou, centre) {
    var elPlateau = ou || document.getElementById('plateau');
    elPlateau.textContent = '';
    var occupe = 0;

    var placees = centre && objets.length && objets.every(function (o) {
      return typeof o.x === 'number';
    });

    elPlateau.classList.toggle('centre', !!centre && !placees);
    elPlateau.classList.toggle('libre', !!placees);

    if (placees) {
      var ys = objets.map(function (o) { return typeof o.y === 'number' ? o.y : 0; });
      var yMin = Math.min.apply(null, ys);
      var yMax = Math.max.apply(null, ys);
      var etendue = yMax - yMin;

      var B = GEOMETRIE.BOARD;
      var versPlateau = function (xJeu) { return (xJeu - B.left) * 100 / B.width; };

      objets.forEach(function (o) {
        var d = document.createElement('div');
        d.className = 'objet t-' + (o.tier || '')
          + (o.ench ? ' enchante e-' + o.ench : '')
          + (o.rencontre ? ' rencontre' : '');
        poserNom(d, o);
        d.title = o.nom + (o.ench ? ' — ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');

        var larg = Math.max(1, Math.min(3, o.n || 1)) * 10 - 1.4;
        var gauche = versPlateau(o.x) - larg / 2;
        d.style.left = Math.max(-2, Math.min(102 - larg, gauche)) + '%';
        d.style.width = larg + '%';

        if (etendue > 0.5) {
          var part = (typeof o.y === 'number') ? (o.y - yMin) / etendue : 0;
          d.style.top = Math.round(part * 14) + 'px';
        }
        elPlateau.appendChild(d);
      });
      return;
    }

    if (centre) {
      objets.forEach(function (o) {
        var d = document.createElement('div');
        d.className = 'objet t-' + (o.tier || '')
          + (o.ench ? ' enchante e-' + o.ench : '')
          + (o.rencontre ? ' rencontre' : '');
        d.style.gridColumn = 'span ' + Math.max(1, Math.min(3, o.n || 1));
        poserNom(d, o);
        d.title = o.nom + (o.ench ? ' — ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');
        elPlateau.appendChild(d);
      });
      return;
    }

    objets.forEach(function (o) {
      while (occupe < o.s) { elPlateau.appendChild(caseVide()); occupe++; }
      var d = document.createElement('div');
      d.className = 'objet t-' + (o.tier || '')
        + (o.ench ? ' enchante e-' + o.ench : '')
        + (o.rencontre ? ' rencontre' : '');
      d.style.gridColumn = 'span ' + Math.max(1, Math.min(3, o.n || 1));
      poserNom(d, o);
      d.title = o.nom + (o.ench ? ' — ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');
      elPlateau.appendChild(d);
      occupe += (o.n || 1);
    });

    while (occupe < 10) { elPlateau.appendChild(caseVide()); occupe++; }
  }

    dessinerPlateau(enPartie ? (e.plateau || []) : []);
    dessinerTalents(enPartie ? (e.listeTalents || []) : []);

    var toutFace = enPartie ? (e.face || []) : [];

    var faceTalents = enPartie ? (e.faceTalents || []) : [];
    var reserve = enPartie ? (e.reserve || []) : [];

    var rencontres = toutFace.filter(function (o) { return o.rencontre; });
    var face = toutFace.filter(function (o) { return !o.rencontre; });

    var reserveOuverte = reserve.length > 0;
    var bandeHaute = reserveOuverte ? reserve : face;

    elFace.classList.toggle('reserve', reserveOuverte);

    var choix = reserveOuverte ? [] : rencontres.filter(function (o) {
      return o.rencontre && !/^(PVP|PVE)$/.test(o.nom);
    });

    dessinerBande(bandeHaute, choix, e.faceCentree && !reserveOuverte);

    document.getElementById('cadre-face-talents').style.display =

    document.getElementById('titre-face').textContent =

      d.style.height = pct(projH(B.height));
      elZones.appendChild(d);
    }

    (GEOMETRIE.REPERES.cercles || []).forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'repere cercle';
      d.style.left   = pct(projX(c.x));
      d.style.top    = pct(projY(c.y));
      d.style.width  = pct(projL(c.w));
      d.style.height = pct(projH(c.h));
      elZones.appendChild(d);
    });

    (GEOMETRIE.REPERES.equerres || []).forEach(function (e) {
      var d = document.createElement('div');
      d.className = 'repere equerre ' + e.coin;
      d.style.left   = pct(projX(e.x));
      d.style.top    = pct(projY(e.y));
      d.style.width  = pct(projL(e.w));
      d.style.height = pct(projH(e.h));
      elZones.appendChild(d);
    });

    var L = GEOMETRIE.SKILL_LAYOUTS[0];
    L.slots.forEach(function (p) {
      var d = document.createElement('div');
      d.className = 'zone-talent';
      d.style.left   = pct(projX(p[0] - L.w / 2));
      d.style.top    = pct(projY(p[1] - L.h / 2));
      d.style.width  = pct(projL(L.w));
      d.style.height = pct(projH(L.h));
      elZones.appendChild(d);
    });
  }

  function afficherImage(source) {
    calImage = source;
    elScene.style.backgroundImage = 'url(' + source + ')';

    dessinerCadre();

    var sonde = new Image();
    sonde.onload = function () {
      var r = sonde.naturalWidth / sonde.naturalHeight;
      if (isFinite(r) && Math.abs(r - 16 / 9) > 0.02) {
        elConsigne.textContent = T.calPas169;
      }
    };
    sonde.src = source;
    elScene.classList.add('remplie');
    elRetirer.hidden = false;
    elConsigne.textContent = T.calEncadrer;
    dessinerCadre();
  }

  var elRetirer = document.getElementById('cal-retirer');

  function retirerImage() {
    calImage = null;
    elScene.style.backgroundImage = '';
    elScene.classList.remove('remplie');
    elRetirer.hidden = true;
    dessinerCadre();
  }

  elRetirer.addEventListener('click', function (ev) {
    ev.stopPropagation();
    retirerImage();
  });

  function lireFichier(f) {
    if (!f || !/^image\//.test(f.type)) return;
    var lecteur = new FileReader();
    lecteur.onload = function () { afficherImage(lecteur.result); };
    lecteur.readAsDataURL(f);
  }

  elScene.addEventListener('paste', function (ev) {
    var items = (ev.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') === 0) { lireFichier(items[i].getAsFile()); break; }
    }
  });
  document.addEventListener('paste', function (ev) {
    if (elCal.classList.contains('ouvert')) elScene.dispatchEvent(
      new ClipboardEvent('paste', { clipboardData: ev.clipboardData }));
  });

  document.getElementById('cal-fichier').addEventListener('click', function () {
    document.getElementById('cal-input').click();
  });
  document.getElementById('cal-input').addEventListener('change', function () {
    lireFichier(this.files[0]);
  });

  var saisie = null;

  function positionRelative(ev) {
    var r = elScene.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(100, (ev.clientX - r.left) / r.width * 100)),
      y: Math.max(0, Math.min(100, (ev.clientY - r.top) / r.height * 100)),
    };
  }

  elRect.addEventListener('mousedown', function (ev) {
    var coin = ev.target.classList.contains('poignee')
      ? ev.target.className.replace('poignee', '').trim() : null;
    var p = positionRelative(ev);
    saisie = { coin: coin, depart: p,
               cadre: Object.assign({}, calPlateau || plateauParDefaut()) };
    ev.preventDefault();
    ev.stopPropagation();
  });

  document.addEventListener('mousemove', function (ev) {
    if (!saisie) return;
    var p = positionRelative(ev);
    var dx = p.x - saisie.depart.x, dy = p.y - saisie.depart.y;
    var c = saisie.cadre;
    var MIN = 5;

    if (!calPlateau) calPlateau = plateauParDefaut();

    if (!saisie.coin) {
      calPlateau.l = Math.max(0, Math.min(100 - c.w, c.l + dx));
      calPlateau.t = Math.max(0, Math.min(100 - c.h, c.t + dy));
    } else {
      var r = elScene.getBoundingClientRect();
      var aspectScene = (r.width && r.height) ? r.width / r.height : 16 / 9;
      var RAPPORT = (GEOMETRIE.BOARD.width / GEOMETRIE.BOARD.height) * (16 / 9) / aspectScene;
      var versLaDroite = saisie.coin.indexOf('e') >= 0;

      var la = versLaDroite ? c.w + dx : c.w - dx;
      if (la < MIN) la = MIN;
      var ha = la / RAPPORT;

      var g = versLaDroite ? c.l : c.l + c.w - la;
      var hh = (saisie.coin.indexOf('s') >= 0) ? c.t : c.t + c.h - ha;

      if (g >= 0 && g + la <= 100 && hh >= 0 && hh + ha <= 100) {
        calPlateau.l = g; calPlateau.t = hh;
        calPlateau.w = la; calPlateau.h = ha;
      }
    }
    dessinerCadre();
  });

  document.addEventListener('mouseup', function () { saisie = null; });

  var FLECHES = { ArrowLeft: [-1, 0], ArrowRight: [1, 0],
                  ArrowUp: [0, -1], ArrowDown: [0, 1] };

  var repetitions = 0;

  document.addEventListener('keydown', function (ev) {
    if (!elCal.classList.contains('ouvert')) return;
    var d = FLECHES[ev.key];
    if (!d) return;
    ev.preventDefault();

    var r = elScene.getBoundingClientRect();
    var pasX = r.width  ? 100 / r.width  : 0.05;
    var pasY = r.height ? 100 / r.height : 0.09;

    repetitions = ev.repeat ? repetitions + 1 : 0;
    var facteur = Math.min(1 + Math.pow(repetitions, 1.6) / 12, 40);

    if (!calPlateau) calPlateau = plateauParDefaut();
    var p = calPlateau;

    p.l = Math.max(0, Math.min(100 - p.w, p.l + d[0] * pasX * facteur));
    p.t = Math.max(0, Math.min(100 - p.h, p.t + d[1] * pasY * facteur));
    dessinerCadre();
  });

  document.addEventListener('keyup', function () { repetitions = 0; });

  function ouvrirCalibrage(cadreActuel) {
    calPlateau = cadreActuel ? plateauDepuisCadre(cadreActuel) : plateauParDefaut();
    elCal.classList.add('ouvert');
    elConsigne.textContent = T.calEncadrer;
    elRetirer.hidden = !calImage;
    dessinerCadre();
    elScene.focus();
  }

  function fermerCalibrage() { elCal.classList.remove('ouvert'); }

  document.getElementById('cal-plein').addEventListener('click', function () {
    calPlateau = plateauParDefaut();      // jeu occupant tout le cadre
    dessinerCadre();
  });
  document.getElementById('cal-annuler').addEventListener('click', fermerCalibrage);

  document.getElementById('cal-valider').addEventListener('click', function () {
    var c = cadreCalcule();
    var v = [c.l, c.t, c.w, c.h]
      .map(function (x) { return Math.round(x * 100) / 100; });
    var plein = v[0] === 0 && v[1] === 0 && v[2] === 100 && v[3] === 100;
    fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ CADRE: plein ? '' : v.join(',') })
    }).then(relireConfig).then(fermerCalibrage);
  });

  (function () {
    var n = document.getElementById('n-delai');
    if (!n) return;

    function borner(v) {
      var x = parseInt(v, 10);
      if (!isFinite(x) || x < 0) x = 0;
      return Math.min(x, 86400);   // une journée, garde-fou
    }

    function poser(v, envoyer) {
      var d = borner(v);
      n.value = d;

      /* Le bouton retenu est celui dont la valeur correspond ; à défaut,
         c'est « Autre », qui renvoie à la saisie libre. */
      var connu = false;
      [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
        var pris = (b.dataset.delai === String(d));
        if (pris) connu = true;
        b.classList.toggle('actif', pris);
      });
      var libre = document.getElementById('b-libre');
      if (libre) libre.classList.toggle('actif', !connu);
      if (!envoyer) return;
      fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ DELAI_STREAM: String(d) })
      }).then(relireConfig);
    }

    [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.delai === 'libre') { n.focus(); n.select(); poser(n.value, true); }
        else poser(b.dataset.delai, true);
      });
    });

    n.addEventListener('change', function () { poser(n.value, true); });
  })();

  document.getElementById('calibrer').addEventListener('click', function () {
    var c = (document.getElementById('etat-cadre').dataset.cadre || '')
      .split(',').map(parseFloat);
    ouvrirCalibrage(c.length === 4 && isFinite(c[0])
      ? { l: c[0], t: c[1], w: c[2], h: c[3] } : null);
  });

  document.getElementById('parcourir').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    elAvis.className = 'avis';
    elAvis.textContent = '';

    fetch('/parcourir').then(function (r) { return r.json(); }).then(function (rep) {
      b.disabled = false;
      if (!rep.chemin) return;                 // annulé
      document.getElementById('jeu').value = rep.chemin;
      elAvis.textContent = rep.valide ? T.dossierOk : T.dossierNon;
      elAvis.className = 'avis' + (rep.valide ? ' bon' : '');
      if (rep.valide) enregistrerDossier();
    }).catch(function () { b.disabled = false; });
  });

  function enregistrerDossier() {
    return fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ BAZAAR_PATH: document.getElementById('jeu').value })
    }).then(relireConfig);
  }

  document.getElementById('jeu').addEventListener('change', function () {
    var champ = this.value.trim();
    if (champ === dossierEnregistre) return;
    enregistrerDossier().then(function () {
      elAvis.textContent = T.enregistre;
      elAvis.className = 'avis bon';
      setTimeout(function () {
        if (elAvis.textContent === T.enregistre) elAvis.textContent = '';
      }, 1600);
    });
  });
})();
</script>
