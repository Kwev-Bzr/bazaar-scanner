<style>
  :root {
    --fond:      #140c06;
    --fond-haut: #241608;
    --laiton:    #f0c060;
    --laiton-bas:#8a6a34;
    --texte:     #e8dcc4;
    --discret:   #97866a;
    --trait:     #4a3418;
    --vif:       #6ee08a;
    --attente:   #e0a840;
    --alerte:    #e06a5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(120% 80% at 50% 0%, var(--fond-haut) 0%, var(--fond) 60%);
    color: var(--texte);
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 22px 54px;
    overflow-y: auto;
    overflow-x: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .22em;
    text-indent: .22em;
    background: linear-gradient(175deg, #ffe6a8 0%, var(--laiton) 45%, var(--laiton-bas) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .signature {
    font-size: 11px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--discret);
    margin-top: 3px;
  }

  .filet {
    width: 74px;
    height: 1px;
    margin: 12px 0 20px;
    background: linear-gradient(90deg, transparent, var(--trait), transparent);
  }

  .plateau {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    width: 100%;
  }

  .cadre {
    position: relative;
    width: 100%;
    max-width: 820px;
    border: 1px solid var(--trait);
    border-radius: 7px;
    padding: 15px 12px 11px;
    margin: 0 auto 11px;
  }

  .cadre > h2 {
    position: absolute;
    top: -9px;
    left: 13px;
    margin: 0;
    padding: 0 7px;
    background: var(--fond);
    font: 600 10.5px/1 'Rajdhani', Arial, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--laiton);
    white-space: nowrap;
    max-width: calc(100% - 40px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cadre.adverse { border-color: #2c3f4a; }
  .cadre.adverse > h2 { color: #8fb4c9; }

  .cadre .plateau { min-height: 54px; }
  .cadre .talents { min-height: 30px; }

  .case {
    height: 54px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
  }

  .objet {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3px 4px;
    overflow: hidden;
    border: 1px solid var(--laiton-bas);
    border-radius: 2px;
    background: linear-gradient(180deg, #3a2810, #1c1206);
    font-size: 11px;
    line-height: 1.2;
    text-align: center;
    color: var(--texte);
    word-break: break-word;
    hyphens: auto;
  }

  .objet.t-Bronze    { border-color: #cd7f32; }
  .objet.t-Silver    { border-color: #c8c8c8; }
  .ench {
    display: block;
    width: 100%;
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--laiton-bas);
    margin-bottom: 1px;
  }

  .objet.t-Gold      { border-color: #f0c060; }
  .objet.t-Diamond   { border-color: #a8d8f8; }
  .objet.t-Legendary { border-color: #f08040; }

  .objet.enchante { box-shadow: inset 0 0 0 1px var(--ench, rgba(192,96,240,.55)); }
  .objet.enchante .ench { color: var(--ench, var(--laiton-bas)); }

  .emplacement {
    display: block;
    font-size: 9px;
    letter-spacing: .02em;
    opacity: .9;
  }

  .em-C { color: #c69c6c; }   /* ralentissement */
  .em-D { color: #f0c820; }   /* bouclier */
  .em-E { color: #88e830; }   /* soin */
  .em-F { color: #68e8c0; }   /* hâte */
  .em-G { color: #c060f0; }   /* tempo */
  .em-A { color: #f05038; }   /* dégâts */
  .em-B { color: #f89840; }   /* brûlure */
  .em-Stove  { color: #f89840; }
  .em-Cooler { color: #38c8f0; }

  .e-Golden      { --ench: #f0c060; }
  .e-Heavy       { --ench: #9a8f7a; }
  .e-Icy         { --ench: #7fd3ff; }
  .e-Turbo       { --ench: #4fe0a0; }
  .e-Shielded    { --ench: #ffd24a; }
  .e-Restorative { --ench: #7ee08a; }
  .e-Toxic       { --ench: #7ad13f; }
  .e-Fiery       { --ench: #ff7a3c; }
  .e-Shiny       { --ench: #e8e0ff; }
  .e-Deadly      { --ench: #ff5a6e; }
  .e-Radiant     { --ench: #fff3b0; }
  .e-Obsidian    { --ench: #b06cff; }
  .e-Mossy       { --ench: #8fbf6a; }

  .talents {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    width: 100%;
  }

  .talent {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 34px;
    padding: 3px 8px;
    border: 1px solid var(--trait);
    border-radius: 9px;
    background: #0d0703;
    font-size: 11px;
    color: var(--discret);
  }

  /* Les cinq paliers. Le bronze et le légendaire manquaient : un talent
     légendaire prenait donc l'apparence neutre, indistinguable d'un bronze. */
  .talent.t-Bronze    { border-color: #7a4e28; color: #c99a6a; }
  .talent.t-Silver    { border-color: #6a6a6a; color: #d0d0d0; }
  .talent.t-Gold      { border-color: #8a6a34; color: #d8bd86; }
  .talent.t-Diamond   { border-color: #5d7d95; color: #bcd8ea; }
  .talent.t-Legendary { border-color: #a05428; color: #f0a070; }

  .vide {
    font-size: 12px;
    color: var(--discret);
    margin-bottom: 10px;
    height: 15px;
  }

  .etat {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 9px 14px;
    border: 1px solid var(--trait);
    border-radius: 3px;
    background: rgba(0, 0, 0, .3);
  }

  .voyant {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--discret);
    flex: none;
  }

  .etat[data-code="pret"]    .voyant { background: var(--vif);
    box-shadow: 0 0 9px rgba(110, 224, 138, .8); animation: pulse 2.4s ease-in-out infinite; }
  .etat[data-code="attente"] .voyant,
  .etat[data-code="config"]  .voyant,
  .etat[data-code="jeu"]     .voyant { background: var(--attente); }
  .etat[data-code="erreur"]  .voyant { background: var(--alerte);
    box-shadow: 0 0 9px rgba(224, 106, 90, .7); }

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  @media (prefers-reduced-motion: reduce) { .voyant { animation: none !important } }

  .libelle { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .precision { font-size: 12px; color: var(--discret); margin-top: 7px; min-height: 15px; }

  .pousse { flex: 1 }

  .lien {
    background: none;
    border: 0;
    color: var(--discret);
    font: inherit;
    font-size: 12px;
    letter-spacing: .16em;
    cursor: pointer;
    padding: 6px;
  }
  .lien:hover { color: var(--laiton); }

  #bascule {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .chevron {
    display: inline-flex;
    transition: transform .22s ease;
  }

  #bascule.ouvert .chevron { transform: rotate(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }

  .reglages {
    width: 100%;
    /* Même largeur que la visualisation du plateau : à 460 px, l'explication
       du délai se brisait en lignes d'un seul mot. */
    max-width: 820px;
    display: none;
    flex-direction: column;
    /* Les sections étaient trop serrées : « Délai » semblait appartenir au
       bloc précédent. */
    gap: 20px;
    padding-top: 16px;
    margin-top: 6px;
    border-top: 1px solid var(--trait);
  }
  .reglages.ouvert { display: flex; }
  /* ── V3 : bandeau d'état, partie, onglets, diagnostic, journal ───────── */
  .bandeau-inutilise {
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    width: 100%; max-width: 820px; margin: 0 auto 14px;
  }
  .bandeau .temoin {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px 6px 11px;
    border: 1px solid var(--trait); border-radius: 3px;
    background: #0d0703;
    font-size: 14px; letter-spacing: .06em; color: var(--discret);
  }
  .bandeau .temoin b { color: var(--texte); font-weight: 600; }
  .bandeau .temoin .voyant { background: #3a2c1c; }
  .bandeau .temoin.ok .voyant { background: var(--vif); box-shadow: 0 0 7px rgba(110, 224, 138, .7); }
  .bandeau .temoin.attente .voyant { background: var(--attente); }
  .bandeau .temoin.erreur .voyant { background: var(--alerte); }
  .bandeau .temoin .quand { color: var(--discret); font-size: 13px; }
  .accueil {
    width: 100%; max-width: 520px; margin: 4px auto 18px; padding: 18px 20px;
    border: 1px solid var(--laiton-bas); border-radius: 7px; text-align: center;
    background: rgba(0, 0, 0, .3);
  }
  .accueil p { font-size: 17px; color: var(--texte); margin-bottom: 12px; line-height: 1.35; }
  .accueil .valider { width: auto; padding: 9px 26px; }

  /* Les pastilles sur leur propre ligne, les compteurs dessous : une partie de
     seize jours ou plus ne les fait plus se chevaucher. */
  .partie-ligne { display: flex; flex-direction: column; align-items: center; gap: 9px; }
  .jours { display: flex; gap: 5px; flex-wrap: wrap; }
  .jours .jour { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .jours .num { font: 700 11px/1 'Rajdhani', sans-serif; color: var(--discret); }
  .compteurs { display: flex; gap: 18px; font-size: 15px; color: var(--discret); letter-spacing: .04em; }
  .compteurs b { color: var(--laiton); font-weight: 700; font-size: 17px; }

  .onglets { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--trait); }
  .onglets button {
    background: transparent; border: 1px solid transparent; border-bottom: 0;
    border-radius: 4px 4px 0 0; color: var(--discret);
    font: 600 13px/1 'Rajdhani', sans-serif; letter-spacing: .14em;
    padding: 9px 13px 8px; cursor: pointer; margin-bottom: -1px;
  }
  .onglets button:hover { color: var(--texte); }
  .onglets button.actif { color: var(--laiton); border-color: var(--trait); background: var(--fond); }
  .reglages > .panneau-onglet { display: none; }
  .reglages > .panneau-onglet.actif { display: block; }

  .diag { display: flex; flex-direction: column; gap: 7px; }
  .diag .controle {
    display: grid; grid-template-columns: 14px 190px 1fr; align-items: center; gap: 10px;
    font-size: 15px;
  }
  .diag .controle .voyant { background: #3a2c1c; }
  .diag .controle.ok .voyant { background: var(--vif); }
  .diag .controle.attente .voyant { background: var(--attente); }
  .diag .controle.erreur .voyant { background: var(--alerte); }
  .diag .controle .nom { color: var(--discret); letter-spacing: .04em; }
  .diag .controle .valeur { color: var(--texte); }
  .jauge { height: 7px; border-radius: 4px; background: #0d0703; border: 1px solid var(--trait); overflow: hidden; margin-top: 4px; max-width: 320px; }
  .jauge > span { display: block; height: 100%; background: var(--vif); }
  .jauge.haute > span { background: var(--attente); }
  .jauge.pleine > span { background: var(--alerte); }

  .journal { width: 100%; max-width: 820px; margin: 4px auto 0; }
  .journal summary {
    cursor: pointer; list-style: none; text-align: center;
    font-size: 13px; letter-spacing: .2em; color: var(--discret); padding: 6px;
  }
  .journal summary::-webkit-details-marker { display: none; }
  .journal summary:hover { color: var(--texte); }
  .journal ol { list-style: none; max-height: 190px; overflow-y: auto; padding: 4px 10px; border-top: 1px solid var(--trait); }
  .journal li { display: flex; gap: 12px; font-size: 15px; padding: 3px 0; border-bottom: 1px solid rgba(74, 52, 24, .4); }
  .journal li .h { color: var(--discret); font-size: 13px; min-width: 44px; }
  .journal li.j-victoire .t { color: #6fb2f2; }
  .journal li.j-defaite .t { color: #ef6a5c; }
  .journal li.j-refus .t { color: #c0504a; }
  .journal li.j-talent .t { color: var(--laiton); }
  .journal .rien { color: var(--discret); font-size: 14px; padding: 6px 0; }


  label { font-size: 14px; letter-spacing: .16em; color: var(--discret); display: block; margin-bottom: 4px; }
  /* Le titre de chaque page de réglage : mis en valeur, dans le laiton du
     logo. */
  .panneau-onglet > label {
    font: 700 20px/1.3 'Cinzel', Georgia, serif;
    letter-spacing: .08em;
    color: var(--laiton);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 7px 9px;
    background: #0d0703;
    border: 1px solid var(--trait);
    border-radius: 2px;
    color: var(--texte);
    font: inherit;
    font-size: 15px;
  }
  input:focus { outline: none; border-color: var(--laiton-bas); }

  button.valider {
    padding: 9px;
    background: linear-gradient(180deg, #6a4d1c, #4a3414);
    border: 1px solid var(--laiton-bas);
    border-radius: 2px;
    color: var(--laiton);
    font: inherit;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .12em;
    cursor: pointer;
  }
  button.valider:hover { background: linear-gradient(180deg, #7d5c22, #573d18); }
  button.valider { width: 100%; }

  .compte {
    flex: 1;
    min-width: 0;
    padding: 7px 9px;
    background: #0d0703;
    border: 1px solid var(--trait);
    border-radius: 2px;
    font-size: 16px;
    color: var(--discret);
  }
  .compte.lie { color: var(--vif); }

  .lien.discret { display: block; width: 100%; text-align: center; margin-top: 7px; }

  button.avec-icone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 4px;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }

  #enregistrer {
    background: #16100a;
    border-color: var(--trait);
    color: var(--discret);
    cursor: default;
  }

  #enregistrer.modifie {
    background: linear-gradient(180deg, #7a4c12, #52320c);
    border-color: var(--attente);
    color: #ffe0a0;
    cursor: pointer;
  }
  #enregistrer.modifie:hover { background: linear-gradient(180deg, #8d5915, #613b0e); }

  #enregistrer.sauve {
    background: linear-gradient(180deg, #1d4a28, #12301a);
    border-color: var(--vif);
    color: var(--vif);
    cursor: default;
  }

  #alerte-version {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    padding: 7px 14px;
    background: #2a1608;
    border-bottom: 1px solid var(--laiton-bas);
    color: var(--laiton);
    font-size: 12px;
    text-align: center;
  }
  #alerte-version a { color: var(--laiton); margin-left: 10px; }

  /* Les durées en colonne, une pastille allumée sur celle retenue. */
  .delai { display: flex; flex-direction: column; align-items: stretch; gap: 6px;
           max-width: 330px; margin-top: 6px; }

  /* Steam ou client Tempo : le streamer qui emploie les deux bascule ici,
     sans réinstaller ni redémarrer. */
  .sources { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }

  /* Le chemin ne se saisit plus : il vient de l'installation. Un voyant dit
     si le mod est bien là, car sans lui la version choisie ne donne rien. */
  #jeu[readonly] { opacity: .75; cursor: default; }

  .voyant-mod {
    flex: none;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    align-self: center;
    background: var(--trait);
    box-shadow: 0 0 6px transparent;
  }
  .voyant-mod.bon {
    background: var(--vif);
    box-shadow: 0 0 7px var(--vif);
  }
  .voyant-mod.absent {
    background: #c0392b;
    box-shadow: 0 0 7px rgba(192, 57, 43, .7);
  }

  .avis-mod {
    margin-top: 7px;
    font-size: 14px;
    line-height: 1.45;
    color: #e08a7a;
  }
  .avis-mod:empty { display: none; }
  .avis-mod a { color: var(--laiton); }

  .sources button {
    padding: 4px 14px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: transparent;
    color: var(--discret);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .sources button:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .sources button.actif {
    color: var(--laiton);
    border-color: var(--laiton);
    background: #241706;
  }

  .delai button {
    display: flex; align-items: center; gap: 11px;
    padding: 10px 14px;
    border: 1px solid var(--trait);
    border-radius: 4px;
    background: transparent;
    color: var(--discret);
    font-family: inherit;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
  }
  .delai button::before {
    content: ''; width: 11px; height: 11px; border-radius: 50%; flex: none;
    border: 1.5px solid currentColor; opacity: .8;
  }
  .delai button.actif::before {
    background: var(--laiton); border-color: var(--laiton);
    box-shadow: 0 0 7px rgba(240, 192, 96, .7); opacity: 1;
  }
  .delai .reco { margin-left: auto; font-size: 12px; letter-spacing: .08em;
                 text-transform: uppercase; color: var(--laiton-bas); }
  /* « Personnalisé » et sa durée en secondes, qui n'apparaît qu'une fois
     cette option retenue. */
  .delai .ligne-libre { display: flex; align-items: center; gap: 8px; }
  .delai .ligne-libre button { flex: 1; }
  .delai .ligne-libre:not(.ouverte) input,
  .delai .ligne-libre:not(.ouverte) .delai-unite { display: none; }
  .delai button:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .delai button.actif {
    color: var(--laiton);
    border-color: var(--laiton);
    background: #241706;
  }
  /* Les petites flèches natives du champ numérique sont laides et inutiles :
     on saisit un nombre de secondes, on ne l'incrémente pas une par une. */
  .delai input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .delai input[type="number"]::-webkit-outer-spin-button,
  .delai input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .delai input[type="number"] {
    width: 70px;
    padding: 8px 6px;
    font-size: 16px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--laiton);
    font-family: inherit;
    text-align: right;
  }
  .delai-unite { font-size: 15px; color: var(--discret); }

  /* L'explication se lit en entier : mieux vaut une taille confortable et un
     interligne aéré qu'un bloc compact. */
  /* Les explications, dans une police plus lisible que le titre : la
     Rajdhani, étroite, se lisait mal en paragraphe. */
  .aide { font: 16px/1.55 'Segoe UI', system-ui, -apple-system, sans-serif;
          color: #c2b293; margin-top: 16px; text-align: center; }
  /* Sous le titre d'une page de réglage, avant ses boutons. */
  .aide.au-dessus { margin: 4px 0 18px; text-align: left; }

  /* Le second paragraphe de l'explication respire. */
  .aide .para { margin-top: 14px; }

  .adverse .objet,
  .adverse .talent { background: #0a1116; }
  .adverse .case { border-color: #24333c; background: #080d11; }

  .plateau.centre {
    display: flex;
    justify-content: center;
    gap: 5px;
  }
  .plateau.centre .objet { flex: 0 0 auto; min-width: 92px; }

  .adverse .objet.rencontre {
    border-style: dashed;
    opacity: .82;
  }

  .plateau.libre {
    display: block;
    position: relative;
    height: 54px;
  }
  .plateau.libre .objet {
    position: absolute;
    top: 0;
    height: 36px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .talents {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 5px;
    justify-content: center;
  }

  .plateau.reserve .objet { border-style: dotted; }

  .ligne-champ { display: flex; gap: 5px; }
  .ligne-champ input { flex: 1; min-width: 0; }

  .parcourir {
    flex: none;
    padding: 0 10px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--discret);
    font: inherit;
    font-size: 14px;
    letter-spacing: .08em;
    cursor: pointer;
    white-space: nowrap;
  }
  .parcourir:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .parcourir:disabled { opacity: .5; cursor: default; }

  .calibrage {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 16px 20px 18px;
    background: var(--fond);
  }
  .calibrage.ouvert { display: flex; }

  /* Au format des autres pages de réglage : titre en capitales dans la
     police du logo, consignes en texte clair et lisible. */
  .cal-titre {
    font: 700 20px/1.3 'Cinzel', Georgia, serif;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--laiton);
  }
  .cal-consigne { font: 16px/1.55 'Segoe UI', system-ui, sans-serif; color: #c2b293;
                  margin-top: 4px; min-height: 15px; max-width: 820px; }

  .cal-scene {
    position: relative;
    flex: none;
    aspect-ratio: 16 / 9;
    width: 100%;
    max-width: min(100%, calc((100vh - 230px) * 16 / 9));
    margin: auto;
    background: #0a0603 center/100% 100% no-repeat;
    border: 1px solid var(--trait);
    border-radius: 3px;
    overflow: hidden;
    outline: none;
    user-select: none;
  }

  /* L'invitation à coller la capture : un encart en haut de l'aperçu, qui
     laisse voir le rectangle en dessous. */
  .cal-vide {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4;
    display: grid;
    justify-items: center;
    gap: 10px;
    width: min(520px, 80%);
    box-sizing: border-box;
    padding: 16px 22px;
    border: 1px dashed var(--laiton-bas);
    border-radius: 6px;
    background: rgba(24, 16, 10, .92);
    text-align: center;
    font: 17px/1.45 'Segoe UI', system-ui, sans-serif;
    color: #e8dcc4;
  }
  /* L'encart laisse passer la souris : le rectangle reste saisissable même
     glissé dessous. Seul le bouton reste cliquable, et l'encart s'efface le
     temps qu'on déplace le rectangle. */
  .cal-vide { pointer-events: none; transition: opacity .15s; }
  .cal-vide .lien { pointer-events: auto; }
  .cal-scene.saisie .cal-vide { opacity: .12; }
  .cal-vide kbd {
    font: 600 14px 'Segoe UI', sans-serif;
    color: var(--laiton);
    padding: 2px 7px;
    border: 1px solid var(--laiton-bas);
    border-bottom-width: 2px;
    border-radius: 4px;
    background: #1a120b;
  }
  .cal-scene.remplie .cal-vide { display: none; }

  .cal-retirer {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid var(--trait);
    border-radius: 50%;
    background: rgba(10, 7, 3, .8);
    color: var(--discret);
    cursor: pointer;
    backdrop-filter: blur(2px);
  }
  .cal-retirer:hover { color: var(--alerte); border-color: var(--alerte); }

  .cal-vide .lien {
    font: 600 13px 'Segoe UI', sans-serif;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #c9b892;
    padding: 8px 16px;
    border: 1px solid #4a3a28;
    border-radius: 3px;
  }
  .cal-vide .lien:hover { color: var(--laiton); border-color: var(--laiton-bas); }

  .cal-cadre {
    position: absolute;
    border: 2px solid var(--laiton);
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45);
    cursor: move;
  }

  .poignee {
    position: absolute;
    width: 14px;
    height: 14px;
    background: var(--laiton);
    border-radius: 2px;
  }
  .poignee.nw { left: -8px; top: -8px;    cursor: nwse-resize; }
  .poignee.ne { right: -8px; top: -8px;   cursor: nesw-resize; }
  .poignee.sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
  .poignee.se { right: -8px; bottom: -8px; cursor: nwse-resize; }

  .cal-zones { position: absolute; inset: 0; pointer-events: none; }
  .cal-zones div {
    position: absolute;
    box-sizing: border-box;
    padding: 0;
    border: 1px solid rgba(110, 224, 138, .9);
    background: rgba(110, 224, 138, .16);
    border-radius: 2px;
  }

  .cal-zones div.zone-talent {
    border-color: rgba(240,192,96,.9);
    background: rgba(240,192,96,.16);
  }

  .cal-zones div.repere { border: 0; background: none; }
  .cal-zones div.cercle {
    border: 1px solid rgba(255, 90, 120, .95);
    border-radius: 50%;
  }
  .cal-zones div.equerre { border: 0; }
  .cal-zones div.equerre.tr {
    border-top: 1px solid rgba(255, 90, 120, .95);
    border-right: 1px solid rgba(255, 90, 120, .95);
  }
  .cal-zones div.equerre.tl {
    border-top: 1px solid rgba(255, 90, 120, .95);
    border-left: 1px solid rgba(255, 90, 120, .95);
  }

  .cal-aide { font: 16px/1.5 'Segoe UI', system-ui, sans-serif; color: #c2b293;
              text-align: center; min-height: 14px; }
  .cal-aide b { color: var(--laiton); font-weight: 600; }
  .cal-boutons { display: flex; align-items: center; gap: 8px; }
  /* Plein écran et Annuler : de vrais boutons, encadrés. */
  .cal-boutons .lien {
    display: inline-flex; align-items: center; gap: 8px;
    font: 600 13px 'Segoe UI', sans-serif;
    letter-spacing: .12em;
    padding: 9px 16px;
    color: #c9b892;
    border: 1px solid #4a3a28;
    border-radius: 3px;
  }
  .cal-boutons .lien:hover { color: var(--laiton); border-color: var(--laiton-bas); }

  /* Une vignette flottante en bas à droite : les avis valent pour toute la
     fenêtre. Le coin haut est déjà pris par le bandeau de mise à jour et le
     sélecteur de langue. */
  .avis {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 45;
    max-width: 360px;
    padding: 9px 14px;
    border: 1px solid var(--trait);
    border-radius: 3px;
    background: #1a1008;
    color: var(--attente);
    font-size: 15px;
    box-shadow: 0 2px 14px rgba(0, 0, 0, .5);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  .avis:not(:empty) { opacity: 1; transform: none; }
  .avis.bon { color: var(--vif); border-color: var(--vif); }

  /* Pendant le calibrage, l'écran entier appartient au réglage. */
  body:has(.calibrage.ouvert) .avis { display: none; }
  .avis.bon { color: var(--vif); }

  /* En bas à gauche, le sélecteur passait sous le panneau élargi. En haut à
     droite, il reste atteignable quelle que soit la hauteur du contenu. */
  /* En bas à gauche, le sélecteur passait sous le panneau élargi. En haut à
     droite, il reste atteignable quelle que soit la hauteur du contenu.

     Il se glisse SOUS le bandeau de version et sous le calibrage, qui
     occupent le même coin : mieux vaut qu'il disparaisse un instant que
     d'empêcher de lire une alerte. */
  .langues {
    position: fixed;
    top: 12px;
    right: 14px;
    z-index: 40;
    display: flex;
    gap: 6px;
  }

  /* Le bandeau de version descend le sélecteur plutôt que de le masquer. */
  body:has(#alerte-version:not([hidden])) .langues { top: 46px; }

  /* Pendant le calibrage, il s'efface : l'écran entier appartient au réglage. */
  body:has(.calibrage.ouvert) .langues { display: none; }

  .langues { align-items: center; }
  .langues .globe { color: var(--discret); opacity: .75; flex: none;
                    font-size: 18px; }

  .langues select {
    padding: 7px 11px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--discret);
    font: inherit;
    font-size: 16px;
    cursor: pointer;
    opacity: .75;
  }
  /* Le menu déroulant du système n'hérite pas toujours de la taille du
     sélecteur : on la lui impose. */
  .langues select option { font-size: 16px; }
  .langues select:hover, .langues select:focus {
    opacity: 1;
    color: var(--laiton);
    border-color: var(--laiton-bas);
    outline: none;
  }

  /* ── V3 : rail, coin droit, pages et cases teintées ───────────────────── */
  :root { --rail: 224px; }
  body { padding: 24px 22px 40px calc(var(--rail) + 22px); }

  .rail {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30;
    width: var(--rail);
    display: flex; flex-direction: column; gap: 4px;
    padding: 22px 12px;
    background: rgba(0, 0, 0, .28);
    border-right: 1px solid rgba(74, 52, 24, .6);
  }
  .rail .marque { padding: 0 6px 22px; display: flex; align-items: center; gap: 11px; }
  .rail .logo { width: 46px; height: 46px; border-radius: 9px; flex: none;
                border: 1px solid var(--laiton-bas); box-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
  .rail .signature a { color: inherit; text-decoration: none; }
  .rail .signature a:hover { color: var(--laiton); text-decoration: underline; text-underline-offset: 2px; }
  .rail h1 { font-size: 16px; line-height: 1.35; letter-spacing: .2em; text-indent: 0; }
  .rail .signature { text-indent: 0; margin-top: 4px; font-size: 10px; }
  .rail button {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border: 0; border-radius: 6px;
    background: none; color: var(--discret); cursor: pointer;
    font: 600 15px/1 'Rajdhani', sans-serif; letter-spacing: .04em; text-align: left;
  }
  .rail button:hover { color: var(--texte); }
  .rail button.actif {
    color: var(--laiton);
    background: linear-gradient(90deg, rgba(240, 192, 96, .13), rgba(240, 192, 96, 0));
    box-shadow: inset 2px 0 0 var(--laiton);
  }
  .rail svg { flex: none; }

  /* « Partie », la page principale : un bouton à part, doré quand il est
     ouvert, encadré de laiton sinon. */
  .rail button[data-page="partie"] {
    font: 700 15px/1 'Cinzel', Georgia, serif; letter-spacing: .08em;
    padding: 13px 12px; margin-bottom: 4px;
    border: 1px solid var(--laiton); border-radius: 5px;
    color: var(--laiton); background: transparent;
  }
  .rail button[data-page="partie"] svg { width: 21px; height: 21px; }
  .rail button[data-page="partie"]:hover { color: #ffe6a8; }
  .rail button[data-page="partie"].actif {
    color: #1a120b;
    background: linear-gradient(180deg, #ffd98a, var(--laiton) 60%, #c99a45);
    box-shadow: 0 2px 10px rgba(240, 192, 96, .3);
  }

  /* Le groupe des réglages, et le pied du rail : le témoin puis la langue,
     collés dans le coin inférieur gauche. */
  .rail .groupe {
    margin: 18px 10px 4px; font: 600 10.5px/1 'Rajdhani', sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: var(--laiton-bas);
  }
  .rail button { font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  .rail button span { overflow: hidden; text-overflow: ellipsis; }
  .pied-rail { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .pied-rail .etat { padding: 7px 10px; gap: 9px; }
  .pied-rail .libelle { font-size: 13.5px; }
  .pied-rail .precision { margin: -3px 2px 0; min-height: 0; font-size: 11.5px; line-height: 1.3; }
  /* Le voyant se suffit : aucune ligne dessous. Le détail reste dans le
     Diagnostic. */
  .pied-rail .precision { display: none; }
  .pied-rail .langues { position: static; }
  .pied-rail .langues select { flex: 1; min-width: 0; font-size: 14px; padding: 6px 8px; }
  body:has(#alerte-version:not([hidden])) .rail { top: 33px; }
  #onglets { display: none; }

  /* Le calibrage occupe la place du contenu, le menu de gauche reste. La
     langue du menu ne s'efface plus pendant le calibrage. */
  .calibrage { left: var(--rail); }
  body:has(.calibrage.ouvert) .pied-rail .langues { display: flex; }
  body:has(#alerte-version:not([hidden])) .calibrage { top: 33px; }

  /* Les pages : une seule visible. Elles commencent sous le coin droit. */
  .page { width: 100%; max-width: 820px; padding-top: 14px; }
  body[data-page="partie"]   #page-reglages,
  body[data-page="reglages"] #page-partie { display: none; }
  .reglages { border-top: 0; padding-top: 0; margin-top: 0; max-width: none; }

  /* Fenêtre étroite : le rail ne garde que ses icônes. */
  @media (max-width: 760px) {
    :root { --rail: 58px; }
    .rail { padding: 16px 8px; align-items: center; }
    .rail button span, .rail .groupe, .rail .marque > div { display: none; }
    /* Le logo seul, au-dessus des icônes. */
    .rail .marque { padding: 0 0 14px; }
    .rail .logo { width: 38px; height: 38px; border-radius: 8px; }
    .rail button { padding: 10px; }
    .rail button[data-page="partie"] { padding: 10px; }
    .rail button[data-onglet="compte"] { margin-top: 14px; }
    /* Le témoin se réduit à son voyant ; la langue, à son sélecteur. */
    .pied-rail { align-items: center; }
    .pied-rail .etat { padding: 9px; border-radius: 50%; }
    .pied-rail .libelle, .pied-rail .precision, .pied-rail .langues .globe { display: none; }
    .pied-rail .langues select { width: 42px; padding: 5px 2px; font-size: 12px; }
  }

  /* La partie : pastilles rondes, compteurs à la taille du texte. */
  #cadre-partie .partie-ligne { gap: 11px; }
  #jours { gap: 6px; justify-content: center; }
  .pastille { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .pastille.v { background: #3f8ae0; }
  .pastille.d { background: #d0453a; }
  .pastille.r { background: #5a1712; box-shadow: inset 0 0 0 1.5px #d0453a; }
  .pastille.encours { box-shadow: inset 0 0 0 1.5px var(--laiton); }
  #compteurs { gap: 0; font-size: 13px; letter-spacing: .02em; flex-wrap: wrap; justify-content: center; }
  #compteurs span + span::before { content: "\00b7"; margin: 0 10px; color: var(--trait); }
  #compteurs b { font-size: 13px; font-weight: 600; color: var(--texte); }

  /* Les cadres : assez d'air pour que chaque section se lise d'un coup
     d'œil, sans dépasser de la fenêtre par défaut (1170 × 770). */
  .cadre { padding: 18px 14px 13px; margin-bottom: 18px; }
  .cadre > h2 { top: -8px; }
  .plateau { gap: 6px; }

  /* Les cases : la rareté teinte discrètement le fond, le contour et le
     texte. */
  .objet, .talent { --rar: #6a5a44; }
  .t-Bronze { --rar: #cd7f32; } .t-Silver { --rar: #c8c8c8; } .t-Gold { --rar: #f0c060; }
  .t-Diamond { --rar: #a8d8f8; } .t-Legendary { --rar: #f08040; }
  .cadre .plateau { min-height: 40px; }
  .case { height: auto; min-height: 40px; border: 1px dashed rgba(232, 220, 196, .07); border-radius: 6px; background: none; }
  /* La case grandit avec son texte (nom, enchantement, emplacement) au lieu
     de le couper ; toute la rangée prend alors la même hauteur. */
  .objet, .objet[class*="t-"] {
    height: auto; min-height: 40px; padding: 3px 6px; overflow: visible;
    border: 1px solid color-mix(in srgb, var(--rar) 40%, transparent); border-radius: 6px;
    background: color-mix(in srgb, var(--rar) 11%, #140c06);
    font-size: 12px; line-height: 1.15;
    color: color-mix(in srgb, var(--rar) 45%, #f4ecdc);
  }
  .objet.enchante { box-shadow: none; }
  .objet .ench { font-size: 9.5px; margin: 0; }
  .objet .emplacement { font-size: 9.5px; }
  .plateau.reserve .objet { border-style: solid; }
  .adverse .objet { background: color-mix(in srgb, var(--rar) 9%, #0a1116); }
  .adverse .case { border-color: rgba(143, 180, 201, .09); background: none; }
  .adverse .objet.rencontre { border-style: dashed; }
  .talents { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
  .talent, .talent[class*="t-"] {
    min-height: 26px; padding: 2px 13px;
    border: 1px solid color-mix(in srgb, var(--rar) 40%, transparent); border-radius: 13px;
    background: color-mix(in srgb, var(--rar) 11%, #140c06);
    color: color-mix(in srgb, var(--rar) 45%, #f4ecdc);
    font-size: 12px;
  }
  .adverse .talent { background: color-mix(in srgb, var(--rar) 9%, #0a1116); }
  #page-partie .accueil { margin: 0 auto 16px; }
  .plateau.libre { height: 68px; }
  .plateau.libre .objet { white-space: normal; }

  /* Cases étroites : plus petit, sans couper les mots. */
  @media (max-width: 760px) {
    .objet, .objet[class*="t-"] { padding: 2px 2px; font-size: 11px; hyphens: manual; word-break: normal; }
    .objet .ench { font-size: 8.5px; letter-spacing: 0; }
    .objet .emplacement { font-size: 8.5px; }
  }

  /* Le diagnostic : groupes, détail du message, bouton de copie. */
  .diag { gap: 4px; }
  .diag h3 { font: 600 10.5px/1 'Rajdhani', sans-serif; letter-spacing: .16em; text-transform: uppercase;
             color: var(--laiton-bas); margin: 16px 0 6px; }
  .diag h3:first-child { margin-top: 0; }
  .diag .controle { padding: 3px 0; }
  .repartition { display: flex; height: 9px; border-radius: 5px; overflow: hidden; max-width: 320px;
                 margin-top: 2px; border: 1px solid var(--trait); }
  .repartition span { display: block; height: 100%; }
  .legende { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 6px; font-size: 12.5px;
             color: var(--discret); max-width: 520px; }
  .legende i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .legende b { color: var(--texte); font-weight: 600; }
  .diag .copier { margin-top: 22px; align-self: flex-start; background: none; border: 1px solid var(--laiton-bas);
                  color: var(--laiton); font: 600 13px/1 'Rajdhani', sans-serif; letter-spacing: .14em;
                  padding: 10px 18px; border-radius: 3px; cursor: pointer; display: inline-flex; gap: 9px; align-items: center; }
  .diag .copier:hover { border-color: var(--laiton); }

  /* Le journal, un cadre comme les autres, toujours ouvert. */
  .journal.cadre { margin-top: 0; }
  .journal ol { border-top: 0; padding: 2px 4px; max-height: 190px; }
  /* L'ascenseur du journal : un trait laiton sur un rail brun, avec une
     légère lueur. Celui du système, gris et blanc, jurait avec la fenêtre. */
  .journal ol::-webkit-scrollbar { width: 4px; }
  .journal ol::-webkit-scrollbar-track { background: var(--trait); border-radius: 2px; margin: 6px 0; }
  .journal ol::-webkit-scrollbar-thumb { background: var(--laiton); border-radius: 2px; box-shadow: 0 0 4px rgba(240, 192, 96, .6); }
  .journal ol::-webkit-scrollbar-button { display: none; }
  #jours { min-height: 11px; }
  /* « en attente d'une partie » redisait ce que dit déjà le témoin, et
     déplaçait le journal. */
  #page-partie .vide { display: none; }

  /* Le voyant de mise à jour : doré, et cliquable. */
  .pied-rail .etat.maj { text-decoration: none; color: var(--laiton); border-color: var(--laiton-bas); cursor: pointer; }
  .pied-rail .etat.maj:hover { border-color: var(--laiton); }
  .pied-rail .etat.maj .voyant { background: var(--laiton); box-shadow: 0 0 8px rgba(240, 192, 96, .7); }
  .pied-rail .etat.maj[hidden] { display: none; }
  /* Mineure (même chiffre principal) en orange, majeure en rouge. */
  .pied-rail .etat.maj.mineure { color: #e8963c; border-color: #7a4c1e; }
  .pied-rail .etat.maj.mineure .voyant { background: #e8963c; box-shadow: 0 0 8px rgba(232, 150, 60, .75); }
  .pied-rail .etat.maj.majeure { color: var(--alerte); border-color: #7a3028; }
  .pied-rail .etat.maj.majeure .voyant { background: var(--alerte); box-shadow: 0 0 9px rgba(224, 106, 90, .8);
    animation: pulse 2.4s ease-in-out infinite; }

  /* La fenêtre de mise à jour, par-dessus tout. */
  .voile-maj { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
    background: rgba(8, 5, 3, .72); }
  .voile-maj[hidden] { display: none; }
  .fen-maj { width: min(430px, calc(100vw - 32px)); box-sizing: border-box; padding: 22px 24px 20px;
    background: linear-gradient(#22180f, #18110b); border: 1px solid var(--laiton-bas); border-radius: 4px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, .6); color: #e8dcc4; font-family: 'Segoe UI', system-ui, sans-serif; }
  .fen-maj.majeure { border-color: #7a3028; }
  .fen-maj h2 { margin: 0 0 4px; font: 700 20px/1.25 'Cinzel', Georgia, serif; color: var(--laiton);
    letter-spacing: .04em; text-transform: uppercase; }
  .fen-maj.majeure h2 { color: var(--alerte); }
  .fen-maj .vers { font-size: 13px; color: #a8977a; margin-bottom: 14px; }
  .fen-maj p { margin: 0 0 8px; font-size: 15px; line-height: 1.45; color: #c2b293; }
  .fen-maj .avert { display: flex; gap: 9px; align-items: flex-start; margin: 12px 0 4px; padding: 9px 11px;
    border: 1px solid #7a3028; border-radius: 3px; background: rgba(224, 106, 90, .08); color: #e8a090;
    font-size: 14px; line-height: 1.4; }
  .fen-maj .avert .voyant { margin-top: 6px; background: var(--alerte); }
  .fen-maj .boutons { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 18px;
    flex-wrap: wrap; }
  .fen-maj button, .fen-maj a.bouton { font: 600 13px 'Segoe UI', sans-serif; letter-spacing: .12em;
    text-transform: uppercase; padding: 9px 16px; border-radius: 3px; cursor: pointer; background: transparent;
    color: #a8977a; border: 1px solid #4a3a28; text-decoration: none; }
  .fen-maj button:hover, .fen-maj a.bouton:hover { color: #e8dcc4; border-color: var(--laiton-bas); }
  .fen-maj button.go { color: #1a120b; background: var(--laiton); border-color: var(--laiton); }
  .fen-maj button.go:hover { color: #1a120b; filter: brightness(1.08); }
  .fen-maj button.go[disabled] { opacity: .35; cursor: default; filter: none; }
  .fen-maj .barre { height: 6px; background: #2a2016; border-radius: 3px; overflow: hidden; margin: 14px 0 6px; }
  .fen-maj .barre i { display: block; height: 100%; width: 0; background: var(--laiton);
    box-shadow: 0 0 6px rgba(240, 192, 96, .6); transition: width .25s; }
  .fen-maj .pct { font-size: 13px; color: #a8977a; }
</style>
</head>

      var o = document.createElement('option');
      o.value = l;
      o.textContent = NOMS_LANGUE[l] || l.toUpperCase();
      if (l === LANGUE) o.selected = true;
      sel.appendChild(o);

    sel.addEventListener('change', function () {
      if (sel.value === LANGUE) return;

  function dessinerBande(cartes, choix, centre) {
    if (choix && choix.length >= 2) {
      var ordonnes = choix.slice().sort(function (a, b) {
        return (a.x || 0) - (b.x || 0);
      });
      var debut = Math.max(0, Math.floor((10 - ordonnes.length * 2) / 2));
      var places = ordonnes.map(function (o, i) {
        return { s: debut + i * 2, n: 2, nom: o.nom, tier: o.tier, ench: o.ench,
                 rencontre: true };
      });
      dessinerPlateau(places, elFace, true);
      return;
    }

    var aPlacer = cartes;
    if (centre && cartes.length && cartes.every(function (o) {
          return typeof o.x === 'number'; })) {
      var B = GEOMETRIE.BOARD;
      aPlacer = cartes.slice()
        .sort(function (a, b) { return a.x - b.x; })
        .map(function (o) {
          var n = Math.max(1, Math.min(3, o.n || 1));
          var colonne = (o.x - B.left) * 10 / B.width - n / 2;
          return Object.assign({}, o, {
            s: Math.max(0, Math.min(10 - n, Math.round(colonne))),
          });
        });
    }
    dessinerPlateau(aPlacer, elFace, false);
  }

  function poserNom(el, o) {
    el.textContent = '';
    if (o.ench) {
      var e = document.createElement('span');
      e.className = 'ench';
      e.textContent = nomEnchantement(o.ench);
      el.appendChild(e);
    }
    el.appendChild(document.createTextNode(o.nom));

    if (o.se && o.se.length) {
      var bloc = document.createElement('span');
      bloc.className = 'emplacement';
      o.se.forEach(function (code, i) {
        if (i) bloc.appendChild(document.createTextNode(' · '));
        var n = document.createElement('span');
        n.className = 'em-' + code;
        n.textContent = nomEmplacement(code);
        bloc.appendChild(n);
      });
      el.appendChild(bloc);
    }
  }

  function dessinerPlateau(objets, ou, centre) {
    var elPlateau = ou || document.getElementById('plateau');
    elPlateau.textContent = '';
    var occupe = 0;

    var placees = centre && objets.length && objets.every(function (o) {
      return typeof o.x === 'number';
    });

    elPlateau.classList.toggle('centre', !!centre && !placees);
    elPlateau.classList.toggle('libre', !!placees);

    if (placees) {
      var ys = objets.map(function (o) { return typeof o.y === 'number' ? o.y : 0; });
      var yMin = Math.min.apply(null, ys);
      var yMax = Math.max.apply(null, ys);
      var etendue = yMax - yMin;

      var B = GEOMETRIE.BOARD;
      var versPlateau = function (xJeu) { return (xJeu - B.left) * 100 / B.width; };

      objets.forEach(function (o) {
        var d = document.createElement('div');
        d.className = 'objet t-' + (o.tier || '')
          + (o.ench ? ' enchante e-' + o.ench : '')
          + (o.rencontre ? ' rencontre' : '');
        poserNom(d, o);
        d.title = o.nom + (o.ench ? ' - ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');

        var larg = Math.max(1, Math.min(3, o.n || 1)) * 10 - 1.4;
        var gauche = versPlateau(o.x) - larg / 2;
        d.style.left = Math.max(-2, Math.min(102 - larg, gauche)) + '%';
        d.style.width = larg + '%';

        if (etendue > 0.5) {
          var part = (typeof o.y === 'number') ? (o.y - yMin) / etendue : 0;
          d.style.top = Math.round(part * 14) + 'px';
        }
        elPlateau.appendChild(d);
      });
      return;
    }

    if (centre) {
      objets.forEach(function (o) {
        var d = document.createElement('div');
        d.className = 'objet t-' + (o.tier || '')
          + (o.ench ? ' enchante e-' + o.ench : '')
          + (o.rencontre ? ' rencontre' : '');
        d.style.gridColumn = 'span ' + Math.max(1, Math.min(3, o.n || 1));
        poserNom(d, o);
        d.title = o.nom + (o.ench ? ' - ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');
        elPlateau.appendChild(d);
      });
      return;
    }

    objets.forEach(function (o) {
      while (occupe < o.s) { elPlateau.appendChild(caseVide()); occupe++; }
      var d = document.createElement('div');
      d.className = 'objet t-' + (o.tier || '')
        + (o.ench ? ' enchante e-' + o.ench : '')
        + (o.rencontre ? ' rencontre' : '');
      d.style.gridColumn = 'span ' + Math.max(1, Math.min(3, o.n || 1));
      poserNom(d, o);
      d.title = o.nom + (o.ench ? ' - ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');
      elPlateau.appendChild(d);
      occupe += (o.n || 1);
    });

    while (occupe < 10) { elPlateau.appendChild(caseVide()); occupe++; }
  }

  /* Prévient le streamer qu'une version plus récente existe. On ne compare que
     des versions connues : hors ligne, on ne dit rien. */
  /* Compare deux numéros du genre « 2.0.1 ». Rend un nombre négatif si le
     premier est le plus ancien. */
  function comparerVersions(a, b) {
    var x = String(a).split('.').map(Number);
    var y = String(b).split('.').map(Number);
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var d = (x[i] || 0) - (y[i] || 0);
      if (d) return d;
    }
    return 0;
  }

  /* Une version plus récente publiée : un voyant au pied du menu, au-dessus
     du témoin, qui mène à la page de téléchargement. Rien sinon. Le bandeau
     d'autrefois, en haut de la fenêtre, déplaçait tout le contenu. */
  function majAlerteVersion(ici, enLigne) {
    var el = document.getElementById('voyant-maj');
    if (!el) return;
    /* On n'alerte que si la version publiée est RÉELLEMENT plus récente.
       Une simple différence suffisait auparavant : la 2.0.1 fraîchement
       installée se croyait périmée face à la 2.0.0 encore publiée. */
    var plusRecente = !!ici && !!enLigne && comparerVersions(ici, enLigne) < 0;
    el.hidden = !plusRecente;
    if (!plusRecente) return;
    /* Orange si le chiffre principal ne change pas (3.0 vers 3.1), rouge
       s'il change (3.x vers 4.0). Aucune des deux n'est obligatoire. */
    var majeure = (parseInt(enLigne, 10) || 0) > (parseInt(ici, 10) || 0);
    el.classList.toggle('majeure', majeure);
    el.classList.toggle('mineure', !majeure);
    document.getElementById('voyant-maj-libelle').textContent = TV3.majDispo;
    el.title = (T.versionAncienne || '').replace('{}', enLigne);
  }

  var MAJ_ERREURS = { reseau: 'eReseau', empreinte: 'eEmpreinte', jeu: 'jeu', refus: 'eRefus',
                      lancement: 'eLancement', absent: 'eAbsent' };
  var URL_RELEASES = 'https://github.com/Kwev-Bzr/bazaar-scanner/releases/latest';
  var etatMaj = null;
  var fenMajOuverte = false;
  var voileMaj = null;

  function texteMaj(cle, v) {
    var t = (MAJ_TOUS[LANGUE] || MAJ_TOUS.en)[cle] || MAJ_TOUS.en[cle] || '';
    return v ? fmt(t, v) : t;
  }
  function echapperMaj(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }

  function peindreFenMaj() {
    if (!fenMajOuverte || !etatMaj) { if (voileMaj) voileMaj.hidden = true; return; }
    if (!voileMaj) {
      voileMaj = document.createElement('div');
      voileMaj.className = 'voile-maj';
      document.body.appendChild(voileMaj);
      voileMaj.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-maj]');
        if (!b || b.disabled) return;
        var a = b.getAttribute('data-maj');
        if (a === 'installer') fetch('/maj/installer', { method: 'POST' }).catch(function () {});
        if (a === 'annuler') fetch('/maj/annuler', { method: 'POST' }).catch(function () {});
        if (a === 'fermer') {
          if (etatMaj && etatMaj.etat === 'erreur') fetch('/maj/annuler', { method: 'POST' }).catch(function () {});
          fenMajOuverte = false;
          peindreFenMaj();
        }
      });
    }
    var m = etatMaj, h = [];
    var titre = m.majeure ? texteMaj('titreMajeure') : texteMaj('titre');
    h.push('<div class="fen-maj' + (m.majeure ? ' majeure' : '') + '" role="dialog" aria-modal="true">');
    h.push('<h2>' + echapperMaj(titre) + '</h2>');
    h.push('<div class="vers">' + echapperMaj(texteMaj('vers', { v: m.version || '?', ici: m.ici || '?' })) + '</div>');
    var bouton = function (action, libelle, principal, inactif) {
      return '<button type="button" data-maj="' + action + '"' + (principal ? ' class="go"' : '')
        + (inactif ? ' disabled' : '') + '>' + echapperMaj(libelle) + '</button>';
    };
    var lienGithub = '<a class="bouton" href="' + URL_RELEASES + '" target="_blank" rel="noopener">'
      + echapperMaj(texteMaj('github')) + '</a>';

    if (m.etat === 'telechargement') {
      var total = m.total || 0, recu = m.recu || 0;
      var p = total ? Math.min(100, Math.round(recu * 100 / total)) : 0;
      var mo = function (o) { return (o / 1048576).toFixed(1).replace('.', LANGUE === 'en' || LANGUE === 'ko' || LANGUE === 'zh' ? '.' : ','); };
      h.push('<p>' + echapperMaj(texteMaj('dl')) + '</p>');
      h.push('<div class="barre"><i style="width:' + p + '%"></i></div>');
      h.push('<div class="pct">' + echapperMaj(texteMaj('pct', { p: p, r: mo(recu), t: total ? mo(total) : '?' })) + '</div>');
      h.push('<div class="boutons">' + bouton('annuler', texteMaj('annuler')) + '</div>');
    } else if (m.etat === 'lancement') {
      h.push('<p>' + echapperMaj(texteMaj('lancement')) + '</p>');
    } else if (m.etat === 'ferme') {
      h.push('<p>' + echapperMaj(texteMaj('ferme')) + '</p>');
    } else if (m.etat === 'erreur') {
      h.push('<div class="avert"><span class="voyant"></span><span>'
        + echapperMaj(texteMaj(MAJ_ERREURS[m.erreur] || 'eReseau')) + '</span></div>');
      var peutReessayer = m.erreur !== 'absent' && m.erreur !== 'lancement';
      h.push('<div class="boutons">' + bouton('fermer', texteMaj('fermer')) + lienGithub
        + (peutReessayer ? bouton('installer', texteMaj('reessayer'), true, m.erreur === 'jeu' && m.jeuOuvert) : '')
        + '</div>');
    } else {
      if (m.majeure) h.push('<p>' + echapperMaj(texteMaj('majeure')) + '</p>');
      h.push('<p>' + echapperMaj(texteMaj('texte')) + '</p>');
      h.push('<p>' + echapperMaj(texteMaj('uac')) + '</p>');
      if (m.jeuOuvert) h.push('<div class="avert"><span class="voyant"></span><span>' + echapperMaj(texteMaj('jeu')) + '</span></div>');
      h.push('<div class="boutons">' + bouton('fermer', texteMaj('plusTard'))
        + bouton('installer', texteMaj('installer'), true, m.jeuOuvert) + '</div>');
    }
    h.push('</div>');
    voileMaj.innerHTML = h.join('');
    voileMaj.hidden = false;
  }

  function majMiseAJour(m) {
    if (!m) return;
    etatMaj = m;
    /* Pendant le lancement, la fenêtre se rouvre d'elle-même. */
    if (m.etat === 'lancement' || m.etat === 'telechargement') fenMajOuverte = true;
    peindreFenMaj();
  }

  (function () {
    var el = document.getElementById('voyant-maj');
    if (!el) return;
    el.addEventListener('click', function (ev) {
      /* Sans empreinte publiée pour cette version, l'application ne peut pas
         l'installer elle-même : le lien GitHub reste le chemin. */
      if (!etatMaj || !etatMaj.integree) return;
      ev.preventDefault();
      fenMajOuverte = true;
      peindreFenMaj();
    });
  })();

  /* Reflète le délai courant : la boîte et le bouton retenu. */
  function majDelai(d) {
    var n = document.getElementById('n-delai');
    if (n) n.value = d;

    var connu = false;
    [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
      var pris = (b.dataset.delai === String(d));
      if (pris) connu = true;
      b.classList.toggle('actif', pris);
    });
    var libre = document.getElementById('b-libre');
    if (libre) libre.classList.toggle('actif', !connu);
    /* Une durée personnalisée montre sa valeur en secondes. */
    var ligneLibre = document.getElementById('ligne-libre');
    if (ligneLibre && !connu) ligneLibre.classList.add('ouverte');
  }

  (function () {

  function peindreAccueil(e) {

  }

  function peindrePartie(e) {
    var p = (e.code === 'pret') ? e.partie : null;
    /* Hors partie, le cadre reste, avec des tirets : la fenêtre ne bouge
       plus. */
    if (!p) {
      document.getElementById('jours').innerHTML = '';
      document.getElementById('compteurs').innerHTML = [TV3.heros, TV3.victoires, TV3.defaites, TV3.prestige, TV3.mode]
        .map(function (n) { return '<span>' + n + SEP + '<b>-</b></span>'; }).join('');
      return;
    }
    /* Une pastille par jour : bleue pour une victoire, rouge pour une
       défaite, rouge sombre cerclée pour un refus de la mort, vide pour le
       jour en cours. Le numéro du jour paraît au survol. */
    var hist = p.histoire || '';
    var h = '';
    for (var j = 1; j <= p.jour; j++) {
      var r = hist.charAt(j - 1);
      h += '<span class="pastille ' + (r || 'encours') + '" title="' + TV3.jour + ' ' + j + '"></span>';
    }
    document.getElementById('jours').innerHTML = h;
    /* Les défaites comptent aussi les refus de la mort : le combat a été
       perdu. */
    var defaites = (hist.match(/[dr]/g) || []).length;
    var c = '';
    var champ = function (nom, val) {
      return '<span>' + nom + SEP + '<b>' + val + '</b></span>';
    };
    if (p.hero) c += champ(TV3.heros, nomHeros(p.hero).replace(/[<>&"']/g, ''));
    if (typeof p.vi === 'number') c += champ(TV3.victoires, p.vi);
    c += champ(TV3.defaites, defaites);
    if (typeof p.pr === 'number') c += champ(TV3.prestige, p.pr + '/' + (p.px || 20));
    c += champ(TV3.mode, TV3[p.mode] || p.mode);
    document.getElementById('compteurs').innerHTML = c;
  }

  function dateLisible(ms) {
    if (!ms) return null;
    try { return new Date(ms).toLocaleString(LANGUE, { dateStyle: 'medium', timeStyle: 'short' }); }
    catch (e) { return new Date(ms).toLocaleString(); }
  }

  function versionPlusAncienne(a, b) {
    var x = String(a).split('.').map(Number), y = String(b).split('.').map(Number);
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) < (y[i] || 0);
    }
    return false;
  }

  /* Le diagnostic, en trois groupes : le jeu, Twitch, l'application. Chaque

  var PARTIES_MESSAGE = [['b', 'pPlateau', '#e0a850'], ['f', 'pFace', '#7fb3d0'], ['r', 'pReserve', '#b07a48'],
                         ['k', 'pTalents', '#c9c0aa'], ['fk', 'pFaceTalents', '#5f8aa3'], ['autres', 'pAutres', '#6a5a44']];
  var dernierEtatDiag = null;
  var texteDiag = '';

  function heureCourte(ms) {

  function ilYa(ms) { return Math.max(0, Math.round((Date.now() - ms) / 1000)); }
  function raisonRefus(c) {
    if (c === 429) return TV3.r429;

  function peindreDiag(e) {
    var d = e.diag;
    var el = document.getElementById('diag');
    if (d && d.version) majAlerteVersion(d.version.app, d.version.enLigne);
    if (!d || !el) return;
    dernierEtatDiag = e;
    var html = [], texte = [];
    var titre = function (t) { html.push('<h3>' + t + '</h3>'); texte.push('', '[' + t + ']'); };
    var ligne = function (etat, nom, valeur, extra) {
      html.push('<div class="controle ' + etat + '"><span class="voyant"></span><span class="nom">' + nom

    /* Le jeu */
    titre(TV3.dSecJeu);
    if (!d.mod) ligne('attente', TV3.dModNom, TV3.dPasLu);
    else if (versionPlusAncienne(d.mod, d.modAttendu)) ligne('erreur', TV3.dModNom, d.mod + ', ' + fmt(TV3.dPerime, { v: d.modAttendu }));
    else ligne('ok', TV3.dModNom, d.mod + ' · ' + TV3.dAJour);
    ligne(d.jeu ? 'ok' : '', TV3.dVersionJeu, d.jeu || TV3.dPasLu);
    [['steam', 'Steam'], ['tempo', 'Tempo']].forEach(function (s) {
      var info = d[s[0]];
      if (!info) return;
      var actif = d.source === s[0];
      if (info.dll) ligne(actif ? 'ok' : '', fmt(TV3.dDll, { src: s[1] }), dateLisible(info.dll) + (actif ? ' · ' + TV3.dActive : ''));
      else ligne(actif ? 'erreur' : '', fmt(TV3.dDll, { src: s[1] }), TV3.dAbsente);
    });
    if (!d.lecture) ligne('', TV3.dLecture, TV3.dLectureAucune);
    else {
      var n = ilYa(d.lecture);

         panne. Le rouge ne vaut que lorsque l'application attend le jeu. */
      var etatLecture = n <= 3 ? 'ok' : (n <= 10 ? 'attente' : (e.code === 'pret' ? 'erreur' : ''));
      ligne(etatLecture, TV3.dLecture, fmt(TV3.dLectureIlya, { n: n }));
    }

    /* Twitch */
    titre(TV3.dSecTwitch);
    if (d.relais && d.relais.connecte === false) ligne('erreur', TV3.dRelais, d.relais.erreur || TV3.coupe);
    else if (e.code === 'config') ligne('attente', TV3.dRelais, TV3.nonConnecte);
    else ligne('ok', TV3.dRelais, TV3.dOk);

    var st = d.envois;
    if (st) {
      var txt = fmt(TV3.dEnvoisTxt, { n: st.envois, h: heureCourte(st.depuis) }) + ' · ';
      if (!st.refus) ligne('ok', TV3.dEnvois, txt + TV3.dAucunRefus);
      else {
        var r = st.dernierRefus || {};
        var recent = r.quand && ilYa(r.quand) < 60;
        ligne(recent ? 'erreur' : 'attente', TV3.dEnvois,
          txt + fmt(TV3.dRefus, { n: st.refus, h: r.quand ? heureCourte(r.quand) : '?', r: raisonRefus(r.code) }));
      }
    }

    var m = d.message;
    if (!m) ligne('', TV3.dMessage, TV3.dAucun);
    else {
      var part = m.octets / (m.max || 5120);
      var classe = part > 0.9 ? 'pleine' : (part > 0.6 ? 'haute' : '');
      ligne(part > 0.9 ? 'erreur' : (part > 0.6 ? 'attente' : 'ok'), TV3.dMessage,
        fmt(TV3.dOctets, { o: m.octets, m: m.max || 5120, q: fmt(TV3.ilya, { n: ilYa(m.quand) }) }),
        '<div class="jauge ' + classe + '"><span style="width:' + Math.min(100, Math.round(part * 100)) + '%"></span></div>');
      if (m.parties) {

        var barre = '', legende = '', morceaux = [];
        PARTIES_MESSAGE.forEach(function (pm) {
          var o = m.parties[pm[0]] || 0;
          if (!o) return;
          barre += '<span style="width:' + (o * 100 / max).toFixed(2) + '%;background:' + pm[2] + '"></span>';
          legende += '<span><i style="background:' + pm[2] + '"></i>' + TV3[pm[1]] + ' <b>' + o + '</b></span>';
          morceaux.push(TV3[pm[1]] + ' ' + o);

        html.push('<div class="controle"><span></span><span class="nom">' + TV3.dDetail + '</span><span class="valeur">'

    if (d.delai) {
      var dl = fmt(TV3.dDelaiTxt, { s: d.delai.s, n: d.delai.attente });
      if (d.delai.prochain) dl += ' · ' + fmt(TV3.dProchain, { n: Math.max(0, Math.round((d.delai.prochain - Date.now()) / 1000)) });

    if (v.app && v.enLigne && versionPlusAncienne(v.app, v.enLigne)) {
      /* Les couleurs du voyant : orange pour une mineure, rouge pour une majeure. */
      var majeureDiag = (parseInt(v.enLigne, 10) || 0) > (parseInt(v.app, 10) || 0);
      ligne(majeureDiag ? 'erreur' : 'attente', TV3.dVersion, v.app + ' · ' + fmt(TV3.dDispo, { v: v.enLigne }));
    }
    else if (v.app) ligne('ok', TV3.dVersion, v.app + (v.enLigne ? ' · ' + TV3.dAJour : ''));
    else ligne('', TV3.dVersion, '?');

    html.push('<button type="button" class="copier" id="diag-copier">'
      + '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'
      + '<rect x="5" y="5" width="8.5" height="9" rx="1.5"/><path d="M3 10.5V3.5A1.5 1.5 0 0 1 4.5 2h6"/></svg>'
      + '<span>' + (copieRecente ? TV3.dCopie : TV3.dCopier) + '</span></button>');

    texteDiag = 'Bazaar Scanner - ' + new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC'
      + '\n' + texte.join('\n').replace(/^\n/, '');

  /* « Copier le diagnostic » : le texte, prêt à coller dans un message. */
  var copieRecente = false;
  document.addEventListener('click', function (ev) {

    var fini = function () {
      copieRecente = true;
      if (dernierEtatDiag) peindreDiag(dernierEtatDiag);

  setInterval(function () {

  var empreinteJournal = '';
  function peindreJournal(e) {
    var liste = e.journal || [];
    var emp = JSON.stringify(liste.slice(0, 1)) + liste.length + LANGUE;
    if (emp === empreinteJournal) return;
    empreinteJournal = emp;
    var ol = document.getElementById('journal-liste');
    if (!liste.length) { ol.innerHTML = '<li class="rien">' + TV3.jRien + '</li>'; return; }
    var echap = function (t) { return String(t == null ? '' : t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); };
    ol.innerHTML = liste.map(function (x) {
      var t;
      if (x.type === 'partie') t = fmt(TV3.jPartie, { h: echap(nomHeros(x.hero)) });
      else if (x.type === 'victoire') t = fmt(TV3.jVictoire, { j: x.jour });
      else if (x.type === 'defaite') t = fmt(TV3.jDefaite, { j: x.jour });
      else if (x.type === 'refus') t = fmt(TV3.jRefus, { j: x.jour });
      else if (x.type === 'talent') t = fmt(TV3.jTalent, { n: echap(x.nom), r: (TV3.raretes[x.rarete] || x.rarete) });
      else t = echap(x.type);
      var h = new Date(x.t).toLocaleTimeString(LANGUE, { hour: '2-digit', minute: '2-digit' });
      return '<li class="j-' + x.type + '"><span class="h">' + h + '</span><span class="t">' + t + '</span></li>';
    }).join('');
  }

  function peindre(e) {
    try { peindreAccueil(e); peindrePartie(e); peindreDiag(e); peindreJournal(e); }
    catch (err) { /* les ajouts V3 ne doivent jamais empêcher le reste */ }
    elEtat.dataset.code = e.code;
    elLibelle.textContent = LIBELLES[e.code] || e.code;

    /* Le détail arrive sous forme de code : l'application ne connaît pas la
       langue de cette fenêtre. Un motif traduit par la chaîne vide ne dit
       rien de plus que le voyant, et ne s'affiche donc pas. */
    var motifs = T.motifs || {};
    var d = e.detail || '';
    elPrecision.textContent = (d in motifs) ? motifs[d] : d;

    var enPartie = e.code === 'pret';
    dessinerPlateau(enPartie ? (e.plateau || []) : []);

    /* La réserve, désormais lue en permanence par le mod : elle a son propre
       cadre, entre le plateau et les talents. */
    dessinerPlateau(enPartie ? (e.reserve || []) : [],
                    document.getElementById('reserve'));

    dessinerTalents(enPartie ? (e.listeTalents || []) : []);

    /* La bande du haut : la réserve quand le coffre est ouvert, l'adversaire
       sinon. Même règle que chez le spectateur. */
    var toutFace = enPartie
      ? ((e.reserveAffichee && e.reserveAffichee.length)
         ? e.reserveAffichee : (e.face || []))
      : [];
    var titreFace = enPartie ? (e.faceTitre || '') : '';
    var faceTalents = enPartie ? (e.faceTalents || []) : [];
    var reserve = enPartie ? (e.reserve || []) : [];

    var rencontres = toutFace.filter(function (o) { return o.rencontre; });
    var face = toutFace.filter(function (o) { return !o.rencontre; });

    /* La réserve ne remplace plus la bande d'en face. Le mod la lit
       désormais en permanence, coffre fermé compris : la substitution
       d'autrefois aurait masqué les boutiques et les adversaires pendant
       toute la partie. */
    elFace.classList.remove('reserve');

    var choix = rencontres.filter(function (o) {
      return o.rencontre && !/^(PVP|PVE)$/.test(o.nom);
    });

    dessinerBande(face, choix, e.faceCentree);
    dessinerTalents(faceTalents, elFaceTalents);

    /* Les cadres d'en face restent en place, vides s'il le faut : la
       fenêtre ne bouge plus à chaque écran du jeu. */

    document.getElementById('titre-face').textContent =
        (titreFace === 'Stash')   ? T.titreReserve
      : (titreFace === 'Choices') ? T.titreChoix
      : (titreFace || TV3.pFace);

    /* Le voyant suffit à dire qu'on attend : l'inscrire aussi en travers du
       plateau faisait trois messages pour une seule information. */
    /* « en attente d'une partie » n'a de sens que si tout le reste est en
       place et que le jeu tourne. Le dire alors que Twitch n'est pas
       connecté ajoutait un troisième message à une situation qui n'en
       demande qu'un. */
    elVide.textContent = (d === 'horsJeu') ? T.attentePartie : '';
  }

  try {
    if (!window.sessionStorage.getItem('bazaar-taille-ajustee')) {
      window.sessionStorage.setItem('bazaar-taille-ajustee', '1');
      if (window.outerHeight > 1000 || window.outerWidth < 900) window.resizeTo(1170, 770);
    }
  } catch (e) { /* refusé selon le contexte, sans conséquence */ }

  fetch('/langue?l=' + encodeURIComponent(LANGUE)).catch(function () {});

  /* Un identifiant propre à cette fenêtre : en se fermant, elle prévient
     l'application, qui s'arrête quand il n'en reste aucune. */
  var idFenetre = Math.random().toString(36).slice(2) + Date.now().toString(36);
  window.addEventListener('pagehide', function () {
    try { fetch('/fermer?id=' + idFenetre, { method: 'POST', keepalive: true }); } catch (e) { /* tant pis */ }
  });
  var flux = new EventSource('/etat?id=' + idFenetre);
  flux.onmessage = function (ev) {
    var recu = null;
    try { recu = JSON.parse(ev.data); } catch (err) { return; /* trame partielle */ }
    try { peindre(recu); } catch (err) { /* une erreur d'affichage ne bloque pas la suite */ }
    try { majMiseAJour(recu.maj); } catch (err) { /* idem */ }
  };
  flux.onerror = function () {
    /* L'application vient de se fermer pour laisser l'installateur la

    if (etatMaj && etatMaj.etat === 'lancement') {
      etatMaj.etat = 'ferme';
      fenMajOuverte = true;
      peindreFenMaj();

      setTimeout(function () { try { window.close(); } catch (e) { /* refusé */ } }, 2500);
      return;
    }
    elEtat.dataset.code = 'erreur';
    elLibelle.textContent = T.arretee;
    elPrecision.textContent = '';
  };

  /* Les deux pages : Partie et Réglages. La dernière choisie est retenue le
     temps de la session. */
  var CLE_PAGE = 'bazaar-page';
  var reglages = document.getElementById('reglages');

  /* Le menu de gauche : « Partie », ou l'un des onglets des réglages. Il
     pilote les onglets d'origine, cachés, pour ne rien changer à leur
     logique. */
  function majRail() {
    var page = document.body.dataset.page;
    var onglet = document.querySelector('#onglets button.actif');
    onglet = onglet ? onglet.dataset.onglet : '';
    [].forEach.call(document.querySelectorAll('#rail button'), function (b) {
      b.classList.toggle('actif', b.dataset.page === 'partie'
        ? page === 'partie' : (page === 'reglages' && b.dataset.onglet === onglet));
    });
  }
  function afficherPage(n) {
    if (n !== 'reglages') n = 'partie';
    document.body.dataset.page = n;
    majRail();
    majCalibrageIntegre();
    try { window.sessionStorage.setItem(CLE_PAGE, n); } catch (e) { /* tant pis */ }
  }
  function afficherReglages(ouvert) { afficherPage(ouvert ? 'reglages' : 'partie'); }

  /* L'onglet Cadrage EST la fenêtre de calibrage : elle s'ouvre dès qu'on
     le choisit, à droite du menu, et se referme quand on en sort. Avant la
     mise en place du calibrage (elCal encore indéfini), rien à faire : il
     s'en charge lui-même ensuite. */
  function surCadrage() {
    var o = document.querySelector('#onglets button.actif');
    return document.body.dataset.page === 'reglages' && !!o && o.dataset.onglet === 'cadrage';
  }
  function majCalibrageIntegre() {
    if (typeof elCal === 'undefined' || !elCal) return;
    var ouvert = elCal.classList.contains('ouvert');
    if (surCadrage() && !ouvert) document.getElementById('calibrer').click();
    else if (!surCadrage() && ouvert) elCal.classList.remove('ouvert');

  (function () {
    var n = 'partie';

    afficherPage(n);
    [].forEach.call(document.querySelectorAll('#rail button'), function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.onglet) {

          if (o) o.click();

          afficherPage('partie');
        }
      });

  })();

  var elCompte = document.getElementById('compte');

  var dossierEnregistre = null;

  /* Les deux chemins connus, et celui que l'application lit. Le streamer qui
     joue tantôt sur Steam, tantôt sur le client Tempo, bascule sans
     ressaisir quoi que ce soit. */
  var chemins = { steam: '', tempo: '' };
  var source = 'steam';

  function majSources() {
    [].forEach.call(document.querySelectorAll('#sources button'), function (b) {
      b.classList.toggle('actif', b.dataset.source === source);
    });
    var champ = document.getElementById('jeu');
    if (champ) champ.value = chemins[source] || '';
    dossierEnregistre = (chemins[source] || '').trim();

    majVoyantMod();
  }

  /* Le mod est-il installé dans la version retenue ? Sans lui, le dossier a
     beau être juste, aucun plateau ne remonte. Le voyant le dit d'un coup
     d'oeil, et l'avis explique quoi faire. */
  var modPresent = { steam: false, tempo: false };

  function majVoyantMod() {
    var voyant = document.getElementById('voyant-mod');
    var avisEl = document.getElementById('avis-mod');
    if (!voyant || !avisEl) return;

    var present = !!modPresent[source];
    voyant.className = 'voyant-mod ' + (present ? 'bon' : 'absent');
    avisEl.textContent = '';

    if (present) return;

    /* Le nom du produit porte le lien vers la page des versions. */
    var parts = String(T.modAbsent || '').split('{}');
    avisEl.appendChild(document.createTextNode(parts[0] || ''));

    var lien = document.createElement('a');
    lien.href = 'https://github.com/Kwev-Bzr/bazaar-scanner/releases';
    lien.target = '_blank';
    lien.rel = 'noopener';
    lien.textContent = 'Bazaar Scanner';
    avisEl.appendChild(lien);

    avisEl.appendChild(document.createTextNode(parts[1] || ''));
  }

  [].forEach.call(document.querySelectorAll('#sources button'), function (b) {
    b.addEventListener('click', function () {
      source = b.dataset.source;
      majSources();
      // La bascule prend effet aussitôt : rien à redémarrer.
      fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ SOURCE: source, BAZAAR_PATH: chemins[source] || '' }),
      }).then(relireConfig);
    });
  });

  function relireConfig() {
    return fetch('/config').then(function (r) { return r.json(); }).then(function (c) {
      chemins.steam = c.STEAM_PATH || '';
      chemins.tempo = c.TEMPO_PATH || '';
      modPresent.steam = !!c.STEAM_MOD;
      modPresent.tempo = !!c.TEMPO_MOD;
      source = (c.SOURCE === 'tempo') ? 'tempo' : 'steam';

      /* Une configuration d'avant la prise en charge du client Tempo ne
         porte que BAZAAR_PATH : on la rattache à Steam. */
      if (!chemins.steam && !chemins.tempo) chemins.steam = c.BAZAAR_PATH || '';

      majSources();
      var lie = !!c.RELAY_TOKEN;
      elCompte.textContent = lie
        ? (c.TWITCH_NOM || T.connecteSansNom)
        : T.nonConnecte;

      majAlerteVersion(c.VERSION, c.VERSION_EN_LIGNE);

      majDelai(Math.max(0, Math.min(86400, parseInt(c.DELAI_STREAM, 10) || 0)));

      document.getElementById('etat-cadre').dataset.cadre = c.CADRE || '';
      elCompte.classList.toggle('lie', lie);
      return c;
    });
  }
  relireConfig();

  var elAvis = document.getElementById('avis');
  var horlogeAvis = null;

  /* Une confirmation s'efface d'elle-même ; un problème reste à l'écran tant
     qu'il n'est pas réglé. Dire « dossier introuvable » cinq secondes puis
     se taire laisserait le streamer devant une fenêtre muette. */
  function avis(texte, bon) {
    clearTimeout(horlogeAvis);
    elAvis.textContent = texte || '';
    elAvis.className = 'avis' + (bon ? ' bon' : '');

    if (texte && bon) {
      horlogeAvis = setTimeout(function () {
        elAvis.textContent = '';
        elAvis.className = 'avis';
      }, 5000);
    }
  }

  document.getElementById('connecter').addEventListener('click', function () {
    var b = this;
    avis('');

    fetch('/connexion').then(function (r) { return r.json(); }).then(function (rep) {
      avis(rep.message, rep.ok);
      if (!rep.ok) return;
      b.textContent = T.enAttenteAuth;
      surveillerJeton(b);
    });
  });

  function surveillerJeton(b) {
    var essais = 0;
    var minuteur = setInterval(function () {
      relireConfig().then(function (c) {
        if (c.RELAY_TOKEN) {
          clearInterval(minuteur);
          b.textContent = T.seConnecter;
          avis(T.connecte, true);
        } else if (++essais > 120) {
          clearInterval(minuteur);
          b.textContent = T.seConnecter;
          avis(T.sansReponse, false);
        }
      });
    }, 1000);
  }

  var GEOMETRIE = {

    // Ne pas modifier ici : la source est
    // twitch-extension/extension/config.js
    BOARD: {"left":21.0003,"top":52.0036,"width":58.2494,"height":19.5839,"slots":10},

      { max: 11, w: 2.7458, h: 4.8819, slots: [[33.6876,81.4838],[38.1397,81.4838],[42.6128,81.4838],[57.6181,81.4838],[62.0711,81.4838],[66.5433,81.4838],[33.6876,89.0864],[38.1397,89.0864],[42.6128,89.0864],[57.6181,89.0864],[62.0711,89.0864],[66.5433,89.0864]] },
      { max: 17, w: 2.1974, h: 3.975, slots: [[33.2166,80.4725],[37.042,80.4725],[41.0039,80.4725],[59.1677,80.5428],[63.1106,80.5428],[67.0133,80.4725],[35.1981,85.2851],[39.0425,85.2851],[43.0045,85.2851],[57.2847,85.2851],[61.2075,85.2851],[65.1302,85.2148],[33.2367,90.0977],[37.0812,90.0977],[41.0431,90.0977],[59.2069,90.167],[63.1297,90.167],[67.0525,90.0977]] },
      { max: 24, w: 2.0397, h: 3.6968, slots: [[33.0398,80.2636],[36.1783,80.2636],[39.2776,80.2636],[42.3377,80.124],[57.7948,80.4032],[60.9333,80.4032],[64.0325,80.4032],[67.0926,80.2636],[33.785,85.3544],[36.9235,85.3544],[40.0227,85.3544],[43.0828,85.2148],[57.0496,85.4247],[60.1881,85.4247],[63.2864,85.4247],[66.3465,85.2851],[33.0398,90.3759],[36.1783,90.3759],[39.2776,90.3759],[42.3377,90.2363],[57.7557,90.4462],[60.8941,90.4462],[63.9934,90.4462],[67.0525,90.3066]] }
    ],
    REPERES: {
