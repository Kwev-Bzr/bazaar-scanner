<style>
  :root {
    --fond:      #140c06;
    --fond-haut: #241608;
    --laiton:    #f0c060;
    --laiton-bas:#8a6a34;
    --texte:     #e8dcc4;
    --discret:   #97866a;
    --trait:     #4a3418;
    --vif:       #6ee08a;
    --attente:   #e0a840;
    --alerte:    #e06a5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(120% 80% at 50% 0%, var(--fond-haut) 0%, var(--fond) 60%);
    color: var(--texte);
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 22px 54px;
    overflow-y: auto;
    overflow-x: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .22em;
    text-indent: .22em;
    background: linear-gradient(175deg, #ffe6a8 0%, var(--laiton) 45%, var(--laiton-bas) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .signature {
    font-size: 11px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--discret);
    margin-top: 3px;
  }

  .filet {
    width: 74px;
    height: 1px;
    margin: 12px 0 20px;
    background: linear-gradient(90deg, transparent, var(--trait), transparent);
  }

  .plateau {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    width: 100%;
  }

  .cadre {
    position: relative;
    width: 100%;
    max-width: 820px;
    border: 1px solid var(--trait);
    border-radius: 7px;
    padding: 15px 12px 11px;
    margin: 0 auto 11px;
  }

  .cadre > h2 {
    position: absolute;
    top: -9px;
    left: 13px;
    margin: 0;
    padding: 0 7px;
    background: var(--fond);
    font: 600 10.5px/1 'Rajdhani', Arial, sans-serif;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--laiton);
    white-space: nowrap;
    max-width: calc(100% - 40px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .cadre.adverse { border-color: #2c3f4a; }
  .cadre.adverse > h2 { color: #8fb4c9; }

  .cadre .plateau { min-height: 54px; }
  .cadre .talents { min-height: 30px; }

  .case {
    height: 54px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
  }

  .objet {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3px 4px;
    overflow: hidden;
    border: 1px solid var(--laiton-bas);
    border-radius: 2px;
    background: linear-gradient(180deg, #3a2810, #1c1206);
    font-size: 11px;
    line-height: 1.2;
    text-align: center;
    color: var(--texte);
    word-break: break-word;
    hyphens: auto;
  }

  .objet.t-Bronze    { border-color: #cd7f32; }
  .objet.t-Silver    { border-color: #c8c8c8; }
  .ench {
    display: block;
    width: 100%;
    font-size: 10px;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--laiton-bas);
    margin-bottom: 1px;
  }

  .objet.t-Gold      { border-color: #f0c060; }
  .objet.t-Diamond   { border-color: #a8d8f8; }
  .objet.t-Legendary { border-color: #f08040; }

  .objet.enchante { box-shadow: inset 0 0 0 1px var(--ench, rgba(192,96,240,.55)); }
  .objet.enchante .ench { color: var(--ench, var(--laiton-bas)); }

  .emplacement {
    display: block;
    font-size: 9px;
    letter-spacing: .02em;
    opacity: .9;
  }

  .em-C { color: #c69c6c; }   /* ralentissement */
  .em-D { color: #f0c820; }   /* bouclier */
  .em-E { color: #88e830; }   /* soin */
  .em-F { color: #68e8c0; }   /* hâte */
  .em-G { color: #c060f0; }   /* tempo */
  .em-A { color: #f05038; }   /* dégâts */
  .em-B { color: #f89840; }   /* brûlure */
  .em-Stove  { color: #f89840; }
  .em-Cooler { color: #38c8f0; }

  .e-Golden      { --ench: #f0c060; }
  .e-Heavy       { --ench: #9a8f7a; }
  .e-Icy         { --ench: #7fd3ff; }
  .e-Turbo       { --ench: #4fe0a0; }
  .e-Shielded    { --ench: #ffd24a; }
  .e-Restorative { --ench: #7ee08a; }
  .e-Toxic       { --ench: #7ad13f; }
  .e-Fiery       { --ench: #ff7a3c; }
  .e-Shiny       { --ench: #e8e0ff; }
  .e-Deadly      { --ench: #ff5a6e; }
  .e-Radiant     { --ench: #fff3b0; }
  .e-Obsidian    { --ench: #b06cff; }
  .e-Mossy       { --ench: #8fbf6a; }

  .talents {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    width: 100%;
  }

  .talent {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 34px;
    padding: 3px 8px;
    border: 1px solid var(--trait);
    border-radius: 9px;
    background: #0d0703;
    font-size: 11px;
    color: var(--discret);
  }

  /* Les cinq paliers. Le bronze et le légendaire manquaient : un talent
     légendaire prenait donc l'apparence neutre, indistinguable d'un bronze. */
  .talent.t-Bronze    { border-color: #7a4e28; color: #c99a6a; }
  .talent.t-Silver    { border-color: #6a6a6a; color: #d0d0d0; }
  .talent.t-Gold      { border-color: #8a6a34; color: #d8bd86; }
  .talent.t-Diamond   { border-color: #5d7d95; color: #bcd8ea; }
  .talent.t-Legendary { border-color: #a05428; color: #f0a070; }

  .vide {
    font-size: 12px;
    color: var(--discret);
    margin-bottom: 10px;
    height: 15px;
  }

  .etat {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 9px 14px;
    border: 1px solid var(--trait);
    border-radius: 3px;
    background: rgba(0, 0, 0, .3);
  }

  .voyant {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--discret);
    flex: none;
  }

  .etat[data-code="pret"]    .voyant { background: var(--vif);
    box-shadow: 0 0 9px rgba(110, 224, 138, .8); animation: pulse 2.4s ease-in-out infinite; }
  .etat[data-code="attente"] .voyant,
  .etat[data-code="config"]  .voyant,
  .etat[data-code="jeu"]     .voyant { background: var(--attente); }
  .etat[data-code="erreur"]  .voyant { background: var(--alerte);
    box-shadow: 0 0 9px rgba(224, 106, 90, .7); }

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  @media (prefers-reduced-motion: reduce) { .voyant { animation: none !important } }

  .libelle { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .precision { font-size: 12px; color: var(--discret); margin-top: 7px; min-height: 15px; }

  .pousse { flex: 1 }

  .lien {
    background: none;
    border: 0;
    color: var(--discret);
    font: inherit;
    font-size: 12px;
    letter-spacing: .16em;
    cursor: pointer;
    padding: 6px;
  }
  .lien:hover { color: var(--laiton); }

  #bascule {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .chevron {
    display: inline-flex;
    transition: transform .22s ease;
  }

  .reglages {

    /* Même largeur que la visualisation du plateau : à 460 px, l'explication
       du délai se brisait en lignes d'un seul mot. */

    display: none;
    flex-direction: column;

  /* ── V3 : bandeau d'état, partie, onglets, diagnostic, journal ───────── */
  .bandeau-inutilise {

  .bandeau .temoin.ok .voyant { background: var(--vif); box-shadow: 0 0 7px rgba(110, 224, 138, .7); }
  .bandeau .temoin.attente .voyant { background: var(--attente); }
  .bandeau .temoin.erreur .voyant { background: var(--alerte); }

  .accueil {

  .compteurs b { color: var(--laiton); font-weight: 700; font-size: 17px; }

  .diag { display: flex; flex-direction: column; gap: 7px; }

    font-size: 15px;

  .diag .controle .voyant { background: #3a2c1c; }
  .diag .controle.ok .voyant { background: var(--vif); }
  .diag .controle.attente .voyant { background: var(--attente); }
  .diag .controle.erreur .voyant { background: var(--alerte); }
  .diag .controle .nom { color: var(--discret); letter-spacing: .04em; }

  .jauge { height: 7px; border-radius: 4px; background: #0d0703; border: 1px solid var(--trait); overflow: hidden; margin-top: 4px; max-width: 320px; }
  .jauge > span { display: block; height: 100%; background: var(--vif); }
  .jauge.haute > span { background: var(--attente); }

  .journal { width: 100%; max-width: 820px; margin: 4px auto 0; }

  .journal ol { list-style: none; max-height: 190px; overflow-y: auto; padding: 4px 10px; border-top: 1px solid var(--trait); }
  .journal li { display: flex; gap: 12px; font-size: 15px; padding: 3px 0; border-bottom: 1px solid rgba(74, 52, 24, .4); }
  .journal li .h { color: var(--discret); font-size: 13px; min-width: 44px; }
  .journal li.j-victoire .t { color: #6fb2f2; }
  .journal li.j-defaite .t { color: #ef6a5c; }

  .journal li.j-talent .t { color: var(--laiton); }
  .journal .rien { color: var(--discret); font-size: 14px; padding: 6px 0; }


  label { font-size: 14px; letter-spacing: .16em; color: var(--discret); display: block; margin-bottom: 4px; }

  input {

  #alerte-version {

  .delai { display: flex; align-items: center; flex-wrap: wrap; gap: 5px;
           justify-content: center; }

  /* Steam ou client Tempo : le streamer qui emploie les deux bascule ici,
     sans réinstaller ni redémarrer. */
  .sources { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }

  /* Le chemin ne se saisit plus : il vient de l'installation. Un voyant dit
     si le mod est bien là, car sans lui la version choisie ne donne rien. */
  #jeu[readonly] { opacity: .75; cursor: default; }

  .voyant-mod {
    flex: none;

    border-radius: 50%;
    align-self: center;

  .avis-mod {

    font-size: 14px;
    line-height: 1.45;
    color: #e08a7a;
  }
  .avis-mod:empty { display: none; }
  .avis-mod a { color: var(--laiton); }

  .sources button {
    padding: 4px 14px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: transparent;
    color: var(--discret);
    font-family: inherit;
    font-size: 13px;
    cursor: pointer;
  }
  .sources button:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .sources button.actif {
    color: var(--laiton);
    border-color: var(--laiton);
    background: #241706;
  }

  .delai button {
    padding: 4px 10px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: transparent;
    color: var(--discret);
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .delai button:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .delai button.actif {
    color: var(--laiton);
    border-color: var(--laiton);
    background: #241706;
  }
  /* Les petites flèches natives du champ numérique sont laides et inutiles :
     on saisit un nombre de secondes, on ne l'incrémente pas une par une. */
  .delai input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  .delai input[type="number"]::-webkit-outer-spin-button,
  .delai input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .delai input[type="number"] {
    width: 58px;
    padding: 3px 4px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--laiton);
    font-family: inherit;
    text-align: right;
  }
  .delai-unite { font-size: 15px; color: var(--discret); }

  /* L'explication se lit en entier : mieux vaut une taille confortable et un
     interligne aéré qu'un bloc compact. */
  .aide { font-size: 15px; line-height: 1.5; color: var(--discret);
          margin-top: 16px; text-align: center; }

  /* Le second paragraphe de l'explication respire. */
  .aide .para { margin-top: 14px; }

  .adverse .objet,
  .adverse .talent { background: #0a1116; }
  .adverse .case { border-color: #24333c; background: #080d11; }

  .plateau.centre {
    display: flex;
    justify-content: center;
    gap: 5px;
  }
  .plateau.centre .objet { flex: 0 0 auto; min-width: 92px; }

  .adverse .objet.rencontre {
    border-style: dashed;
    opacity: .82;
  }

  .plateau.libre {
    display: block;
    position: relative;
    height: 54px;
  }
  .plateau.libre .objet {
    position: absolute;
    top: 0;
    height: 36px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .talents {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 5px;
    justify-content: center;
  }

  .plateau.reserve .objet { border-style: dotted; }

  .ligne-champ { display: flex; gap: 5px; }
  .ligne-champ input { flex: 1; min-width: 0; }

  .parcourir {
    flex: none;
    padding: 0 10px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--discret);
    font: inherit;
    font-size: 14px;
    letter-spacing: .08em;
    cursor: pointer;
    white-space: nowrap;
  }
  .parcourir:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .parcourir:disabled { opacity: .5; cursor: default; }

  .calibrage {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 16px 20px 18px;
    background: var(--fond);
  }
  .calibrage.ouvert { display: flex; }

  .cal-titre {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 15px;
    letter-spacing: .08em;
    color: var(--laiton);
  }
  .cal-consigne { font-size: 12px; color: var(--discret); margin-top: 3px; min-height: 15px; }

  .cal-scene {
    position: relative;
    flex: none;
    aspect-ratio: 16 / 9;
    width: 100%;
    max-width: min(100%, calc((100vh - 230px) * 16 / 9));
    margin: auto;
    background: #0a0603 center/100% 100% no-repeat;
    border: 1px solid var(--trait);
    border-radius: 3px;
    overflow: hidden;
    outline: none;
    user-select: none;
  }

  .cal-vide {
    position: absolute;
    inset: 0 0 auto 0;
    display: grid;
    justify-items: center;
    gap: 6px;
    text-align: center;
    font-size: 13px;
    color: var(--discret);
    padding: 22px 20px 0;
  }
  .cal-scene.remplie .cal-vide { display: none; }

  .cal-retirer {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid var(--trait);

    background: rgba(10, 7, 3, .8);

  .cal-vide .lien {

  }

  .cal-cadre {
    position: absolute;
    border: 2px solid var(--laiton);
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45);
    cursor: move;
  }

  .poignee {
    position: absolute;
    width: 14px;
    height: 14px;
    background: var(--laiton);
    border-radius: 2px;
  }
  .poignee.nw { left: -8px; top: -8px;    cursor: nwse-resize; }
  .poignee.ne { right: -8px; top: -8px;   cursor: nesw-resize; }
  .poignee.sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
  .poignee.se { right: -8px; bottom: -8px; cursor: nwse-resize; }

  .cal-zones { position: absolute; inset: 0; pointer-events: none; }
  .cal-zones div {

    box-sizing: border-box;

  }

  .cal-zones div.zone-talent {
    border-color: rgba(240,192,96,.9);
    background: rgba(240,192,96,.16);
  }

  .cal-zones div.repere { border: 0; background: none; }
  .cal-zones div.cercle {
    border: 1px solid rgba(255, 90, 120, .95);
    border-radius: 50%;
  }
  .cal-zones div.equerre { border: 0; }
  .cal-zones div.equerre.tr {
    border-top: 1px solid rgba(255, 90, 120, .95);
    border-right: 1px solid rgba(255, 90, 120, .95);
  }
  .cal-zones div.equerre.tl {
    border-top: 1px solid rgba(255, 90, 120, .95);
    border-left: 1px solid rgba(255, 90, 120, .95);
  }

  .cal-aide { font-size: 15px; color: var(--discret); text-align: center; min-height: 14px; }
  .cal-boutons { display: flex; align-items: center; gap: 8px; }

  /* Une vignette flottante en bas à droite : les avis valent pour toute la
     fenêtre. Le coin haut est déjà pris par le bandeau de mise à jour et le
     sélecteur de langue. */
  .avis {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 45;
    max-width: 360px;
    padding: 9px 14px;
    border: 1px solid var(--trait);
    border-radius: 3px;
    background: #1a1008;
    color: var(--attente);
    font-size: 15px;
    box-shadow: 0 2px 14px rgba(0, 0, 0, .5);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }
  .avis:not(:empty) { opacity: 1; transform: none; }
  .avis.bon { color: var(--vif); border-color: var(--vif); }

  /* Pendant le calibrage, l'écran entier appartient au réglage. */
  body:has(.calibrage.ouvert) .avis { display: none; }
  .avis.bon { color: var(--vif); }

  /* En bas à gauche, le sélecteur passait sous le panneau élargi. En haut à
     droite, il reste atteignable quelle que soit la hauteur du contenu. */
  /* En bas à gauche, le sélecteur passait sous le panneau élargi. En haut à
     droite, il reste atteignable quelle que soit la hauteur du contenu.

     Il se glisse SOUS le bandeau de version et sous le calibrage, qui
     occupent le même coin : mieux vaut qu'il disparaisse un instant que
     d'empêcher de lire une alerte. */
  .langues {
    position: fixed;
    top: 12px;
    right: 14px;
    z-index: 40;
    display: flex;
    gap: 6px;
  }

  /* Le bandeau de version descend le sélecteur plutôt que de le masquer. */
  body:has(#alerte-version:not([hidden])) .langues { top: 46px; }

  /* Pendant le calibrage, il s'efface : l'écran entier appartient au réglage. */
  body:has(.calibrage.ouvert) .langues { display: none; }

  .langues { align-items: center; }
  .langues .globe { color: var(--discret); opacity: .75; flex: none;
                    font-size: 18px; }

  .langues select {
    padding: 7px 11px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--discret);
    font: inherit;
    font-size: 16px;
    cursor: pointer;
    opacity: .75;
  }
  /* Le menu déroulant du système n'hérite pas toujours de la taille du
     sélecteur : on la lui impose. */
  .langues select option { font-size: 16px; }
  .langues select:hover, .langues select:focus {
    opacity: 1;
    color: var(--laiton);
    border-color: var(--laiton-bas);
    outline: none;
  }

  /* ── V3 : rail, coin droit, pages et cases teintées ───────────────────── */
  :root { --rail: 224px; }
  body { padding: 24px 22px 40px calc(var(--rail) + 22px); }

  .rail {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 30;
    width: var(--rail);
    display: flex; flex-direction: column; gap: 4px;
    padding: 22px 12px;
    background: rgba(0, 0, 0, .28);
    border-right: 1px solid rgba(74, 52, 24, .6);
  }
  .rail .marque { padding: 0 6px 22px; display: flex; align-items: center; gap: 11px; }
  .rail .logo { width: 46px; height: 46px; border-radius: 9px; flex: none;
                border: 1px solid var(--laiton-bas); box-shadow: 0 2px 10px rgba(0, 0, 0, .5); }
  .rail .signature a { color: inherit; text-decoration: none; }
  .rail .signature a:hover { color: var(--laiton); text-decoration: underline; text-underline-offset: 2px; }
  .rail h1 { font-size: 16px; line-height: 1.35; letter-spacing: .2em; text-indent: 0; }
  .rail .signature { text-indent: 0; margin-top: 4px; font-size: 10px; }
  .rail button {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border: 0; border-radius: 6px;
    background: none; color: var(--discret); cursor: pointer;
    font: 600 15px/1 'Rajdhani', sans-serif; letter-spacing: .04em; text-align: left;
  }
  .rail button:hover { color: var(--texte); }
  .rail button.actif {
    color: var(--laiton);
    background: linear-gradient(90deg, rgba(240, 192, 96, .13), rgba(240, 192, 96, 0));
    box-shadow: inset 2px 0 0 var(--laiton);
  }
  .rail svg { flex: none; }

  /* Le groupe des réglages, et le pied du rail : le témoin puis la langue,
     collés dans le coin inférieur gauche. */
  .rail .groupe {
    margin: 18px 10px 4px; font: 600 10.5px/1 'Rajdhani', sans-serif;
    letter-spacing: .16em; text-transform: uppercase; color: var(--laiton-bas);
  }
  .rail button { font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
  .rail button span { overflow: hidden; text-overflow: ellipsis; }
  .pied-rail { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .pied-rail .etat { padding: 7px 10px; gap: 9px; }
  .pied-rail .libelle { font-size: 13.5px; }
  .pied-rail .precision { margin: -3px 2px 0; min-height: 0; font-size: 11.5px; line-height: 1.3; }
  .pied-rail .precision:empty { display: none; }
  .pied-rail .langues { position: static; }
  .pied-rail .langues select { flex: 1; min-width: 0; font-size: 14px; padding: 6px 8px; }
  body:has(#alerte-version:not([hidden])) .rail { top: 33px; }
  #onglets { display: none; }

  /* Le calibrage occupe la place du contenu, le menu de gauche reste. La
     langue du menu ne s'efface plus pendant le calibrage. */
  .calibrage { left: var(--rail); }
  body:has(.calibrage.ouvert) .pied-rail .langues { display: flex; }
  body:has(#alerte-version:not([hidden])) .calibrage { top: 33px; }

  /* Les pages : une seule visible. Elles commencent sous le coin droit. */
  .page { width: 100%; max-width: 820px; padding-top: 14px; }
  body[data-page="partie"]   #page-reglages,
  body[data-page="reglages"] #page-partie { display: none; }
  .reglages { border-top: 0; padding-top: 0; margin-top: 0; max-width: none; }

  /* Fenêtre étroite : le rail ne garde que ses icônes. */
  @media (max-width: 760px) {
    :root { --rail: 58px; }
    .rail { padding: 16px 8px; align-items: center; }
    .rail button span, .rail .groupe, .rail .marque > div { display: none; }
    /* Le logo seul, au-dessus des icônes. */
    .rail .marque { padding: 0 0 14px; }
    .rail .logo { width: 38px; height: 38px; border-radius: 8px; }
    .rail button { padding: 10px; }
    .rail button[data-onglet="compte"] { margin-top: 14px; }
    /* Le témoin se réduit à son voyant ; la langue, à son sélecteur. */
    .pied-rail { align-items: center; }
    .pied-rail .etat { padding: 9px; border-radius: 50%; }
    .pied-rail .libelle, .pied-rail .precision, .pied-rail .langues .globe { display: none; }
    .pied-rail .langues select { width: 42px; padding: 5px 2px; font-size: 12px; }
  }

  /* La partie : pastilles rondes, compteurs à la taille du texte. */
  #cadre-partie .partie-ligne { gap: 11px; }
  #jours { gap: 6px; justify-content: center; }
  .pastille { width: 11px; height: 11px; border-radius: 50%; display: block; }
  .pastille.v { background: #3f8ae0; }
  .pastille.d { background: #d0453a; }
  .pastille.r { background: #5a1712; box-shadow: inset 0 0 0 1.5px #d0453a; }
  .pastille.encours { box-shadow: inset 0 0 0 1.5px var(--laiton); }
  #compteurs { gap: 0; font-size: 13px; letter-spacing: .02em; flex-wrap: wrap; justify-content: center; }
  #compteurs span + span::before { content: "\00b7"; margin: 0 10px; color: var(--trait); }
  #compteurs b { font-size: 13px; font-weight: 600; color: var(--texte); }

  /* Les cadres : assez d'air pour que chaque section se lise d'un coup
     d'œil, sans dépasser de la fenêtre par défaut (1170 × 770). */
  .cadre { padding: 18px 14px 13px; margin-bottom: 18px; }
  .cadre > h2 { top: -8px; }
  .plateau { gap: 6px; }

  /* Les cases : la rareté teinte discrètement le fond, le contour et le
     texte. */
  .objet, .talent { --rar: #6a5a44; }
  .t-Bronze { --rar: #cd7f32; } .t-Silver { --rar: #c8c8c8; } .t-Gold { --rar: #f0c060; }
  .t-Diamond { --rar: #a8d8f8; } .t-Legendary { --rar: #f08040; }
  .cadre .plateau { min-height: 40px; }
  .case { height: auto; min-height: 40px; border: 1px dashed rgba(232, 220, 196, .07); border-radius: 6px; background: none; }
  /* La case grandit avec son texte (nom, enchantement, emplacement) au lieu
     de le couper ; toute la rangée prend alors la même hauteur. */
  .objet, .objet[class*="t-"] {
    height: auto; min-height: 40px; padding: 3px 6px; overflow: visible;
    border: 1px solid color-mix(in srgb, var(--rar) 40%, transparent); border-radius: 6px;
    background: color-mix(in srgb, var(--rar) 11%, #140c06);
    font-size: 12px; line-height: 1.15;
    color: color-mix(in srgb, var(--rar) 45%, #f4ecdc);
  }
  .objet.enchante { box-shadow: none; }
  .objet .ench { font-size: 9.5px; margin: 0; }
  .objet .emplacement { font-size: 9.5px; }
  .plateau.reserve .objet { border-style: solid; }
  .adverse .objet { background: color-mix(in srgb, var(--rar) 9%, #0a1116); }
  .adverse .case { border-color: rgba(143, 180, 201, .09); background: none; }
  .adverse .objet.rencontre { border-style: dashed; }
  .talents { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
  .talent, .talent[class*="t-"] {
    min-height: 26px; padding: 2px 13px;
    border: 1px solid color-mix(in srgb, var(--rar) 40%, transparent); border-radius: 13px;
    background: color-mix(in srgb, var(--rar) 11%, #140c06);
    color: color-mix(in srgb, var(--rar) 45%, #f4ecdc);
    font-size: 12px;
  }
  .adverse .talent { background: color-mix(in srgb, var(--rar) 9%, #0a1116); }
  #page-partie .accueil { margin: 0 auto 16px; }
  .plateau.libre { height: 68px; }
  .plateau.libre .objet { white-space: normal; }

  /* Cases étroites : plus petit, sans couper les mots. */
  @media (max-width: 760px) {
    .objet, .objet[class*="t-"] { padding: 2px 2px; font-size: 11px; hyphens: manual; word-break: normal; }
    .objet .ench { font-size: 8.5px; letter-spacing: 0; }
    .objet .emplacement { font-size: 8.5px; }
  }

  /* Le diagnostic : groupes, détail du message, bouton de copie. */
  .diag { gap: 4px; }
  .diag h3 { font: 600 10.5px/1 'Rajdhani', sans-serif; letter-spacing: .16em; text-transform: uppercase;
             color: var(--laiton-bas); margin: 16px 0 6px; }
  .diag h3:first-child { margin-top: 0; }
  .diag .controle { padding: 3px 0; }
  .repartition { display: flex; height: 9px; border-radius: 5px; overflow: hidden; max-width: 320px;
                 margin-top: 2px; border: 1px solid var(--trait); }
  .repartition span { display: block; height: 100%; }
  .legende { display: flex; flex-wrap: wrap; gap: 3px 14px; margin-top: 6px; font-size: 12.5px;
             color: var(--discret); max-width: 520px; }
  .legende i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .legende b { color: var(--texte); font-weight: 600; }
  .diag .copier { margin-top: 22px; align-self: flex-start; background: none; border: 1px solid var(--laiton-bas);
                  color: var(--laiton); font: 600 13px/1 'Rajdhani', sans-serif; letter-spacing: .14em;
                  padding: 10px 18px; border-radius: 3px; cursor: pointer; display: inline-flex; gap: 9px; align-items: center; }
  .diag .copier:hover { border-color: var(--laiton); }

  /* Le journal, un cadre comme les autres, toujours ouvert. */
  .journal.cadre { margin-top: 0; }
  .journal ol { border-top: 0; padding: 2px 4px; max-height: 190px; }
  /* L'ascenseur du journal : un trait laiton sur un rail brun, avec une
     légère lueur. Celui du système, gris et blanc, jurait avec la fenêtre. */
  .journal ol::-webkit-scrollbar { width: 4px; }
  .journal ol::-webkit-scrollbar-track { background: var(--trait); border-radius: 2px; margin: 6px 0; }
  .journal ol::-webkit-scrollbar-thumb { background: var(--laiton); border-radius: 2px; box-shadow: 0 0 4px rgba(240, 192, 96, .6); }
  .journal ol::-webkit-scrollbar-button { display: none; }
  #jours { min-height: 11px; }
  /* « en attente d'une partie » redisait ce que dit déjà le témoin, et
     déplaçait le journal. */
  #page-partie .vide { display: none; }

  /* Le voyant de mise à jour : doré, et cliquable. */
  .pied-rail .etat.maj { text-decoration: none; color: var(--laiton); border-color: var(--laiton-bas); cursor: pointer; }
  .pied-rail .etat.maj:hover { border-color: var(--laiton); }
  .pied-rail .etat.maj .voyant { background: var(--laiton); box-shadow: 0 0 8px rgba(240, 192, 96, .7); }
  .pied-rail .etat.maj[hidden] { display: none; }
</style>
</head>

  (function construireLangues() {
    var boite = document.getElementById('langues');
    var dispo = ORDRE.filter(function (l) { return TEXTES[l]; });

    boite.insertAdjacentHTML('beforeend',
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" '
      + 'stroke="currentColor" stroke-width="1.4" class="globe">'
      + '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/>'
      + '<path d="M3.2 9h17.6M3.2 15h17.6"/></svg>');

    var sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Langue');
    dispo.forEach(function (l) {
      var o = document.createElement('option');
      o.value = l;
      o.textContent = NOMS_LANGUE[l] || l.toUpperCase();
      if (l === LANGUE) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      if (sel.value === LANGUE) return;
      try { window.localStorage.setItem(CLE_LANGUE, sel.value); } catch (e) { /* tant pis */ }
      location.reload();
    });
    boite.appendChild(sel);
  })();

  function caseVide() {
    var d = document.createElement('div');
    d.className = 'case';
    return d;
  }

  function dessinerBande(cartes, choix, centre) {
    if (choix && choix.length >= 2) {
      var ordonnes = choix.slice().sort(function (a, b) {
        return (a.x || 0) - (b.x || 0);
      });
      var debut = Math.max(0, Math.floor((10 - ordonnes.length * 2) / 2));
      var places = ordonnes.map(function (o, i) {
        return { s: debut + i * 2, n: 2, nom: o.nom, tier: o.tier, ench: o.ench,
                 rencontre: true };
      });
      dessinerPlateau(places, elFace, true);
      return;
    }

    var aPlacer = cartes;
    if (centre && cartes.length && cartes.every(function (o) {
          return typeof o.x === 'number'; })) {
      var B = GEOMETRIE.BOARD;
      aPlacer = cartes.slice()
        .sort(function (a, b) { return a.x - b.x; })
        .map(function (o) {
          var n = Math.max(1, Math.min(3, o.n || 1));
          var colonne = (o.x - B.left) * 10 / B.width - n / 2;
          return Object.assign({}, o, {
            s: Math.max(0, Math.min(10 - n, Math.round(colonne))),
          });
        });
    }
    dessinerPlateau(aPlacer, elFace, false);
  }

  function poserNom(el, o) {
    el.textContent = '';
    if (o.ench) {
      var e = document.createElement('span');
      e.className = 'ench';
      e.textContent = nomEnchantement(o.ench);
      el.appendChild(e);
    }
    el.appendChild(document.createTextNode(o.nom));

    if (o.se && o.se.length) {
      var bloc = document.createElement('span');
      bloc.className = 'emplacement';
      o.se.forEach(function (code, i) {
        if (i) bloc.appendChild(document.createTextNode(' · '));
        var n = document.createElement('span');
        n.className = 'em-' + code;
        n.textContent = nomEmplacement(code);
        bloc.appendChild(n);
      });
      el.appendChild(bloc);
    }
  }

  function dessinerPlateau(objets, ou, centre) {
    var elPlateau = ou || document.getElementById('plateau');
    elPlateau.textContent = '';
    var occupe = 0;

    var placees = centre && objets.length && objets.every(function (o) {
      return typeof o.x === 'number';
    });

    elPlateau.classList.toggle('centre', !!centre && !placees);
    elPlateau.classList.toggle('libre', !!placees);

    if (placees) {
      var ys = objets.map(function (o) { return typeof o.y === 'number' ? o.y : 0; });
      var yMin = Math.min.apply(null, ys);
      var yMax = Math.max.apply(null, ys);
      var etendue = yMax - yMin;

      var B = GEOMETRIE.BOARD;
      var versPlateau = function (xJeu) { return (xJeu - B.left) * 100 / B.width; };

      objets.forEach(function (o) {
        var d = document.createElement('div');
        d.className = 'objet t-' + (o.tier || '')
          + (o.ench ? ' enchante e-' + o.ench : '')
          + (o.rencontre ? ' rencontre' : '');
        poserNom(d, o);
        d.title = o.nom + (o.ench ? ' - ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');

        var larg = Math.max(1, Math.min(3, o.n || 1)) * 10 - 1.4;
        var gauche = versPlateau(o.x) - larg / 2;
        d.style.left = Math.max(-2, Math.min(102 - larg, gauche)) + '%';
        d.style.width = larg + '%';

        if (etendue > 0.5) {
          var part = (typeof o.y === 'number') ? (o.y - yMin) / etendue : 0;
          d.style.top = Math.round(part * 14) + 'px';
        }
        elPlateau.appendChild(d);
      });
      return;
    }

    if (centre) {
      objets.forEach(function (o) {
        var d = document.createElement('div');
        d.className = 'objet t-' + (o.tier || '')
          + (o.ench ? ' enchante e-' + o.ench : '')
          + (o.rencontre ? ' rencontre' : '');
        d.style.gridColumn = 'span ' + Math.max(1, Math.min(3, o.n || 1));
        poserNom(d, o);
        d.title = o.nom + (o.ench ? ' - ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');
        elPlateau.appendChild(d);
      });
      return;
    }

    objets.forEach(function (o) {
      while (occupe < o.s) { elPlateau.appendChild(caseVide()); occupe++; }
      var d = document.createElement('div');
      d.className = 'objet t-' + (o.tier || '')
        + (o.ench ? ' enchante e-' + o.ench : '')
        + (o.rencontre ? ' rencontre' : '');
      d.style.gridColumn = 'span ' + Math.max(1, Math.min(3, o.n || 1));
      poserNom(d, o);
      d.title = o.nom + (o.ench ? ' - ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');
      elPlateau.appendChild(d);
      occupe += (o.n || 1);
    });

    while (occupe < 10) { elPlateau.appendChild(caseVide()); occupe++; }
  }

  /* Prévient le streamer qu'une version plus récente existe. On ne compare que
     des versions connues : hors ligne, on ne dit rien. */
  /* Compare deux numéros du genre « 2.0.1 ». Rend un nombre négatif si le
     premier est le plus ancien. */
  function comparerVersions(a, b) {
    var x = String(a).split('.').map(Number);
    var y = String(b).split('.').map(Number);
    for (var i = 0; i < Math.max(x.length, y.length); i++) {
      var d = (x[i] || 0) - (y[i] || 0);
      if (d) return d;
    }
    return 0;
  }

  /* Une version plus récente publiée : un voyant au pied du menu, au-dessus
     du témoin, qui mène à la page de téléchargement. Rien sinon. Le bandeau
     d'autrefois, en haut de la fenêtre, déplaçait tout le contenu. */
  function majAlerteVersion(ici, enLigne) {
    var el = document.getElementById('voyant-maj');
    if (!el) return;
    /* On n'alerte que si la version publiée est RÉELLEMENT plus récente.
       Une simple différence suffisait auparavant : la 2.0.1 fraîchement
       installée se croyait périmée face à la 2.0.0 encore publiée. */
    var plusRecente = !!ici && !!enLigne && comparerVersions(ici, enLigne) < 0;

    if (!plusRecente) return;

    el.title = (T.versionAncienne || '').replace('{}', enLigne) + ' ' + (T.versionLien || '');
  }

  /* Reflète le délai courant : la boîte et le bouton retenu. */
  function majDelai(d) {
    var n = document.getElementById('n-delai');
    if (n) n.value = d;

    var connu = false;
    [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
      var pris = (b.dataset.delai === String(d));
      if (pris) connu = true;
      b.classList.toggle('actif', pris);
    });
    var libre = document.getElementById('b-libre');
    if (libre) libre.classList.toggle('actif', !connu);
  }

  function cadreCalcule() {
    var B = GEOMETRIE.BOARD;
    var p = calPlateau || plateauParDefaut();
    var w = p.w * 100 / B.width;
    var h = p.h * 100 / B.height;
    return { l: p.l - B.left * w / 100, t: p.t - B.top * h / 100, w: w, h: h };
  }

  function plateauDepuisCadre(c) {
    var B = GEOMETRIE.BOARD;

  function dessinerCadre() {
    var p = calPlateau || plateauParDefaut();
    elRect.style.left   = pct(p.l);
    elRect.style.top    = pct(p.t);
    elRect.style.width  = pct(p.w);
    elRect.style.height = pct(p.h);

  function projX(x) { var c = cadreCalcule(); return c.l + x * c.w / 100; }
  function projY(y) { var c = cadreCalcule(); return c.t + y * c.h / 100; }
  function projL(w) { return w * cadreCalcule().w / 100; }
  function projH(h) { return h * cadreCalcule().h / 100; }

  function dessinerZones() {
    elZones.textContent = '';
    var B = GEOMETRIE.BOARD;
    var pas = B.width / B.slots;

    for (var i = 0; i < B.slots; i++) {
      var d = document.createElement('div');
      d.style.left   = pct(projX(B.left + i * pas));
      d.style.top    = pct(projY(B.top));
      d.style.width  = pct(projL(pas));
      d.style.height = pct(projH(B.height));
      elZones.appendChild(d);
    }

    (GEOMETRIE.REPERES.cercles || []).forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'repere cercle';
      d.style.left   = pct(projX(c.x));
      d.style.top    = pct(projY(c.y));
      d.style.width  = pct(projL(c.w));
      d.style.height = pct(projH(c.h));
      elZones.appendChild(d);

      d.style.width  = pct(projL(e.w));
      d.style.height = pct(projH(e.h));
      elZones.appendChild(d);
    });

    var L = GEOMETRIE.SKILL_LAYOUTS[0];
    L.slots.forEach(function (p) {
      var d = document.createElement('div');
      d.className = 'zone-talent';
      d.style.left   = pct(projX(p[0] - L.w / 2));

    var p = positionRelative(ev);
    var dx = p.x - saisie.depart.x, dy = p.y - saisie.depart.y;
    var c = saisie.cadre;
    var MIN = 5;

    if (!calPlateau) calPlateau = plateauParDefaut();

    if (!saisie.coin) {
      calPlateau.l = Math.max(0, Math.min(100 - c.w, c.l + dx));
      calPlateau.t = Math.max(0, Math.min(100 - c.h, c.t + dy));
    } else {
      var r = elScene.getBoundingClientRect();
      var aspectScene = (r.width && r.height) ? r.width / r.height : 16 / 9;
      var RAPPORT = (GEOMETRIE.BOARD.width / GEOMETRIE.BOARD.height) * (16 / 9) / aspectScene;
      var versLaDroite = saisie.coin.indexOf('e') >= 0;

      var la = versLaDroite ? c.w + dx : c.w - dx;
      if (la < MIN) la = MIN;
      var ha = la / RAPPORT;

      var g = versLaDroite ? c.l : c.l + c.w - la;
      var hh = (saisie.coin.indexOf('s') >= 0) ? c.t : c.t + c.h - ha;

      if (g >= 0 && g + la <= 100 && hh >= 0 && hh + ha <= 100) {

    var pasX = r.width  ? 100 / r.width  : 0.05;
    var pasY = r.height ? 100 / r.height : 0.09;

    repetitions = ev.repeat ? repetitions + 1 : 0;
    var facteur = Math.min(1 + Math.pow(repetitions, 1.6) / 12, 40);

    if (!calPlateau) calPlateau = plateauParDefaut();

    var c = cadreCalcule();
    var v = [c.l, c.t, c.w, c.h]
      .map(function (x) { return Math.round(x * 100) / 100; });
    var plein = v[0] === 0 && v[1] === 0 && v[2] === 100 && v[3] === 100;
    fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ CADRE: plein ? '' : v.join(',') })
    }).then(relireConfig).then(function () {
      fermerCalibrage();
      /* Un mot sur le bouton, le temps de le lire. */
      var b = document.getElementById('cal-valider');
      var avant = b.textContent;
      b.textContent = T.enregistre;
      b.disabled = true;
      setTimeout(function () { b.textContent = avant; b.disabled = false; }, 1400);
    });
  });

  (function () {
    var n = document.getElementById('n-delai');
    if (!n) return;

    function borner(v) {
      var x = parseInt(v, 10);
      if (!isFinite(x) || x < 0) x = 0;
      return Math.min(x, 86400);   // une journée, garde-fou
    }

    function poser(v, envoyer) {
      var d = borner(v);
      n.value = d;

      /* Le bouton retenu est celui dont la valeur correspond ; à défaut,
         c'est « Autre », qui renvoie à la saisie libre. */
      var connu = false;
      [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
        var pris = (b.dataset.delai === String(d));
        if (pris) connu = true;
        b.classList.toggle('actif', pris);
      });
      var libre = document.getElementById('b-libre');
      if (libre) libre.classList.toggle('actif', !connu);
      if (!envoyer) return;
      fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ DELAI_STREAM: String(d) })
      }).then(relireConfig);
    }

    [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.delai === 'libre') { n.focus(); n.select(); poser(n.value, true); }
        else poser(b.dataset.delai, true);
      });
    });

    n.addEventListener('change', function () { poser(n.value, true); });
  })();

  document.getElementById('calibrer').addEventListener('click', function () {
    var c = (document.getElementById('etat-cadre').dataset.cadre || '')
      .split(',').map(parseFloat);
    ouvrirCalibrage(c.length === 4 && isFinite(c[0])
      ? { l: c[0], t: c[1], w: c[2], h: c[3] } : null);
  });
  majCalibrageIntegre();



  function enregistrerDossier() {
    var chemin = document.getElementById('jeu').value;

    /* Le dossier appartient à la version en cours : l'enregistrer aussi dans
       sa propre clé, sinon la bascule le perdrait. */
    var maj = { BAZAAR_PATH: chemin };
    maj[(source === 'tempo') ? 'TEMPO_PATH' : 'STEAM_PATH'] = chemin;

    return fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(maj)
    }).then(relireConfig);
  }

  document.getElementById('jeu').addEventListener('change', function () {
    var champ = this.value.trim();
    if (champ === dossierEnregistre) return;
    enregistrerDossier().then(function () {
      avis(T.enregistre, true);
    });
  });
})();
</script>
