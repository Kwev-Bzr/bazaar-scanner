<style>
  :root {
    --fond:      #140c06;
    --fond-haut: #241608;
    --laiton:    #f0c060;
    --laiton-bas:#8a6a34;
    --texte:     #e8dcc4;
    --discret:   #97866a;
    --trait:     #4a3418;
    --vif:       #6ee08a;
    --attente:   #e0a840;
    --alerte:    #e06a5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background:
      radial-gradient(120% 80% at 50% 0%, var(--fond-haut) 0%, var(--fond) 60%);
    color: var(--texte);
    font-family: 'Rajdhani', 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* La marge basse réserve la place du sélecteur de langue, en position
       fixe : sans elle, le dernier réglage passerait dessous au défilement. */
    padding: 24px 22px 54px;
    overflow-y: auto;
    overflow-x: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Titre ─────────────────────────────────────────────── */

  h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: .22em;
    text-indent: .22em;
    background: linear-gradient(175deg, #ffe6a8 0%, var(--laiton) 45%, var(--laiton-bas) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .signature {
    font-size: 11px;
    letter-spacing: .3em;
    text-indent: .3em;
    color: var(--discret);
    margin-top: 3px;
  }

  .filet {
    width: 74px;
    height: 1px;
    margin: 12px 0 20px;
    background: linear-gradient(90deg, transparent, var(--trait), transparent);
  }

  /* ── Plateau miniature ──────────────────────────────────
     Dix cases, un objet occupant une à trois d'entre elles selon
     sa taille, comme dans le jeu. Les noms viennent directement de
     board_state.json : aucune requête réseau, donc rien qui puisse
     échouer ni coûter quoi que ce soit. */

  /* Le plateau profite de toute la largeur disponible, mais reste borné :
     au-delà, les cases deviennent des rectangles étirés sans rapport avec
     celles du jeu. */
  .plateau {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    width: 100%;
    max-width: 820px;
    margin-bottom: 12px;
  }

  .case {
    height: 54px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
  }

  .objet {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px 4px;
    overflow: hidden;
    border: 1px solid var(--laiton-bas);
    border-radius: 2px;
    background: linear-gradient(180deg, #3a2810, #1c1206);
    font-size: 11px;
    line-height: 1.2;
    text-align: center;
    color: var(--texte);
    word-break: break-word;
    hyphens: auto;
  }

  .objet.t-Bronze    { border-color: #cd7f32; }
  .objet.t-Silver    { border-color: #c8c8c8; }
  .objet.t-Gold      { border-color: #f0c060; }
  .objet.t-Diamond   { border-color: #a8d8f8; }
  .objet.t-Legendary { border-color: #f08040; }

  .objet.enchante { box-shadow: inset 0 0 0 1px rgba(192, 96, 240, .55); }

  .talents {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 4px;
    width: 100%;
    max-width: 820px;
    margin-bottom: 12px;
  }

  .talent {
    padding: 3px 8px;
    border: 1px solid var(--trait);
    border-radius: 9px;
    background: #0d0703;
    font-size: 11px;
    color: var(--discret);
  }

  .talent.t-Gold    { border-color: #8a6a34; color: #d8bd86; }
  .talent.t-Diamond { border-color: #5d7d95; color: #bcd8ea; }
  .talent.t-Silver  { border-color: #6a6a6a; color: #d0d0d0; }

  .vide {
    font-size: 12px;
    color: var(--discret);
    margin-bottom: 10px;
    height: 15px;
  }

  /* ── État ───────────────────────────────────────────────── */

  .etat {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px 9px 14px;
    border: 1px solid var(--trait);
    border-radius: 3px;
    background: rgba(0, 0, 0, .3);
  }

  .voyant {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--discret);
    flex: none;
  }

  .etat[data-code="pret"]    .voyant { background: var(--vif);
    box-shadow: 0 0 9px rgba(110, 224, 138, .8); animation: pulse 2.4s ease-in-out infinite; }
  .etat[data-code="attente"] .voyant,
  .etat[data-code="config"]  .voyant,
  .etat[data-code="jeu"]     .voyant { background: var(--attente); }
  .etat[data-code="erreur"]  .voyant { background: var(--alerte);
    box-shadow: 0 0 9px rgba(224, 106, 90, .7); }

  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }
  @media (prefers-reduced-motion: reduce) { .voyant { animation: none !important } }

  .libelle { font-size: 15px; font-weight: 600; letter-spacing: .04em; }
  .precision { font-size: 12px; color: var(--discret); margin-top: 7px; min-height: 15px; }

  /* ── Configuration ──────────────────────────────────────── */

  .pousse { flex: 1 }

  .lien {
    background: none;
    border: 0;
    color: var(--discret);
    font: inherit;
    font-size: 12px;
    letter-spacing: .16em;
    cursor: pointer;
    padding: 6px;
  }
  .lien:hover { color: var(--laiton); }

  /* Le chevron pointe vers le haut quand la configuration est fermée — il
     indique ce qui va s'ouvrir — et pivote vers le bas une fois ouverte. */
  #bascule {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .chevron {
    display: inline-flex;
    transition: transform .22s ease;
  }

  #bascule.ouvert .chevron { transform: rotate(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .chevron { transition: none; }
  }

  .reglages {
    width: 100%;
    max-width: 460px;
    display: none;
    flex-direction: column;
    gap: 11px;
    padding-top: 16px;
    margin-top: 6px;
    border-top: 1px solid var(--trait);
  }
  .reglages.ouvert { display: flex; }

  label { font-size: 11px; letter-spacing: .16em; color: var(--discret); display: block; margin-bottom: 4px; }

  input {
    width: 100%;
    padding: 7px 9px;
    background: #0d0703;
    border: 1px solid var(--trait);
    border-radius: 2px;
    color: var(--texte);
    font: inherit;
    font-size: 13px;
  }
  input:focus { outline: none; border-color: var(--laiton-bas); }

  button.valider {
    padding: 9px;
    background: linear-gradient(180deg, #6a4d1c, #4a3414);
    border: 1px solid var(--laiton-bas);
    border-radius: 2px;
    color: var(--laiton);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .12em;
    cursor: pointer;
  }
  button.valider:hover { background: linear-gradient(180deg, #7d5c22, #573d18); }
  button.valider { width: 100%; }

  .compte {
    flex: 1;
    min-width: 0;
    padding: 7px 9px;
    background: #0d0703;
    border: 1px solid var(--trait);
    border-radius: 2px;
    font-size: 13px;
    color: var(--discret);
  }
  .compte.lie { color: var(--vif); }

  .lien.discret { display: block; width: 100%; text-align: center; margin-top: 7px; }

  /* L'enregistrement était un lien discret, au point qu'on ne le voyait pas.
     C'est l'action qui valide toute la configuration : elle mérite d'être
     franche. */
  button.avec-icone {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    margin-top: 4px;
    transition: background .2s ease, border-color .2s ease, color .2s ease;
  }

  /* Trois états, pour qu'on sache d'un coup d'œil s'il reste quelque chose à
     faire : éteint quand rien n'a bougé, vif quand une modification attend
     d'être enregistrée, vert quand c'est fait. */
  #enregistrer {
    background: #16100a;
    border-color: var(--trait);
    color: var(--discret);
    cursor: default;
  }

  #enregistrer.modifie {
    background: linear-gradient(180deg, #7a4c12, #52320c);
    border-color: var(--attente);
    color: #ffe0a0;
    cursor: pointer;
  }
  #enregistrer.modifie:hover { background: linear-gradient(180deg, #8d5915, #613b0e); }

  #enregistrer.sauve {
    background: linear-gradient(180deg, #1d4a28, #12301a);
    border-color: var(--vif);
    color: var(--vif);
    cursor: default;
  }

  /* Quatre vignettes figurant l'écran, avec la fiche dans un coin : plus
     parlant qu'une liste déroulante « haut gauche / haut droite ». */
  .coins { display: flex; gap: 10px; justify-content: center; }

  .coins button {
    position: relative;
    width: 64px;
    height: 36px;
    padding: 0;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    cursor: pointer;
  }
  .coins button::after {
    content: '';
    position: absolute;
    width: 24px;
    height: 13px;
    border-radius: 1px;
    background: var(--discret);
  }
  .coins button[data-coin="hg"]::after { top: 4px;    left: 4px; }
  .coins button[data-coin="hd"]::after { top: 4px;    right: 4px; }

  /* Le choix retenu doit se voir d'un coup d'œil : un simple changement de
     teinte ne suffisait pas à distinguer « sélectionné » de « survolé ». */
  .coins button {
    opacity: .5;
    transition: opacity .15s, border-color .15s, box-shadow .15s;
  }
  .coins button:hover { opacity: .8; border-color: var(--laiton-bas); }

  .coins button.actif {
    opacity: 1;
    border-color: var(--laiton);
    border-width: 2px;
    background: #241706;
    box-shadow: 0 0 0 1px rgba(198, 160, 74, .35);
  }
  .coins button.actif::after { background: var(--laiton); }

  /* Une pastille cochée lève toute ambiguïté, même sans distinguer les teintes. */
  .coins button.actif::before {
    content: '✓';
    position: absolute;
    top: -7px;
    right: -7px;
    width: 15px;
    height: 15px;
    line-height: 15px;
    text-align: center;
    font-size: 10px;
    border-radius: 50%;
    background: var(--laiton);
    color: #1a1005;
  }

  .aide { font-size: 11px; color: var(--discret); margin-top: 6px; text-align: center; }

  .ligne-champ { display: flex; gap: 5px; }
  .ligne-champ input { flex: 1; min-width: 0; }

  .parcourir {
    flex: none;
    padding: 0 10px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--discret);
    font: inherit;
    font-size: 10px;
    letter-spacing: .08em;
    cursor: pointer;
    white-space: nowrap;
  }
  .parcourir:hover { color: var(--laiton); border-color: var(--laiton-bas); }
  .parcourir:disabled { opacity: .5; cursor: default; }

  /* ── Calibrage ───────────────────────────────────────────
     Occupe toute la fenêtre : encadrer une capture demande de
     la place, et l'opération est ponctuelle. */

  .calibrage {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 16px 20px 18px;
    background: var(--fond);
  }
  .calibrage.ouvert { display: flex; }

  .cal-titre {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 15px;
    letter-spacing: .08em;
    color: var(--laiton);
  }
  .cal-consigne { font-size: 12px; color: var(--discret); margin-top: 3px; min-height: 15px; }

  /* Twitch n'accepte que le 16/9 : on impose ce rapport en permanence. La
     scène rétrécit proportionnellement dans la place disponible au lieu de
     s'écraser, ce qui déformerait les repères et fausserait le calibrage.
     « flex: none » est indispensable : sans lui, le conteneur étire la scène
     en hauteur et le rapport est ignoré. */
  .cal-scene {
    position: relative;
    flex: none;
    aspect-ratio: 16 / 9;
    width: 100%;
    max-width: min(100%, calc((100vh - 230px) * 16 / 9));
    margin: auto;
    background: #0a0603 center/100% 100% no-repeat;
    border: 1px solid var(--trait);
    border-radius: 3px;
    overflow: hidden;
    outline: none;
    user-select: none;
  }

  /* Placée en haut : au centre, les rectangles de repère la recouvraient. */
  .cal-vide {
    position: absolute;
    inset: 0 0 auto 0;
    display: grid;
    justify-items: center;
    gap: 6px;
    text-align: center;
    font-size: 13px;
    color: var(--discret);
    padding: 22px 20px 0;
  }
  .cal-scene.remplie .cal-vide { display: none; }

  /* Sans cette règle, le bouton héritait de .lien — 12 px et un interlettrage
     large — ce qui tranchait avec la phrase juste au-dessus. */
  /* Recoller une autre image fonctionne, mais rien ne l'indique : une croix
     rend le retrait explicite. */
  .cal-retirer {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 3;
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    padding: 0;
    border: 1px solid var(--trait);
    border-radius: 50%;
    background: rgba(10, 7, 3, .8);
    color: var(--discret);
    cursor: pointer;
    backdrop-filter: blur(2px);
  }
  .cal-retirer:hover { color: var(--alerte); border-color: var(--alerte); }

  .cal-vide .lien {
    font-size: 13px;
    letter-spacing: normal;
    padding: 2px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  /* Rectangle déplaçable. Le fond reste transparent pour ne pas masquer
     l'image qu'on est en train de cadrer. */
  .cal-cadre {
    position: absolute;
    border: 2px solid var(--laiton);
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, .45);
    cursor: move;
  }

  .poignee {
    position: absolute;
    width: 14px;
    height: 14px;
    background: var(--laiton);
    border-radius: 2px;
  }
  .poignee.nw { left: -8px; top: -8px;    cursor: nwse-resize; }
  .poignee.ne { right: -8px; top: -8px;   cursor: nesw-resize; }
  .poignee.sw { left: -8px; bottom: -8px; cursor: nesw-resize; }
  .poignee.se { right: -8px; bottom: -8px; cursor: nwse-resize; }

  /* Zones calculées, superposées en direct : c'est ce qui rend le réglage
     évident, le streamer ajuste jusqu'à ce qu'elles tombent sur ses cartes. */
  .cal-zones { position: absolute; inset: 0; pointer-events: none; }
  .cal-zones div {
    position: absolute;
    /* La bordure doit être COMPRISE dans les dimensions calculées : en
       content-box elle ajoutait 2 px à chaque repère, ce qui se voit sur les
       petits carrés des talents. */
    box-sizing: border-box;
    padding: 0;
    border: 1px solid rgba(110, 224, 138, .9);
    background: rgba(110, 224, 138, .16);
    border-radius: 2px;
  }

  /* Repère de talent. Il portait la classe « talent », déjà utilisée par les
     pastilles de l'aperçu du plateau : leur remplissage de 3 px sur 8
     s'ajoutait aux dimensions et transformait le carré en rectangle. */
  .cal-zones div.zone-talent {
    border-color: rgba(240,192,96,.9);
    background: rgba(240,192,96,.16);
  }

  /* Repères fixes du jeu : ni verts ni ambrés, pour qu'on ne les confonde pas
     avec les zones de survol. Ils ne servent qu'à s'aligner. */
  .cal-zones div.repere { border: 0; background: none; }
  .cal-zones div.cercle {
    border: 1px solid rgba(255, 90, 120, .95);
    border-radius: 50%;
  }
  .cal-zones div.equerre { border: 0; }
  .cal-zones div.equerre.tr {
    border-top: 1px solid rgba(255, 90, 120, .95);
    border-right: 1px solid rgba(255, 90, 120, .95);
  }
  .cal-zones div.equerre.tl {
    border-top: 1px solid rgba(255, 90, 120, .95);
    border-left: 1px solid rgba(255, 90, 120, .95);
  }

  .cal-aide { font-size: 11px; color: var(--discret); text-align: center; min-height: 14px; }
  .cal-boutons { display: flex; align-items: center; gap: 8px; }

  .avis { font-size: 12px; margin-top: 8px; min-height: 15px; color: var(--attente); }
  .avis.bon { color: var(--vif); }

  /* Choix de langue. La détection automatique suffit à la plupart des gens,
     mais elle se trompe pour qui utilise un Windows dans une autre langue que
     la sienne. */
  /* Ancré dans le coin, hors du flux : il ne doit pas décaler le reste ni
     attirer l'œil, mais rester trouvable. */
  .langues {
    position: fixed;
    left: 10px;
    bottom: 10px;
    display: flex;
    gap: 4px;
  }

  .langues { align-items: center; }
  .langues .globe { color: var(--discret); opacity: .75; flex: none; }

  .langues select {
    padding: 5px 9px;
    border: 1px solid var(--trait);
    border-radius: 2px;
    background: #0d0703;
    color: var(--discret);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    opacity: .75;
  }
  .langues select:hover, .langues select:focus {
    opacity: 1;
    color: var(--laiton);
    border-color: var(--laiton-bas);
    outline: none;
  }
</style>

  var CLE_LANGUE = 'bazaar-scanner-langue-interface';

  function langueChoisie() {
    try {
      var v = window.localStorage.getItem(CLE_LANGUE);
      return TEXTES[v] ? v : null;
    } catch (e) { return null; }
  }

  var LANGUE = langueChoisie()
            || (navigator.language || 'en').slice(0, 2).toLowerCase();
  if (!TEXTES[LANGUE]) LANGUE = 'en';
  var T = TEXTES[LANGUE];

  document.documentElement.lang = LANGUE;

  var LIBELLES = {
    demarrage: T.demarrage, config: T.config, jeu: T.jeu,
    attente: T.attente, pret: T.pret, erreur: T.erreur,
  };

  // Libellés fixes de la page.
  document.getElementById('bascule-texte').textContent = T.configuration;
  document.getElementById('l-compte').textContent  = T.compteTwitch;
  document.getElementById('connecter').textContent = T.seConnecter;
  document.getElementById('l-jeu').textContent     = T.dossierJeu;
  document.getElementById('jeu').placeholder       = T.detecte;
  document.getElementById('parcourir').textContent   = T.parcourir;
  // Le texte initial est écrit en dur dans la page : sans ceci, un utilisateur
  // anglophone verrait « Démarrage… » jusqu'au premier message du serveur.
  document.getElementById('libelle').textContent     = T.demarrage;

  // Recharger est plus simple et plus sûr que de repeindre chaque libellé :
  // la page est locale, le rechargement est instantané, et l'état revient
  // aussitôt par le flux.
  // Nom natif de chaque langue : un anglophone perdu dans une interface
  // coréenne doit pouvoir retrouver la sienne sans deviner un code.
  var NOMS_LANGUE = {
    en: 'English', fr: 'Français', de: 'Deutsch',    es: 'Español',
    it: 'Italiano', pt: 'Português', ko: '한국어', zh: '中文',
  };

  // Ordre d'affichage : les deux langues d'origine en tête, le reste ensuite.
  /* Le russe, l'ukrainien et le japonais sont retirés : le jeu ne publie leurs
     traductions que sur sa branche de test, sous accord de confidentialité.
     Les proposer afficherait des cartes en anglais, et laisserait entendre
     l'existence de contenu non public. Leurs traductions d'interface sont
     conservées hors dépôt, prêtes à revenir le jour où le jeu les publiera. */
  var ORDRE = ['en', 'fr', 'de', 'es', 'it', 'pt', 'ko', 'zh'];

  (function construireLangues() {
    var boite = document.getElementById('langues');
    var dispo = ORDRE.filter(function (l) { return TEXTES[l]; });

    // Une liste déroulante dès qu'il y a trop de langues pour des boutons.
    // Une planète en fil de fer : repère universel pour qui s'est trompé de
    // langue et ne sait plus lire l'interface.
    boite.insertAdjacentHTML('beforeend',
      '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" '
      + 'stroke="currentColor" stroke-width="1.4" class="globe">'
      + '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/>'
      + '<path d="M3.2 9h17.6M3.2 15h17.6"/></svg>');

    var sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Langue');
    dispo.forEach(function (l) {
      var o = document.createElement('option');
      o.value = l;
      o.textContent = NOMS_LANGUE[l] || l.toUpperCase();
      if (l === LANGUE) o.selected = true;
      sel.appendChild(o);
    });
    sel.addEventListener('change', function () {
      if (sel.value === LANGUE) return;
      try { window.localStorage.setItem(CLE_LANGUE, sel.value); } catch (e) { /* tant pis */ }
      location.reload();
    });
    boite.appendChild(sel);
  })();

  var elPlateau = document.getElementById('plateau');
  var elVide    = document.getElementById('vide');

  var elEtat      = document.getElementById('etat');
  var elLibelle   = document.getElementById('libelle');
  var elPrecision = document.getElementById('precision');
  var elTalents   = document.getElementById('talents');

  function caseVide() {
    var d = document.createElement('div');
    d.className = 'case';
    return d;
  }

  // Reproduit le plateau : chaque objet occupe le nombre de cases de sa taille,
  // les emplacements libres restent vides. Le streamer vérifie ainsi d'un coup
  // d'œil que ce qui est diffusé correspond bien à sa partie.
  function dessinerPlateau(objets) {
    elPlateau.textContent = '';
    var occupe = 0;

    objets.forEach(function (o) {
      while (occupe < o.s) { elPlateau.appendChild(caseVide()); occupe++; }
      var d = document.createElement('div');
      d.className = 'objet t-' + (o.tier || '') + (o.ench ? ' enchante' : '');
      d.style.gridColumn = 'span ' + Math.max(1, Math.min(3, o.n || 1));
      d.textContent = o.nom;
      d.title = o.nom + (o.ench ? ' — ' + o.ench : '') + (o.tier ? ' (' + o.tier + ')' : '');
      elPlateau.appendChild(d);
      occupe += (o.n || 1);
    });

    while (occupe < 10) { elPlateau.appendChild(caseVide()); occupe++; }
  }

  function dessinerTalents(talents) {
    elTalents.textContent = '';
    talents.forEach(function (t) {
      var d = document.createElement('div');
      d.className = 'talent t-' + (t.tier || '');
      d.textContent = t.nom;
      d.title = t.nom + (t.tier ? ' (' + t.tier + ')' : '');
      elTalents.appendChild(d);
    });
  }

  function peindre(e) {
    elEtat.dataset.code = e.code;
    elLibelle.textContent = LIBELLES[e.code] || e.code;
    elPrecision.textContent = e.detail || '';

    var enPartie = e.code === 'pret';
    dessinerPlateau(enPartie ? (e.plateau || []) : []);
    dessinerTalents(enPartie ? (e.listeTalents || []) : []);
    elVide.textContent = enPartie ? '' : T.attentePartie;
  }

     fenêtre reprend alors la taille de la précédente. On rattrape une seule
     fois par session — sinon un changement de langue, qui recharge la page,
     annulerait le redimensionnement fait à la main par l'utilisateur. */
  try {
    if (!window.sessionStorage.getItem('bazaar-taille-ajustee')) {
      window.sessionStorage.setItem('bazaar-taille-ajustee', '1');
      if (window.outerHeight > 1000 || window.outerWidth < 900) window.resizeTo(1170, 770);

  // dans la même langue que l'interface.
  fetch('/langue?l=' + encodeURIComponent(LANGUE)).catch(function () {});

  flux.onmessage = function (ev) {
    try { peindre(JSON.parse(ev.data)); } catch (err) { /* trame partielle */ }

  var CLE_REGLAGES = 'bazaar-reglages-ouverts';

    try { window.sessionStorage.setItem(CLE_REGLAGES, ouvert ? '1' : ''); }

    if (window.sessionStorage.getItem(CLE_REGLAGES)) {

  // Une seule fonction décide de l'état, pour que la flèche ne puisse pas
  // désigner le contraire de ce que fait le panneau.
  function afficherReglages(ouvert) {
    reglages.classList.toggle('ouvert', ouvert);
    elBascule.classList.toggle('ouvert', ouvert);
    memoriserReglages(ouvert);

  function relireConfig() {
    return fetch('/config').then(function (r) { return r.json(); }).then(function (c) {

      var lie = !!c.RELAY_TOKEN;
      // Le nom de chaîne, jamais l'identifiant numérique : il ne dit rien à
      // personne. Faute de nom — configuration antérieure à sa mémorisation,
      // ou réponse incomplète de Twitch — on se contente de « connecté ».
      elCompte.textContent = lie
        ? (c.TWITCH_NOM || T.connecteSansNom)
        : T.nonConnecte;

      // Le cadre courant n'est pas affiché — « calibré » n'apprend rien — mais
      // il est conservé pour rouvrir l'outil sur le réglage existant.
      // La vignette du coin choisi est mise en évidence.
      [].forEach.call(document.querySelectorAll('#coins button'), function (b) {
        b.classList.toggle('actif', b.dataset.coin === (c.COIN || 'hg'));
      });

      document.getElementById('etat-cadre').dataset.cadre = c.CADRE || '';
      elCompte.classList.toggle('lie', lie);
      // Premier lancement : la configuration s'ouvre d'elle-même.
      if (!lie) afficherReglages(true);
      return c;
    });

    elAvis.className = 'avis';
    elAvis.textContent = '';

      elAvis.className = 'avis' + (rep.ok ? ' bon' : '');

      surveillerJeton(b);

  });

    // Le jeton arrive par le navigateur : on surveille jusqu'à le voir.
    var essais = 0;
    var minuteur = setInterval(function () {
      relireConfig().then(function (c) {

          elAvis.textContent = T.connecte;

          b.textContent = T.seConnecter;
          elAvis.textContent = T.sansReponse;
          elAvis.className = 'avis';
        }
      });
    }, 1000);
  }

     l'intérieur du jeu, donc l'un donne l'autre. C'est ce cadre qui est
     enregistré et diffusé, l'extension restant inchangée. */

  var calPlateau = null;                              // en % de la scène
  var calImage   = null;

  // Position du plateau quand le jeu occupe tout le cadre. Sur une capture qui
  // n'est pas en 16/9, le jeu est encadré de bandes : les valeurs nominales
  // restent le meilleur point de départ, le streamer ajuste ensuite.
  function plateauParDefaut() {
    var B = GEOMETRIE.BOARD;
    return { l: B.left, t: B.top, w: B.width, h: B.height };
  }

  // Plateau (scène) → cadre du jeu (scène).
  function cadreCalcule() {
    var B = GEOMETRIE.BOARD;
    var p = calPlateau || plateauParDefaut();
    var w = p.w * 100 / B.width;
    var h = p.h * 100 / B.height;
    return { l: p.l - B.left * w / 100, t: p.t - B.top * h / 100, w: w, h: h };
  }

  // Cadre du jeu → plateau, pour rouvrir sur un calibrage existant.
  function plateauDepuisCadre(c) {
    var B = GEOMETRIE.BOARD;
    return {
      l: c.l + B.left  * c.w / 100,
      t: c.t + B.top   * c.h / 100,
      w: B.width  * c.w / 100,
      h: B.height * c.h / 100,
    };
  }

  var elCal      = document.getElementById('calibrage');
  var elScene    = document.getElementById('cal-scene');
  var elRect     = document.getElementById('cal-cadre');
  var elZones    = document.getElementById('cal-zones');
  var elConsigne = document.getElementById('cal-consigne');

  document.getElementById('cal-titre').textContent    = T.calTitre;
  document.getElementById('cal-colle').textContent    = T.calColler;
  document.getElementById('cal-fichier').textContent  = T.calChoisir;
  document.getElementById('cal-plein').textContent    = T.calPlein;
  document.getElementById('cal-annuler').textContent  = T.calAnnuler;
  document.getElementById('cal-valider').textContent  = T.calValider;
  document.getElementById('cal-aide').textContent     = T.calAide;
  document.getElementById('cal-retirer').title        = T.calRetirer;
  document.getElementById('l-cadrage').textContent    = T.cadrage;
  document.getElementById('l-coin').textContent       = T.coinTitre;
  document.getElementById('coin-aide').textContent    = T.coinAide;
  document.getElementById('calibrer').textContent     = T.calibrer;

  function pct(v) { return v + '%'; }

  function dessinerCadre() {
    var p = calPlateau || plateauParDefaut();
    elRect.style.left   = pct(p.l);
    elRect.style.top    = pct(p.t);
    elRect.style.width  = pct(p.w);
    elRect.style.height = pct(p.h);
    dessinerZones();
  }

  // Projette une coordonnée exprimée en % du jeu vers un % de la scène.
  function projX(x) { var c = cadreCalcule(); return c.l + x * c.w / 100; }
  function projY(y) { var c = cadreCalcule(); return c.t + y * c.h / 100; }
  function projL(w) { return w * cadreCalcule().w / 100; }
  function projH(h) { return h * cadreCalcule().h / 100; }

  function dessinerZones() {
    elZones.textContent = '';
    var B = GEOMETRIE.BOARD;
    var pas = B.width / B.slots;

    // Les dix divisions à l'intérieur du rectangle : elles montrent où
    // tombent les séparations entre cases, ce qui permet un alignement fin.
    for (var i = 0; i < B.slots; i++) {
      var d = document.createElement('div');
      d.style.left   = pct(projX(B.left + i * pas));
      d.style.top    = pct(projY(B.top));
      d.style.width  = pct(projL(pas));
      d.style.height = pct(projH(B.height));
      elZones.appendChild(d);
    }

    // Repères fixes : ils ne dépendent pas de ce que possède le joueur, donc
    // ils restent alignables même sur un plateau presque vide.
    (GEOMETRIE.REPERES.cercles || []).forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'repere cercle';
      d.style.left   = pct(projX(c.x));
      d.style.top    = pct(projY(c.y));
      d.style.width  = pct(projL(c.w));
      d.style.height = pct(projH(c.h));
      elZones.appendChild(d);
    });

    (GEOMETRIE.REPERES.equerres || []).forEach(function (e) {
      var d = document.createElement('div');
      d.className = 'repere equerre ' + e.coin;
      d.style.left   = pct(projX(e.x));
      d.style.top    = pct(projY(e.y));
      d.style.width  = pct(projL(e.w));
      d.style.height = pct(projH(e.h));
      elZones.appendChild(d);
    });

    // La première disposition de talents, la plus courante, suffit à vérifier
    // que le bas de l'écran est bien cadré.
    var L = GEOMETRIE.SKILL_LAYOUTS[0];
    L.slots.forEach(function (p) {
      var d = document.createElement('div');
      d.className = 'zone-talent';
      d.style.left   = pct(projX(p[0] - L.w / 2));
      d.style.top    = pct(projY(p[1] - L.h / 2));
      d.style.width  = pct(projL(L.w));
      d.style.height = pct(projH(L.h));
      elZones.appendChild(d);
    });
  }

  function afficherImage(source) {
    calImage = source;
    elScene.style.backgroundImage = 'url(' + source + ')';

    dessinerCadre();

    /* La scène reste en 16/9 quoi qu'il arrive. Si la capture ne l'est pas,
       « contain » la centrerait en laissant des bandes et les pourcentages ne
       désigneraient plus les mêmes points : on prévient plutôt que de calibrer
       faux en silence. */
    var sonde = new Image();
    sonde.onload = function () {
      var r = sonde.naturalWidth / sonde.naturalHeight;
      if (isFinite(r) && Math.abs(r - 16 / 9) > 0.02) {
        elConsigne.textContent = T.calPas169;
      }
    };
    sonde.src = source;
    elScene.classList.add('remplie');
    elRetirer.hidden = false;
    elConsigne.textContent = T.calEncadrer;
    dessinerCadre();
  }

  var elRetirer = document.getElementById('cal-retirer');

  function retirerImage() {
    calImage = null;
    elScene.style.backgroundImage = '';
    elScene.classList.remove('remplie');
    elRetirer.hidden = true;
    // Le rectangle reste : il montre toujours ce qu'on attend.
    dessinerCadre();
  }

  elRetirer.addEventListener('click', function (ev) {
    ev.stopPropagation();
    retirerImage();
  });

  function lireFichier(f) {
    if (!f || !/^image\//.test(f.type)) return;
    var lecteur = new FileReader();
    lecteur.onload = function () { afficherImage(lecteur.result); };
    lecteur.readAsDataURL(f);
  }

  // Collage : la voie normale, un simple Ctrl+V après une capture d'écran.
  elScene.addEventListener('paste', function (ev) {
    var items = (ev.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') === 0) { lireFichier(items[i].getAsFile()); break; }
    }
  });
  document.addEventListener('paste', function (ev) {
    if (elCal.classList.contains('ouvert')) elScene.dispatchEvent(
      new ClipboardEvent('paste', { clipboardData: ev.clipboardData }));
  });

  document.getElementById('cal-fichier').addEventListener('click', function () {
    document.getElementById('cal-input').click();
  });
  document.getElementById('cal-input').addEventListener('change', function () {
    lireFichier(this.files[0]);
  });

  /* --- déplacement et redimensionnement -------------------------------- */

  var saisie = null;

  function positionRelative(ev) {
    var r = elScene.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(100, (ev.clientX - r.left) / r.width * 100)),
      y: Math.max(0, Math.min(100, (ev.clientY - r.top) / r.height * 100)),
    };
  }

  elRect.addEventListener('mousedown', function (ev) {
    var coin = ev.target.classList.contains('poignee')
      ? ev.target.className.replace('poignee', '').trim() : null;
    var p = positionRelative(ev);
    saisie = { coin: coin, depart: p,
               cadre: Object.assign({}, calPlateau || plateauParDefaut()) };
    ev.preventDefault();
    ev.stopPropagation();
  });

  document.addEventListener('mousemove', function (ev) {
    if (!saisie) return;
    var p = positionRelative(ev);
    var dx = p.x - saisie.depart.x, dy = p.y - saisie.depart.y;
    var c = saisie.cadre;
    var MIN = 5;

    if (!calPlateau) calPlateau = plateauParDefaut();

    if (!saisie.coin) {
      // Déplacement : le rectangle reste entièrement dans la scène.
      calPlateau.l = Math.max(0, Math.min(100 - c.w, c.l + dx));
      calPlateau.t = Math.max(0, Math.min(100 - c.h, c.t + dy));
    } else {
      /* Les proportions sont IMPOSÉES. Le plateau a une forme fixe dans le
         jeu ; l'écraser produirait un cadre déformé, et donc des zones de
         survol fausses en hauteur ou en largeur. On ne suit donc que le
         déplacement horizontal de la poignée, et la hauteur en découle.
         Le coin opposé reste immobile, comme on l'attend d'une poignée. */
      /* Le rapport doit être calculé en PIXELS, pas en pourcentages : sur une
         capture qui n'est pas en 16/9, un même pourcentage de largeur et de
         hauteur ne représente pas la même distance à l'écran, et la contrainte
         déformerait le rectangle. */
      var r = elScene.getBoundingClientRect();
      var aspectScene = (r.width && r.height) ? r.width / r.height : 16 / 9;
      var RAPPORT = (GEOMETRIE.BOARD.width / GEOMETRIE.BOARD.height) * (16 / 9) / aspectScene;
      var versLaDroite = saisie.coin.indexOf('e') >= 0;

      var la = versLaDroite ? c.w + dx : c.w - dx;
      if (la < MIN) la = MIN;
      var ha = la / RAPPORT;

      // Ancrage : le coin diagonalement opposé ne bouge pas.
      var g = versLaDroite ? c.l : c.l + c.w - la;
      var hh = (saisie.coin.indexOf('s') >= 0) ? c.t : c.t + c.h - ha;

      if (g >= 0 && g + la <= 100 && hh >= 0 && hh + ha <= 100) {
        calPlateau.l = g; calPlateau.t = hh;
        calPlateau.w = la; calPlateau.h = ha;
      }
    }
    dessinerCadre();
  });

  document.addEventListener('mouseup', function () { saisie = null; });

  /* --- déplacement au clavier -------------------------------------------
     Les flèches déplacent le rectangle d'un pixel de la capture, ce qui donne
     le réglage fin que la souris ne permet pas. Maintenir accélère : sans ça,
     traverser l'image demanderait un millier d'appuis.
     ------------------------------------------------------------------- */

  var FLECHES = { ArrowLeft: [-1, 0], ArrowRight: [1, 0],
                  ArrowUp: [0, -1], ArrowDown: [0, 1] };

  var repetitions = 0;

  document.addEventListener('keydown', function (ev) {
    if (!elCal.classList.contains('ouvert')) return;
    var d = FLECHES[ev.key];
    if (!d) return;
    ev.preventDefault();

    // Un « pixel » se mesure sur la capture affichée, pas sur l'écran : le pas
    // reste ainsi le même quelle que soit la taille de la fenêtre.
    var r = elScene.getBoundingClientRect();
    var pasX = r.width  ? 100 / r.width  : 0.05;
    var pasY = r.height ? 100 / r.height : 0.09;

    // Accélération progressive tant que la touche reste enfoncée.
    repetitions = ev.repeat ? repetitions + 1 : 0;
    var facteur = Math.min(1 + Math.pow(repetitions, 1.6) / 12, 40);

    if (!calPlateau) calPlateau = plateauParDefaut();
    var p = calPlateau;

    // Le rectangle ne sort pas de la capture.
    p.l = Math.max(0, Math.min(100 - p.w, p.l + d[0] * pasX * facteur));
    p.t = Math.max(0, Math.min(100 - p.h, p.t + d[1] * pasY * facteur));
    dessinerCadre();
  });

  document.addEventListener('keyup', function () { repetitions = 0; });

  /* --- ouverture, fermeture, enregistrement ---------------------------- */

  function ouvrirCalibrage(cadreActuel) {
    calPlateau = cadreActuel ? plateauDepuisCadre(cadreActuel) : plateauParDefaut();
    elCal.classList.add('ouvert');
    /* La consigne de cadrage est affichée DÈS L'OUVERTURE : elle explique ce
       qu'on attend du streamer, ce qui donne un sens au collage demandé juste
       en dessous. Le cadre noir garde sa propre invitation à coller — les deux
       textes sont distincts, il n'y a plus de répétition. */
    elConsigne.textContent = T.calEncadrer;
    elRetirer.hidden = !calImage;
    // Le rectangle est montré dès l'ouverture, même sans capture : le streamer
    // voit tout de suite ce qu'on attend de lui, et à quoi ressemble un
    // cadrage plein écran.
    dessinerCadre();
    elScene.focus();
  }

  function fermerCalibrage() { elCal.classList.remove('ouvert'); }

  document.getElementById('cal-plein').addEventListener('click', function () {
    calPlateau = plateauParDefaut();      // jeu occupant tout le cadre
    dessinerCadre();
  });
  document.getElementById('cal-annuler').addEventListener('click', fermerCalibrage);

  document.getElementById('cal-valider').addEventListener('click', function () {
    var c = cadreCalcule();
    var v = [c.l, c.t, c.w, c.h]
      .map(function (x) { return Math.round(x * 100) / 100; });
    var plein = v[0] === 0 && v[1] === 0 && v[2] === 100 && v[3] === 100;
    fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ CADRE: plein ? '' : v.join(',') })
    }).then(relireConfig).then(fermerCalibrage);
  });

  [].forEach.call(document.querySelectorAll('#coins button'), function (b) {
    b.addEventListener('click', function () {
      fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ COIN: b.dataset.coin })
      }).then(relireConfig);
    });
  });

  document.getElementById('calibrer').addEventListener('click', function () {
    var c = (document.getElementById('etat-cadre').dataset.cadre || '')
      .split(',').map(parseFloat);
    ouvrirCalibrage(c.length === 4 && isFinite(c[0])
      ? { l: c[0], t: c[1], w: c[2], h: c[3] } : null);
  });

  document.getElementById('parcourir').addEventListener('click', function () {
    var b = this;
    b.disabled = true;
    elAvis.className = 'avis';
    elAvis.textContent = '';

    // La requête ne répond qu'une fois la fenêtre Windows refermée.
    fetch('/parcourir').then(function (r) { return r.json(); }).then(function (rep) {
      b.disabled = false;
      if (!rep.chemin) return;                 // annulé
      document.getElementById('jeu').value = rep.chemin;
      elAvis.textContent = rep.valide ? T.dossierOk : T.dossierNon;
      elAvis.className = 'avis' + (rep.valide ? ' bon' : '');
      // Le dossier choisi par la boîte de dialogue est enregistré aussitôt :
      // il vient d'être vérifié, il n'y a rien à confirmer.
      if (rep.valide) enregistrerDossier();
    }).catch(function () { b.disabled = false; });
  });

  function enregistrerDossier() {
    return fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ BAZAAR_PATH: document.getElementById('jeu').value })
    }).then(relireConfig);
  }

  /* Le dossier s'enregistre en quittant le champ. Un bouton dédié n'avait plus
     de sens : c'était le seul réglage à ne pas se sauvegarder tout seul, et
     l'oublier laissait une configuration à moitié appliquée. */
  document.getElementById('jeu').addEventListener('change', function () {
    var champ = this.value.trim();
    if (champ === dossierEnregistre) return;
    enregistrerDossier().then(function () {
      elAvis.textContent = T.enregistre;
      elAvis.className = 'avis bon';
      setTimeout(function () {
        if (elAvis.textContent === T.enregistre) elAvis.textContent = '';
      }, 1600);
    });
  });
})();
</script>

</body>
</html>
