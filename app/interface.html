        {"x":12.656,"y":52.292,"w":0.859,"h":1.528},
        {"x":14.844,"y":54.514,"w":0.859,"h":1.528},
        {"x":14.922,"y":50.208,"w":0.664,"h":1.181},
      ],
      equerres: [
        {"x":20.547,"y":72.778,"w":10.703,"h":19.653,"coin":"tr"},
        {"x":68.789,"y":72.708,"w":10.703,"h":19.653,"coin":"tl"},
      ],
    },
    /* GÉOMÉTRIE >>> */
  };

  var calPlateau = null;                              // en % de la scène
  var calImage   = null;

  function plateauParDefaut() {
    var B = GEOMETRIE.BOARD;
    return { l: B.left, t: B.top, w: B.width, h: B.height };
  }

  function cadreCalcule() {
    var B = GEOMETRIE.BOARD;
    var p = calPlateau || plateauParDefaut();
    var w = p.w * 100 / B.width;
    var h = p.h * 100 / B.height;
    return { l: p.l - B.left * w / 100, t: p.t - B.top * h / 100, w: w, h: h };
  }

  function plateauDepuisCadre(c) {
    var B = GEOMETRIE.BOARD;
    return {
      l: c.l + B.left  * c.w / 100,
      t: c.t + B.top   * c.h / 100,
      w: B.width  * c.w / 100,
      h: B.height * c.h / 100,
    };
  }

  var elCal      = document.getElementById('calibrage');
  var elScene    = document.getElementById('cal-scene');
  var elRect     = document.getElementById('cal-cadre');
  var elZones    = document.getElementById('cal-zones');
  var elConsigne = document.getElementById('cal-consigne');

  document.getElementById('cal-titre').textContent    = T.calTitre;
  /* « (Ctrl+V) » en fin de phrase devient deux touches de clavier. */
  (function () {
    var el = document.getElementById('cal-colle');
    var texte = String(T.calColler || '');
    var m = /\s*[(\uff08]\s*(Ctrl|Strg)\+V\s*[)\uff09]\s*$/.exec(texte);
    el.textContent = m ? texte.slice(0, m.index) + ' ' : texte;
    if (!m) return;
    var k1 = document.createElement('kbd'); k1.textContent = m[1];
    var k2 = document.createElement('kbd'); k2.textContent = 'V';
    el.appendChild(k1); el.appendChild(document.createTextNode(' + ')); el.appendChild(k2);
  })();
  document.getElementById('cal-fichier').textContent  = T.calChoisir;
  document.getElementById('cal-plein-txt').textContent = T.calPlein;
  document.getElementById('cal-annuler').textContent  = T.calAnnuler;
  document.getElementById('cal-valider').textContent  = T.calValider;
  /* Le passage entre crochets, « [aperçu OBS] », est mis en valeur. */
  (function () {
    var el = document.getElementById('cal-aide');
    el.textContent = '';
    String(T.calAide || '').split(/(\[[^\]]*\])/).forEach(function (morceau) {
      if (/^\[.*\]$/.test(morceau)) {
        var b = document.createElement('b');
        b.textContent = morceau.slice(1, -1);
        el.appendChild(b);
      } else if (morceau) {
        el.appendChild(document.createTextNode(morceau));
      }
    });
  })();
  document.getElementById('cal-retirer').title        = T.calRetirer;
  document.getElementById('l-cadrage').textContent    = T.cadrage;
  document.getElementById('titre-plateau').textContent = T.titrePlateau;
  document.getElementById('titre-reserve').textContent = T.titreReserve;
  document.getElementById('titre-talents').textContent = T.titreTalents;
  document.getElementById('titre-face-talents').textContent = T.titreTalentsAdverses;
  document.getElementById('l-delai').textContent     = T.delaiTitre;
  [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
    var v = b.dataset.delai;
    /* Les valeurs de tournoi s'expriment en minutes : « 1800 s » ne parle à
       personne, « 30 minutes » si. */
    b.textContent = (v === 'libre') ? T.delaiLibre
      : (v === '0') ? T.delaiAucun
      : (v === '60') ? T.delaiMinute
      : T.delaiMinutes.replace('{}', String(Number(v) / 60));
    if (v === '0' && T.delaiReco) {
      var reco = document.createElement('span');
      reco.className = 'reco';
      reco.textContent = T.delaiReco;
      b.appendChild(reco);
    }
  });
  document.getElementById('delai-unite').textContent = T.delaiSecondes || 's';
  /* Les explications, sous le titre de chaque page de réglage et avant ses
     boutons : une phrase par ligne. */
  function poserAide(id, texte) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = '';
    (Array.isArray(texte) ? texte : [texte]).forEach(function (t) {
      if (!t) return;
      var l = document.createElement('div');
      l.textContent = t;
      el.appendChild(l);
    });
  }
  poserAide('delai-aide', T.delaiAide);
  poserAide('compte-aide', T.compteAide || TEXTES.en.compteAide);
  poserAide('jeu-aide', T.jeuAide || TEXTES.en.jeuAide);
  document.getElementById('calibrer').textContent     = T.calibrer;

  function pct(v) { return v + '%'; }

  function dessinerCadre() {
    var p = calPlateau || plateauParDefaut();
    elRect.style.left   = pct(p.l);
    elRect.style.top    = pct(p.t);
    elRect.style.width  = pct(p.w);
    elRect.style.height = pct(p.h);
    dessinerZones();
  }

  function projX(x) { var c = cadreCalcule(); return c.l + x * c.w / 100; }
  function projY(y) { var c = cadreCalcule(); return c.t + y * c.h / 100; }
  function projL(w) { return w * cadreCalcule().w / 100; }
  function projH(h) { return h * cadreCalcule().h / 100; }

  function dessinerZones() {
    elZones.textContent = '';
    var B = GEOMETRIE.BOARD;
    var pas = B.width / B.slots;

    for (var i = 0; i < B.slots; i++) {
      var d = document.createElement('div');
      d.style.left   = pct(projX(B.left + i * pas));
      d.style.top    = pct(projY(B.top));
      d.style.width  = pct(projL(pas));
      d.style.height = pct(projH(B.height));
      elZones.appendChild(d);
    }

    (GEOMETRIE.REPERES.cercles || []).forEach(function (c) {
      var d = document.createElement('div');
      d.className = 'repere cercle';
      d.style.left   = pct(projX(c.x));
      d.style.top    = pct(projY(c.y));
      d.style.width  = pct(projL(c.w));
      d.style.height = pct(projH(c.h));
      elZones.appendChild(d);
    });

    (GEOMETRIE.REPERES.equerres || []).forEach(function (e) {
      var d = document.createElement('div');
      d.className = 'repere equerre ' + e.coin;
      d.style.left   = pct(projX(e.x));
      d.style.top    = pct(projY(e.y));
      d.style.width  = pct(projL(e.w));
      d.style.height = pct(projH(e.h));
      elZones.appendChild(d);
    });

    var L = GEOMETRIE.SKILL_LAYOUTS[0];
    L.slots.forEach(function (p) {
      var d = document.createElement('div');
      d.className = 'zone-talent';
      d.style.left   = pct(projX(p[0] - L.w / 2));
      d.style.top    = pct(projY(p[1] - L.h / 2));
      d.style.width  = pct(projL(L.w));
      d.style.height = pct(projH(L.h));
      elZones.appendChild(d);
    });
  }

  function afficherImage(source) {
    calImage = source;
    elScene.style.backgroundImage = 'url(' + source + ')';

    dessinerCadre();

    var sonde = new Image();
    sonde.onload = function () {
      var r = sonde.naturalWidth / sonde.naturalHeight;
      if (isFinite(r) && Math.abs(r - 16 / 9) > 0.02) {
        elConsigne.textContent = T.calPas169;
      }
    };
    sonde.src = source;
    elScene.classList.add('remplie');
    elRetirer.hidden = false;
    elConsigne.textContent = T.calEncadrer;
    dessinerCadre();
  }

  var elRetirer = document.getElementById('cal-retirer');

  function retirerImage() {
    calImage = null;
    elScene.style.backgroundImage = '';
    elScene.classList.remove('remplie');
    elRetirer.hidden = true;
    dessinerCadre();
  }

  elRetirer.addEventListener('click', function (ev) {
    ev.stopPropagation();
    retirerImage();
  });

  function lireFichier(f) {
    if (!f || !/^image\//.test(f.type)) return;
    var lecteur = new FileReader();
    lecteur.onload = function () { afficherImage(lecteur.result); };
    lecteur.readAsDataURL(f);
  }

  elScene.addEventListener('paste', function (ev) {
    var items = (ev.clipboardData || {}).items || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') === 0) { lireFichier(items[i].getAsFile()); break; }
    }
  });
  document.addEventListener('paste', function (ev) {
    if (elCal.classList.contains('ouvert')) elScene.dispatchEvent(
      new ClipboardEvent('paste', { clipboardData: ev.clipboardData }));
  });

  document.getElementById('cal-fichier').addEventListener('click', function () {
    document.getElementById('cal-input').click();
  });
  document.getElementById('cal-input').addEventListener('change', function () {
    lireFichier(this.files[0]);
  });

  var saisie = null;

  function positionRelative(ev) {
    var r = elScene.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(100, (ev.clientX - r.left) / r.width * 100)),
      y: Math.max(0, Math.min(100, (ev.clientY - r.top) / r.height * 100)),
    };
  }

  elRect.addEventListener('mousedown', function (ev) {
    var coin = ev.target.classList.contains('poignee')
      ? ev.target.className.replace('poignee', '').trim() : null;
    var p = positionRelative(ev);
    saisie = { coin: coin, depart: p,
               cadre: Object.assign({}, calPlateau || plateauParDefaut()) };
    elScene.classList.add('saisie');
    ev.preventDefault();
    ev.stopPropagation();
  });

  document.addEventListener('mousemove', function (ev) {
    if (!saisie) return;
    var p = positionRelative(ev);
    var dx = p.x - saisie.depart.x, dy = p.y - saisie.depart.y;
    var c = saisie.cadre;
    var MIN = 5;

    if (!calPlateau) calPlateau = plateauParDefaut();

    if (!saisie.coin) {
      calPlateau.l = Math.max(0, Math.min(100 - c.w, c.l + dx));
      calPlateau.t = Math.max(0, Math.min(100 - c.h, c.t + dy));
    } else {
      var r = elScene.getBoundingClientRect();
      var aspectScene = (r.width && r.height) ? r.width / r.height : 16 / 9;
      var RAPPORT = (GEOMETRIE.BOARD.width / GEOMETRIE.BOARD.height) * (16 / 9) / aspectScene;
      var versLaDroite = saisie.coin.indexOf('e') >= 0;

      var la = versLaDroite ? c.w + dx : c.w - dx;
      if (la < MIN) la = MIN;
      var ha = la / RAPPORT;

      var g = versLaDroite ? c.l : c.l + c.w - la;
      var hh = (saisie.coin.indexOf('s') >= 0) ? c.t : c.t + c.h - ha;

      if (g >= 0 && g + la <= 100 && hh >= 0 && hh + ha <= 100) {
        calPlateau.l = g; calPlateau.t = hh;
        calPlateau.w = la; calPlateau.h = ha;
      }
    }
    dessinerCadre();
  });

  document.addEventListener('mouseup', function () { saisie = null; elScene.classList.remove('saisie'); });

  var FLECHES = { ArrowLeft: [-1, 0], ArrowRight: [1, 0],
                  ArrowUp: [0, -1], ArrowDown: [0, 1] };

  var repetitions = 0;

  document.addEventListener('keydown', function (ev) {
    if (!elCal.classList.contains('ouvert')) return;
    var d = FLECHES[ev.key];
    if (!d) return;
    ev.preventDefault();

    var r = elScene.getBoundingClientRect();
    var pasX = r.width  ? 100 / r.width  : 0.05;
    var pasY = r.height ? 100 / r.height : 0.09;

    repetitions = ev.repeat ? repetitions + 1 : 0;
    var facteur = Math.min(1 + Math.pow(repetitions, 1.6) / 12, 40);

    if (!calPlateau) calPlateau = plateauParDefaut();
    var p = calPlateau;

    p.l = Math.max(0, Math.min(100 - p.w, p.l + d[0] * pasX * facteur));
    p.t = Math.max(0, Math.min(100 - p.h, p.t + d[1] * pasY * facteur));
    dessinerCadre();
  });

  document.addEventListener('keyup', function () { repetitions = 0; });

  function ouvrirCalibrage(cadreActuel) {
    calPlateau = cadreActuel ? plateauDepuisCadre(cadreActuel) : plateauParDefaut();
    elCal.classList.add('ouvert');
    elConsigne.textContent = T.calEncadrer;
    elRetirer.hidden = !calImage;
    dessinerCadre();
    elScene.focus();
  }

  /* « Annuler » revient au cadrage enregistré ; « Valider » l'enregistre.
     Dans les deux cas, on reste sur l'onglet Cadrage. */
  function fermerCalibrage() {
    elCal.classList.remove('ouvert');
    majCalibrageIntegre();
  }

  document.getElementById('cal-plein').addEventListener('click', function () {
    calPlateau = plateauParDefaut();      // jeu occupant tout le cadre
    dessinerCadre();
  });
  document.getElementById('cal-annuler').addEventListener('click', fermerCalibrage);

  document.getElementById('cal-valider').addEventListener('click', function () {
    var c = cadreCalcule();
    var v = [c.l, c.t, c.w, c.h]
      .map(function (x) { return Math.round(x * 100) / 100; });
    var plein = v[0] === 0 && v[1] === 0 && v[2] === 100 && v[3] === 100;
    fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ CADRE: plein ? '' : v.join(',') })
    }).then(relireConfig).then(function () {
      fermerCalibrage();
      /* Un mot sur le bouton, le temps de le lire. */
      var b = document.getElementById('cal-valider');
      var avant = b.textContent;
      b.textContent = T.enregistre;
      b.disabled = true;
      setTimeout(function () { b.textContent = avant; b.disabled = false; }, 1400);
    });
  });

  (function () {
    var n = document.getElementById('n-delai');
    if (!n) return;
    var libreOuvert = false;    // « Personnalisé » choisi, valeur pas encore saisie

    function borner(v) {
      var x = parseInt(v, 10);
      if (!isFinite(x) || x < 0) x = 0;
      return Math.min(x, 86400);   // une journée, garde-fou
    }

    function poser(v, envoyer) {
      var d = borner(v);
      n.value = d;

      /* Le bouton retenu est celui dont la valeur correspond ; à défaut,
         c'est « Autre », qui renvoie à la saisie libre. */
      var connu = false;
      [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
        var pris = (b.dataset.delai === String(d));
        if (pris) connu = true;
        b.classList.toggle('actif', pris);
      });
      var libre = document.getElementById('b-libre');
      if (libre) libre.classList.toggle('actif', !connu);
      var ligneLibre = document.getElementById('ligne-libre');
      if (ligneLibre) ligneLibre.classList.toggle('ouverte', !connu || libreOuvert);
      if (!envoyer) return;
      fetch('/config', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ DELAI_STREAM: String(d) })
      }).then(relireConfig);
    }

    [].forEach.call(document.querySelectorAll('#delai button'), function (b) {
      b.addEventListener('click', function () {
        if (b.dataset.delai === 'libre') {
          /* Le champ s'ouvre ; la valeur n'est envoyée qu'une fois saisie. */
          libreOuvert = true;
          document.getElementById('ligne-libre').classList.add('ouverte');
          [].forEach.call(document.querySelectorAll('#delai button'), function (x) { x.classList.toggle('actif', x === b); });
          n.focus(); n.select();
        } else { libreOuvert = false; poser(b.dataset.delai, true); }
      });
    });

    n.addEventListener('change', function () { poser(n.value, true); });
  })();

  document.getElementById('calibrer').addEventListener('click', function () {
    var c = (document.getElementById('etat-cadre').dataset.cadre || '')
      .split(',').map(parseFloat);
    ouvrirCalibrage(c.length === 4 && isFinite(c[0])
      ? { l: c[0], t: c[1], w: c[2], h: c[3] } : null);
  });
  majCalibrageIntegre();



  function enregistrerDossier() {
    var chemin = document.getElementById('jeu').value;

    /* Le dossier appartient à la version en cours : l'enregistrer aussi dans
       sa propre clé, sinon la bascule le perdrait. */
    var maj = { BAZAAR_PATH: chemin };
    maj[(source === 'tempo') ? 'TEMPO_PATH' : 'STEAM_PATH'] = chemin;

    return fetch('/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(maj)
    }).then(relireConfig);
  }

  document.getElementById('jeu').addEventListener('change', function () {
    var champ = this.value.trim();
    if (champ === dossierEnregistre) return;
    enregistrerDossier().then(function () {
      avis(T.enregistre, true);
    });
  });
})();
</script>
